<title>Provo Security+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: patch-panel index on home (one row per module, like a labeled patch panel), single-column drill views; T568B pair colors accent the cram cards. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --sunk:#E6ECF5; --ink:#12223D; --muted:#4F5F78; --line:#D3DCEA; --brand:#2258A9; --logo:#2258A9; --ctred:#C8202F; --pv1:#2360A6; --pv2:#2E8657; --pv3:#B8860B; --pv4:#C23A3A; --pv5:#6B5B95;
  --orange:#2258A9; --blue:#2258A9; --brown:#7B4F2E; --green:#2E8657; --violet:#6B4FA8; --gold:#A87600;
  --accent:var(--orange); --accent-ink:#FFFFFF;
  --ok:#1E8A55; --ok-bg:#E3F4EA; --warn:#A8650A; --warn-bg:#FCF0DC; --bad:#C23A3A; --bad-bg:#FBE7E7; --pick:#2360A6; --pick-bg:#E4EDF8;
  --font-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --font-body:"Montserrat","Segoe UI",system-ui,sans-serif;
  --font-mono:"Atkinson Hyperlegible Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181B; --surface:#1F2226; --sunk:#272A2F; --ink:#E8E9EB; --muted:#A3A7AD; --line:#33373D; --brand:#7FA8E6; --logo:#5E93E0; --ctred:#F0646E; --pv1:#6EA4E8; --pv2:#4DBA80; --pv3:#E8C25A; --pv4:#F07070; --pv5:#A994E0;
  --orange:#7FA8E6; --blue:#7FA8E6; --brown:#C08B62; --green:#4DBA80; --violet:#A994E0; --gold:#E8C25A;
  --accent-ink:#16181B; --ok:#4DBA80; --ok-bg:#12301F; --warn:#F0B45A; --warn-bg:#3A2A10; --bad:#F07070; --bad-bg:#3A1717; --pick:#6EA4E8; --pick-bg:#17304E;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16181B; --surface:#1F2226; --sunk:#272A2F; --ink:#E8E9EB; --muted:#A3A7AD; --line:#33373D; --brand:#7FA8E6; --logo:#5E93E0; --ctred:#F0646E; --pv1:#6EA4E8; --pv2:#4DBA80; --pv3:#E8C25A; --pv4:#F07070; --pv5:#A994E0;
  --orange:#7FA8E6; --blue:#7FA8E6; --brown:#C08B62; --green:#4DBA80; --violet:#A994E0; --gold:#E8C25A;
  --accent-ink:#16181B; --ok:#4DBA80; --ok-bg:#12301F; --warn:#F0B45A; --warn-bg:#3A2A10; --bad:#F07070; --bad-bg:#3A1717; --pick:#6EA4E8; --pick-bg:#17304E;
  color-scheme:dark }

html{font-size:16px}
html.instructor{font-size:20px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:var(--font-mono)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:0}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.badge{font-family:var(--font-mono);font-size:.72rem;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.timer{display:none;align-items:center;gap:6px}
html.instructor .timer{display:inline-flex}
.timer .t{font-family:var(--font-mono);font-size:1.1rem;min-width:3.6em;text-align:center;font-weight:600}
.timer .t.done{color:var(--bad)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:.82rem}
.chipbtn:hover{border-color:var(--muted)}

main{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;margin:6px 0 26px}
.hero h1{font-size:2.6rem;line-height:1.05;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.kicker{font-size:.82rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:4px}
.soon-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}
.examcode{font-family:var(--font-body);font-size:.42em;font-weight:700;color:var(--ctred);letter-spacing:.06em;align-self:flex-end;margin-bottom:.32em}
.hero h1 .vendor{flex-basis:100%;font-size:.42em;font-weight:700;color:var(--ctred);letter-spacing:.02em;line-height:1;margin-bottom:-2px}
.hero-art{width:100%;max-width:380px;justify-self:end;display:block}
.hero-art line{stroke-width:2}
.hero-art .links line{stroke:var(--line)}
.hero-art .flow line{stroke-width:2.5;stroke-dasharray:4 22;stroke-linecap:round;animation:nftflow 2.8s linear infinite}
.hero-art .sweep{transform-origin:180px 95px;animation:radarsweep 4.5s linear infinite}
.hero-art .blip{animation:radarblip 4.5s ease-in-out infinite}
@keyframes radarsweep{to{transform:rotate(360deg)}}
@keyframes radarblip{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes nftflow{to{stroke-dashoffset:-104}}
.hero p{color:var(--muted);margin:.6rem 0 0;max-width:56ch;font-size:1.05rem}
.weights{margin:0 0 26px}
.wbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.wbar div{display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.wlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.wlegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:-1px}
.d1{--c:#2360A6}.d2{--c:#2E8657}.d3{--c:#B8860B}.d4{--c:#C23A3A}.d5{--c:#6B5B95}

.section-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stages{display:grid;gap:18px}
.stage-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 8px}
.stage-n{font-family:var(--font-mono);font-size:.76rem;font-weight:600;color:var(--orange);text-transform:uppercase;letter-spacing:.06em}
.stage-h h2{font-size:1.15rem;font-weight:700}
.stage-h p{margin:0;color:var(--muted);font-size:.9rem}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 170px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--sunk)}
.jack{width:44px;height:36px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:.9rem;position:relative}
.jack::after{content:"";position:absolute;bottom:5px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--line)}
.prow h3{font-size:1.12rem;font-weight:600}
.prow p{margin:0;color:var(--muted);font-size:.9rem}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;white-space:nowrap}
.rank{--rc:var(--muted);display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:.74rem;font-weight:700;color:var(--rc);white-space:nowrap;cursor:help;letter-spacing:.01em}
.rank.r1{--rc:var(--blue)}.rank.r2{--rc:var(--green)}.rank.r3{--rc:var(--violet)}.rank.r4{--rc:var(--orange)}.rank.r5{--rc:var(--gold)}.rank.r6{--rc:var(--gold);text-shadow:0 0 8px color-mix(in srgb,var(--gold) 60%,transparent)}
.rank .bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.rank .bars i{display:block;width:3px;border-radius:1px;background:var(--line)}
.rank .bars i:nth-child(1){height:3px}.rank .bars i:nth-child(2){height:4.5px}.rank .bars i:nth-child(3){height:6px}.rank .bars i:nth-child(4){height:7.5px}.rank .bars i:nth-child(5){height:9px}.rank .bars i:nth-child(6){height:10.5px}.rank .bars i:nth-child(7){height:12px}
.rank.r5 .bars i.on,.rank.r6 .bars i.on{background:linear-gradient(var(--gold),var(--orange))}
.rank.r6 .bars i.on{box-shadow:0 0 5px var(--gold)}

.brand .brand-div{width:1px;align-self:stretch;min-height:30px;background:var(--line);margin:0 4px}
.brand .pvwrap{display:inline-flex;flex-direction:column;gap:3px}
.brand b.pvname{font-weight:300;letter-spacing:.01em;font-size:1.6rem;line-height:1.1;color:var(--logo)}
.brand .pvpro{font-weight:600}
.brand .pvbar{display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden}
.brand .pvbar i{display:block}
.pvbar .pv1{background:var(--pv1)}.pvbar .pv2{background:var(--pv2)}.pvbar .pv3{background:var(--pv3)}.pvbar .pv4{background:var(--pv4)}.pvbar .pv5{background:var(--pv5)}
html.mobile .brand .mycc-logo{height:32px}
.rank .ring{width:15px;height:15px;flex:none}
.rank .ring .tr{stroke:var(--line)}
.rank .ring .fg{stroke:var(--rc)}
.rank .ring .dot{fill:var(--rc)}
.rank.r1{--rc:var(--ink)}.rank.r2{--rc:var(--ink)}.rank.r3{--rc:var(--brand)}.rank.r4{--rc:var(--brand);text-shadow:none}
/* Grandmaster: the module glows */
.prow.gm{box-shadow:inset 0 0 0 2px var(--brand);background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface) 65%);animation:gmrow 3s ease-in-out infinite}
@keyframes gmrow{0%,100%{box-shadow:inset 0 0 0 2px var(--brand),inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 2px var(--brand),inset 0 0 22px 0 color-mix(in srgb,var(--brand) 35%,transparent)}}
.gm-aura{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 60px 8px color-mix(in srgb,var(--gold) 38%,transparent);animation:gmaura 3.2s ease-in-out infinite}
@keyframes gmaura{0%,100%{opacity:.55}50%{opacity:1}}
.gm-banner{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--gold);background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));font-weight:700}
.gm-banner span{font-weight:500;color:var(--muted)}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border-radius:999px;background:var(--gold);color:#241800;font-weight:700;font-size:.85rem}
.badge-plate .reward{display:flex;width:max-content;margin-top:6px}
.secret-zone{margin-top:14px;padding:12px 14px;border-radius:10px;border:1.5px dashed var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.rank .bars i.on{background:var(--rc)}
.prow h3 .rank{margin-left:10px;vertical-align:.1em}
.mhead .rank{font-size:.85rem}
.mhead .rank .bars{height:14px}
.badge-plate{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.badge-plate b{display:block;font-size:1rem}
.badge-plate small{color:var(--muted);font-size:.82rem}
.pbadge{flex:none;display:block}
.pbadge .fi{fill:var(--bi)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-top:12px}
.gallery figure{margin:0;text-align:center;font-size:.74rem;color:var(--muted);display:grid;justify-items:center;gap:4px}
.gallery figure.on{color:var(--ink);font-weight:600}
.gallery figure.cur svg{filter:drop-shadow(0 0 6px var(--orange))}
.mastery-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:520px){.mastery-card{grid-template-columns:1fr}}
.acro-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:4px}
.acro-mode{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.acro-mode h4{margin:0 0 4px;font-family:var(--font-display);font-size:1.15rem}
.acro-mode p{margin:0 0 8px;color:var(--muted);font-size:.92rem}
.osi-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.osi-chip{border:1px solid var(--line);border-radius:8px;padding:6px 6px 5px;background:var(--surface);display:grid;gap:1px;text-align:center;min-width:0}
.osi-chip b{font-family:var(--font-mono);font-size:1rem}
.osi-chip span{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osi-chip small{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.osi-chip.on{border-color:var(--green);background:var(--ok-bg)}
.osi-chip.on small{color:var(--ok);font-weight:700}
@media (max-width:560px){.osi-chip span{display:none} .osi-chip.on small{font-size:0} .osi-chip.on small::after{content:"\2713";font-size:.95rem} .osi-strip{gap:4px} .osi-chip{padding:5px 2px}}
html.mobile .osi-chip span{display:none}
html.mobile .osi-chip.on small{font-size:0}
html.mobile .osi-chip.on small::after{content:"\2713";font-size:.95rem}
html.mobile .osi-strip{gap:4px}
html.mobile .osi-chip{padding:5px 2px}
.osi-strip.words{grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
.osi-strip.words b{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sn-chip{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;display:grid;gap:1px;background:var(--surface);cursor:help}
.sn-chip b{font-family:var(--font-mono);font-size:.95rem}
.sn-chip small{font-family:var(--font-mono);font-size:.74rem;color:var(--muted)}
.sn-chip.on{border-color:var(--green);background:var(--ok-bg)}
.sn-chip.on small{color:var(--ok);font-weight:700}
pre.cli{margin:.6em 0 .2em;padding:10px 12px;border-radius:8px;background:#141A21;color:#D7E3EE;font-family:var(--font-mono);font-size:.82rem;line-height:1.45;overflow-x:auto;white-space:pre;max-width:100%}
.rank-key{margin:-2px 0 12px;font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.wire{width:26px;height:9px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--w) 0 5px,var(--surface) 5px 8px);border:1px solid var(--w)}
.t1{--w:var(--orange)}.t2{--w:var(--blue)}.t3{--w:var(--brown)}.t0{--w:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--green)}
.mcap{font-size:.75rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
html.instructor .mcol{visibility:hidden}

/* Module view */
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:14px}
.mhead h2{font-size:1.7rem;font-weight:700;margin-right:auto}
.back{font-size:.9rem;text-decoration:none;color:var(--muted);display:inline-block;margin-bottom:6px}
.covers{color:var(--muted);font-size:.9rem;margin:-6px 0 16px;max-width:75ch}
.score{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.15;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;cursor:help}
.score small{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.score b{font-family:var(--font-mono);font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.score[data-state="none"] b{color:var(--muted);font-family:var(--font-body);font-weight:500}
.score[data-state="good"]{border-color:var(--ok);background:var(--ok-bg)}.score[data-state="good"] b{color:var(--ok)}
.score[data-state="mid"]{border-color:var(--warn);background:var(--warn-bg)}.score[data-state="mid"] b{color:var(--warn)}
.score[data-state="low"]{border-color:var(--bad);background:var(--bad-bg)}.score[data-state="low"] b{color:var(--bad)}
.strength{letter-spacing:.12em;color:var(--green)}
html.instructor .score{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.dom{color:#fff;background:var(--c)}
.q-prompt{font-size:1.15rem;line-height:1.45;margin-bottom:16px;max-width:75ch}
.q-prompt .big{font-family:var(--font-mono);font-size:2rem;font-weight:600;display:block;margin:.2em 0}
.q-prompt mark{background:transparent;color:var(--orange);font-weight:700;border-bottom:2px solid var(--orange)}
.opts{display:grid;gap:8px}
.opts.grid7{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.picopts{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.picopts .opt{flex-direction:column;align-items:stretch;padding:8px}
.opts.picopts .opt .k{align-self:flex-start}
.opts.picopts .mpic{max-width:170px}
.mpic{display:block;width:100%;max-width:240px;height:auto;margin:0 auto}
.q-prompt .mpic{max-width:280px;margin:8px 0 4px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:.85rem}
.opt .tx{min-width:0}
.opt.picked{border-color:var(--pick);background:var(--pick-bg)}
.opt.picked .k{background:var(--pick);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.q-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}

<script>
"use strict";
/* ================= DATA ================= */
/* CompTIA Security+ SY0-701. Domains and weights from the official exam objectives. */
const DOM = {1:"1.0 General Concepts",2:"2.0 Threats & Mitigations",3:"3.0 Architecture",4:"4.0 Operations",5:"5.0 Program Management"};
const DOM_LONG = {1:"General Security Concepts",2:"Threats, Vulnerabilities, and Mitigations",3:"Security Architecture",4:"Security Operations",5:"Security Program Management and Oversight"};
const DOMW = {1:12,2:22,3:18,4:28,5:20};
const DOMC = {1:"#2360A6",2:"#2E8657",3:"#B8860B",4:"#C23A3A",5:"#6B5B95"};
/* Study advice shown after a mini-exam for the weakest domain */
const DOM_ADVICE = {1:"Drill modules 02 and 03.",2:"Drill modules 04 and 05.",3:"Drill module 06.",4:"Drill modules 07, 08, and 09.",5:"Drill module 10."};

/* Question qualifiers: eight scenarios per qualifier. Each qualifier needs QUAL_NEED different correct answers to master. */
const QUAL = [
 {id:"q1",d:4,qual:"FIRST",q:"A user reports that files on a shared drive are being renamed with a strange extension and a ransom note has appeared. Which of the following should the security analyst do FIRST?",o:["Disconnect the affected system from the network","Restore the shared drive from the most recent backup","Run a full antivirus scan on every server","Notify law enforcement"],a:0,x:"Containment comes before eradication and recovery. Isolating the system stops the ransomware from encrypting more files. Restoring from backup first would let the infection keep spreading, and a full scan or a call to law enforcement can wait until the spread is stopped."},
 {id:"q2",d:4,qual:"NEXT",q:"An analyst has isolated a compromised web server and confirmed which malware is on it. Which of the following should the analyst do NEXT?",o:["Remove the malware and the persistence it created","Return the server to production","Write the lessons-learned report","Disconnect the rest of the network"],a:0,x:"The server is contained and the threat is identified, so the next incident response step is eradication: removing the malware. Recovery (returning it to production) and lessons learned come after eradication."},
 {id:"q3",d:4,qual:"BEST",q:"Employees keep reusing passwords that were exposed in breaches of other websites. Which of the following is the BEST way to stop attackers from logging in with those passwords?",o:["Require multifactor authentication","Force a password change every 30 days","Increase the minimum password length to 10 characters","Publish a policy that bans password reuse"],a:0,x:"With multifactor authentication, a stolen password alone is not enough to log in. Frequent changes and longer passwords do not stop an attacker who already holds a valid password, and a policy alone does not technically prevent reuse."},
 {id:"q4",d:2,qual:"MOST likely",q:"Several employees receive a text message that appears to be from the CEO, asking them to buy gift cards urgently and send the codes. Which of the following attacks is MOST likely taking place?",o:["Smishing","Vishing","Whaling","Watering hole"],a:0,x:"A fraudulent text message is smishing (SMS phishing). Vishing uses voice calls. Whaling targets senior executives as the victims, but here the executive is only impersonated. A watering hole attack compromises a website the targets visit."},
 {id:"q5",d:5,qual:"MINIMUM",q:"A company must keep a vendor from reading confidential product plans that will be shared during a project. Which of the following is the MINIMUM agreement needed before sharing the plans?",o:["Non-disclosure agreement (NDA)","Service-level agreement (SLA)","Master service agreement (MSA)","Memorandum of understanding (MOU)"],a:0,x:"An NDA is the agreement that legally binds the vendor to keep the information confidential. An SLA sets service levels, an MSA sets general terms for future work, and an MOU states intent without enforceable confidentiality terms."},
 {id:"q6",d:4,qual:"FIRST",q:"An analyst sees an EDR alert that a workstation is beaconing to a known command-and-control server. Which of the following should the analyst do FIRST?",o:["Isolate the workstation from the network","Reimage the workstation","Interview the user about recent emails","Update the firewall's threat feed"],a:0,x:"Containment comes first: isolating the host stops the attacker from using it while evidence is preserved. Reimaging is eradication and recovery, and it destroys evidence if done before analysis."},
 {id:"q7",d:4,qual:"FIRST",q:"A forensic investigator arrives at a running server that is suspected of being compromised. Which of the following should the investigator collect FIRST?",o:["The contents of memory","An image of the hard drive","The server's backup tapes","The firewall logs"],a:0,x:"By the order of volatility, memory is lost first, so it is captured before the disk. The disk image comes next and is just as important, but it will still be there in a few minutes."},
 {id:"q8",d:5,qual:"FIRST",q:"A company wants to start a risk management program. Which of the following should it do FIRST?",o:["Identify and inventory its assets","Buy cybersecurity insurance","Choose a risk response for each risk","Calculate the ALE for each risk"],a:0,x:"You cannot assess risk to assets you have not identified. Calculating ALE and choosing responses depend on knowing the assets and their value first."},
 {id:"q9",d:1,qual:"FIRST",q:"A change to a production firewall has been requested. Which of the following should happen FIRST?",o:["The change goes through the approval process","The change is applied during the next maintenance window","The documentation is updated","The change is tested in production"],a:0,x:"A change must be reviewed and approved before it is scheduled, made, or documented. Scheduling in a maintenance window is right, but only after approval."},
 {id:"q10",d:4,qual:"FIRST",q:"A user reports that a laptop containing customer data was stolen from a car. Which of the following should the security team do FIRST?",o:["Send a remote wipe command through MDM","Report the theft to the insurance company","Order a replacement laptop","Update the asset inventory"],a:0,x:"Stopping exposure of the customer data comes first, and MDM can lock or wipe the device. Insurance, replacement, and inventory updates can all wait."},
 {id:"q11",d:4,qual:"FIRST",q:"An organization is building its incident response capability. Which phase should it complete FIRST?",o:["Preparation","Detection","Containment","Lessons learned"],a:0,x:"Preparation, meaning the plan, the team, the tools, and the training, must exist before any incident can be handled well."},
 {id:"q12",d:4,qual:"FIRST",q:"A security analyst receives a report of a suspected phishing email that several employees opened. Which of the following should the analyst do FIRST?",o:["Determine who clicked the link or entered credentials","Send a company-wide awareness training course","Block the sender's entire country at the firewall","Write the lessons-learned report"],a:0,x:"The analyst must first scope the incident by finding out who interacted with the email, so those accounts and machines can be contained. Training and reports come later, and blocking a country is too broad."},
 {id:"q13",d:4,qual:"NEXT",q:"Malware has been removed from a server and the vulnerability it used has been patched. Which of the following should the team do NEXT?",o:["Restore the server to production and monitor it","Hold the lessons-learned meeting","Isolate the server from the network","Begin detection and analysis"],a:0,x:"After eradication comes recovery: returning the system to service and watching it closely. Lessons learned follows recovery, and isolation was already done in containment."},
 {id:"q14",d:4,qual:"NEXT",q:"Systems affected by an incident have been restored and are running normally. Which of the following should happen NEXT?",o:["Hold a lessons-learned review","Reimage every workstation in the company","Disconnect the restored systems","Rewrite the incident response plan from scratch"],a:0,x:"Once recovery is complete, the team reviews what happened and what to improve. The review may lead to plan updates, but not a rewrite from scratch."},
 {id:"q15",d:4,qual:"NEXT",q:"A vulnerability scan has identified a critical flaw on a web server, and the analyst has confirmed it is not a false positive. What should the analyst do NEXT?",o:["Prioritize and remediate the vulnerability","Rescan to confirm the fix","Close the finding as an exception","Run the same scan again without changes"],a:0,x:"Once a finding is confirmed, the next step is to prioritize and fix it, for example by patching. Rescanning confirms a fix, so it comes after remediation."},
 {id:"q16",d:4,qual:"NEXT",q:"An investigator has created a forensic image of a seized drive. Which of the following should the investigator do NEXT?",o:["Hash the image and compare it with the original drive's hash","Analyze the original drive directly","Return the drive to its owner","Delete the image once the report is written"],a:0,x:"Matching hashes prove the image is an exact copy, which preserves the integrity of the evidence before analysis begins. Analysis is then done on the copy, never the original."},
 {id:"q17",d:1,qual:"NEXT",q:"A change has been approved, tested, and successfully carried out during the maintenance window. What should happen NEXT?",o:["Update the documentation and diagrams","Request approval for the change","Write a backout plan","Run an impact analysis"],a:0,x:"After a successful change, documentation must be updated so it matches the new state. Approval, backout planning, and impact analysis all come before the change."},
 {id:"q18",d:5,qual:"NEXT",q:"A risk assessment has identified and rated the company's risks. What should the company do NEXT?",o:["Choose a response for each risk","Identify the company's assets","Buy insurance for every risk","Close the risk register"],a:0,x:"After identifying and rating risks, the company decides how to handle each one: accept, avoid, transfer, or mitigate. Insurance is only one possible response."},
 {id:"q19",d:4,qual:"NEXT",q:"An analyst has confirmed that an alert shows a real intrusion on two servers. Which incident response step comes NEXT?",o:["Containment","Detection","Recovery","Preparation"],a:0,x:"After the incident is confirmed and scoped in analysis, the next step is to contain it so it cannot spread."},
 {id:"q20",d:4,qual:"BEST",q:"A company wants to stop employees from emailing files that contain customer credit card numbers to outside addresses. Which of the following is the BEST control?",o:["Data loss prevention","Full-disk encryption","A web application firewall","An acceptable use policy"],a:0,x:"DLP inspects outgoing content and blocks sensitive data such as card numbers. An acceptable use policy helps, but it relies on people following it and does not block anything."},
 {id:"q21",d:3,qual:"BEST",q:"A company's web application is being hit by SQL injection and cross-site scripting attempts. Which of the following is the BEST network control to add in front of it?",o:["Web application firewall","Load balancer","Proxy server","Layer 4 firewall"],a:0,x:"A WAF inspects HTTP requests and blocks web attacks such as SQL injection and XSS. A Layer 4 firewall only sees ports and addresses, so it cannot tell a malicious request from a normal one."},
 {id:"q22",d:4,qual:"BEST",q:"An organization wants to reduce successful phishing attacks. Which of the following is the BEST approach?",o:["Security awareness training combined with email filtering","Blocking all email attachments","Requiring longer passwords","Disabling all external email"],a:0,x:"Training helps people spot phishing, and filtering stops much of it before it arrives, so together they address the problem from both sides. Blocking all attachments or all external email would stop the business from working."},
 {id:"q23",d:3,qual:"BEST",q:"A company must protect data on laptops that employees take while traveling, in case a laptop is lost. Which of the following is the BEST solution?",o:["Full-disk encryption","File-level encryption on selected folders","A strong BIOS password","Cable locks"],a:0,x:"Full-disk encryption protects everything on the drive, including temporary files and the operating system. File-level encryption leaves anything outside the chosen folders exposed."},
 {id:"q24",d:4,qual:"BEST",q:"An administrator needs a secure way to manage Linux servers remotely from the command line. Which protocol is the BEST choice?",o:["SSH","Telnet","RDP","SNMPv1"],a:0,x:"SSH encrypts remote command-line sessions. Telnet sends everything in clear text, RDP is a graphical desktop protocol, and SNMPv1 is for monitoring and is not secure."},
 {id:"q25",d:2,qual:"BEST",q:"A company cannot patch a critical vulnerability in an industrial controller for six months. Which of the following is the BEST way to reduce the risk until then?",o:["Isolate the controller on a segmented network","Accept the risk and take no action","Replace all controllers immediately","Disable logging on the controller"],a:0,x:"Segmentation is a compensating control that limits who can reach the vulnerable device until it can be patched. Replacing everything immediately may be impossible, and taking no action leaves the risk in place."},
 {id:"q26",d:5,qual:"BEST",q:"A company relies on one cloud provider for its customer portal. Which contract provision BEST protects the company if the provider's uptime falls short?",o:["A service-level agreement with penalties","A non-disclosure agreement","A memorandum of understanding","A right-to-audit clause"],a:0,x:"An SLA defines required uptime and the penalties or credits if the provider misses it. A right-to-audit clause lets you check controls, but it does not compensate you for downtime."},
 {id:"q27",d:2,qual:"MOST likely",q:"Several users report that a website they visit every day now asks them to install a browser update before continuing, and their machines become infected. The site belongs to a trade association they all use. Which attack is MOST likely?",o:["Watering hole attack","Typosquatting","Spear phishing","On-path attack"],a:0,x:"A legitimate site that the targets visit regularly was compromised, which is a watering hole attack. Typosquatting would need them to mistype the address."},
 {id:"q28",d:2,qual:"MOST likely",q:"A help desk technician receives a call from someone claiming to be a new executive who is locked out and needs a password reset immediately before a board meeting. Which technique is the caller MOST likely using?",o:["Pretexting with urgency","Watering hole attack","Shoulder surfing","Dumpster diving"],a:0,x:"The caller uses an invented story (the pretext) and pressure (urgency) to get the reset. Because it happens by phone, it is also vishing, but the technique being used is the pretext."},
 {id:"q29",d:2,qual:"MOST likely",q:"Authentication logs show one failed login attempt for each of 3,000 accounts, all within an hour, all using the password Winter2026!. Which attack is MOST likely occurring?",o:["Password spraying","Brute force","Credential stuffing","Dictionary attack on one account"],a:0,x:"One common password tried across many accounts is password spraying. Credential stuffing uses different username and password pairs stolen from other breaches."},
 {id:"q30",d:2,qual:"MOST likely",q:"A server's CPU usage stays at 100% at night, outbound traffic goes to known cryptocurrency pools, and no new jobs were scheduled. What is the MOST likely cause?",o:["Cryptomining malware","A DDoS attack against the server","A failing hard drive","A logic bomb"],a:0,x:"High CPU combined with traffic to mining pools points to unauthorized cryptocurrency mining. A DDoS attack would show inbound floods, not outbound mining traffic."},
 {id:"q31",d:2,qual:"MOST likely",q:"A former administrator's account was disabled on Friday. On Monday, the payroll database is deleted by a script that ran when the account was removed. What is this MOST likely?",o:["Logic bomb","Ransomware","Worm","Remote access Trojan"],a:0,x:"Code that runs when a specific condition is met, here the account being removed, is a logic bomb."},
 {id:"q32",d:4,qual:"MOST likely",q:"A user's account shows active sessions from three different computers at the same time, but the user has only one laptop. What does this MOST likely indicate?",o:["The user's credentials are compromised","The SIEM clock is wrong","The user has a roaming profile","The VPN is load balancing the user"],a:0,x:"Concurrent sessions the user cannot explain are a strong sign that someone else is using the credentials."},
 {id:"q33",d:2,qual:"MOST likely",q:"Users at a coffee shop connect to a Wi-Fi network named CoffeeShop-Free, and their login sessions are later stolen. The shop's real network is CoffeeShop. Which attack MOST likely occurred?",o:["Evil twin","Bluesnarfing","Jamming","WPS PIN attack"],a:0,x:"A look-alike access point that lures users is an evil twin. It lets the attacker sit on the path of their traffic."},
 {id:"q34",d:3,qual:"MINIMUM",q:"A contractor needs to update one web page on a company server. Which access should the contractor be given, at MINIMUM?",o:["Write access to that page's folder only","Administrator access to the web server","Read access to the whole server","Domain user rights with VPN access to everything"],a:0,x:"Least privilege gives only what the task requires: write access to the one folder. Admin access would work but gives far more than the job needs."},
 {id:"q35",d:4,qual:"MINIMUM",q:"A company wants to meet an MFA requirement for remote access. Employees already enter a password. Which of the following is the MINIMUM addition that meets the requirement?",o:["A code from an authenticator app","A second password","A security question","A longer password"],a:0,x:"MFA needs a second factor of a different type. A code from an app on the user's phone is something you have. A second password and a security question are both still something you know."},
 {id:"q36",d:3,qual:"MINIMUM",q:"A public web server only needs to serve its site over HTTPS. Which inbound firewall rule is the MINIMUM needed?",o:["Allow TCP 443 only","Allow TCP 80 and 443","Allow TCP 443 and 22","Allow all TCP traffic"],a:0,x:"HTTPS uses TCP 443, so that is the only port the site needs. Port 80 is often added to redirect visitors to HTTPS, which is reasonable, but it is not required. Port 22 opens SSH to the internet for no reason."},
 {id:"q37",d:3,qual:"MINIMUM",q:"A small office must be able to survive the loss of any single hard drive in its file server without losing data. Which RAID level is the MINIMUM that provides this?",o:["RAID 1","RAID 0","RAID 6","RAID 10"],a:0,x:"RAID 1 mirrors two drives, so one can fail without data loss. RAID 0 has no redundancy. RAID 6 and RAID 10 also survive a failed drive, but they need more drives than the minimum."},
 {id:"q38",d:4,qual:"MINIMUM",q:"A help desk team must reset users' passwords in Active Directory. Which permission should it be given, at MINIMUM?",o:["Delegated rights to reset passwords on user accounts","Domain Admins membership","Enterprise Admins membership","Full control of the user accounts' organizational unit"],a:0,x:"Delegating only the reset-password right gives the team exactly what it needs. Domain Admins and full control would work but grant far more power than the task needs."},
 {id:"q39",d:3,qual:"MINIMUM",q:"A company's RPO for its order database is 24 hours. What is the MINIMUM backup frequency that meets it?",o:["Once a day","Once a week","Every hour","Continuous replication"],a:0,x:"An RPO of 24 hours means losing up to a day of data is acceptable, so a daily backup is the least that meets it. Hourly backups and replication also meet it but cost more than the minimum."},
 {id:"q40",d:5,qual:"MINIMUM",q:"A new service account runs a nightly script that reads one database table. What permissions should the account have, at MINIMUM?",o:["Read access to that one table","Read and write access to the database","Database owner rights","Local administrator on the database server"],a:0,x:"The script only reads one table, so read access to that table is the least privilege that works. Anything more gives an attacker who steals the account more to abuse."}

function acroSame(a,b){ return a.x===b.x || a.d===b.d || ACRO_SAME.some(s=>s.includes(a.id)&&s.includes(b.id)); }

/* Multiple-choice bank for the mini-exams, roughly in proportion to the domain weights. The qualifier questions are added to the pool too. */
const BANK = [
 {id:"b1",d:1,q:"A company installs bright lighting and signs warning that the parking lot is monitored by cameras. Which type of control are the signs?",o:["Deterrent","Detective","Corrective","Compensating"],a:0,x:"Signs discourage an attacker from trying, which makes them deterrent. Detective controls find incidents (the camera recordings would be detective), corrective controls fix damage, and compensating controls stand in for a primary control that cannot be used."},
 {id:"b2",d:1,q:"A developer must store user passwords so that two users with the same password do not end up with the same stored value. Which of the following should the developer use?",o:["Salting","Encryption","Tokenization","Data masking"],a:0,x:"A salt adds random data to each password before it is hashed, so identical passwords produce different hashes. Encryption is reversible and not the right tool for password storage, and tokenization and masking protect data such as card numbers."},
 {id:"b3",d:1,q:"Which of the following provides integrity, authentication, and non-repudiation for an email message?",o:["Digital signature","Symmetric encryption","Hashing alone","Key escrow"],a:0,x:"A digital signature is a hash encrypted with the sender's private key. It proves the message was not changed (integrity), who sent it (authentication), and that the sender cannot deny it (non-repudiation). A hash alone gives integrity only, symmetric encryption gives confidentiality, and key escrow is key recovery."},
 {id:"b4",d:2,q:"A web application log shows the input ' OR 1=1 -- submitted in the username field of the login page. Which attack does this indicate?",o:["SQL injection","Cross-site scripting","Buffer overflow","Directory traversal"],a:0,x:"The quote, the always-true condition 1=1, and the comment marker are classic SQL injection. Cross-site scripting injects script tags, a buffer overflow sends oversized input, and directory traversal uses ../ sequences."},
 {id:"b5",d:2,q:"An attacker registers the domain examp1e.com, replacing the letter l with the number 1, to catch users who mistype the company's address. What is this called?",o:["Typosquatting","Watering hole","Pharming","Domain hijacking"],a:0,x:"Registering a look-alike or misspelled domain is typosquatting. A watering hole compromises a real site the targets visit, pharming redirects traffic through poisoned DNS or hosts files, and domain hijacking takes over a legitimate domain's registration."},
 {id:"b6",d:2,q:"Logs show a few failed logins for each of hundreds of different accounts, all using the same common password. Which attack is this?",o:["Password spraying","Brute force against one account","Credential replay","Rainbow table attack"],a:0,x:"Password spraying tries one or a few common passwords across many accounts to stay under lockout thresholds. A brute-force attack hammers a single account, credential replay reuses captured credentials, and rainbow tables crack stolen hashes offline."},
 {id:"b7",d:3,q:"A company wants a recovery site that can take over within minutes because it is already running with current data. Which type of site meets this need?",o:["Hot site","Warm site","Cold site","Mobile site"],a:0,x:"A hot site is fully equipped and running, so it can take over almost immediately. A warm site needs time to load current data, and a cold site has only space and power."},
 {id:"b8",d:3,q:"A retailer replaces stored credit card numbers with random values and keeps the real numbers in a separate, secured vault. Which technique is this?",o:["Tokenization","Hashing","Data masking","Steganography"],a:0,x:"Tokenization swaps sensitive data for a token that maps back to the original in a protected vault. Hashing is one-way, masking only hides part of the value when displayed, and steganography hides data inside other data."},
 {id:"b9",d:3,q:"An engineer wants every new server to be deployed with exactly the same secure configuration from version-controlled files. Which of the following should the engineer use?",o:["Infrastructure as code","Microservices","Serverless computing","Air gapping"],a:0,x:"Infrastructure as code defines systems in configuration files, so each deployment is identical and changes are tracked. Microservices and serverless describe how applications are built and run, and an air gap isolates a system from networks."},
 {id:"b10",d:4,q:"A vulnerability scan reports a critical flaw on a server, but the analyst confirms the affected software is not installed. What is this result?",o:["False positive","False negative","True positive","True negative"],a:0,x:"The scanner reported a problem that does not exist, which is a false positive. A false negative is a real problem the scanner missed."},
 {id:"b11",d:4,q:"A security team wants a system that collects logs from firewalls, servers, and endpoints and correlates them to raise alerts. Which tool should it deploy?",o:["SIEM","SOAR","DLP","EDR"],a:0,x:"A SIEM collects and correlates logs from many sources and raises alerts. SOAR automates the response to alerts, DLP stops sensitive data from leaving, and EDR monitors individual endpoints."},
 {id:"b12",d:4,q:"During an investigation, an analyst records the name of every person who handles a seized laptop, along with the time and the reason. What is this record called?",o:["Chain of custody","Legal hold","E-discovery","Root cause analysis"],a:0,x:"The chain of custody documents everyone who handled evidence, so it stays admissible. A legal hold preserves data for litigation, e-discovery collects electronic information for legal proceedings, and root cause analysis finds why the incident happened."},
 {id:"b13",d:5,q:"A company buys cybersecurity insurance to cover the cost of a possible data breach. Which risk response is this?",o:["Transfer","Accept","Avoid","Mitigate"],a:0,x:"Insurance shifts the financial impact to another party, which is risk transference. Accepting means taking no action, avoiding means stopping the risky activity, and mitigating means reducing the risk with controls."},
 {id:"b14",d:5,q:"A server worth $20,000 would lose 25% of its value in a flood, and a flood is expected once every four years. What is the annualized loss expectancy (ALE)?",o:["$1,250","$5,000","$20,000","$80,000"],a:0,x:"Single loss expectancy = $20,000 × 0.25 = $5,000. The annualized rate of occurrence is once every four years, or 0.25. ALE = $5,000 × 0.25 = $1,250."},
 {id:"b15",d:5,q:"Before signing with a cloud provider, a company wants the contractual right to inspect the provider's security controls. Which contract term provides this?",o:["Right-to-audit clause","Service-level agreement","Non-disclosure agreement","Memorandum of understanding"],a:0,x:"A right-to-audit clause lets the customer assess the vendor's security. An SLA defines service levels, an NDA covers confidentiality, and an MOU states intent without the same enforceable terms."},
 {id:"b16",d:1,q:"A company cannot install a badge reader on a server room door for six months, so it posts a guard at the door until then. Which type of control is the guard?",o:["Compensating","Deterrent","Directive","Corrective"],a:0,x:"The guard stands in for the primary control (the badge reader) that cannot be put in place yet, which makes it compensating. A guard may also deter, but the question is about replacing a missing control."},
 {id:"b17",d:1,q:"Which of the following BEST describes the purpose of a backout plan in change management?",o:["To return systems to their previous state if a change fails","To list the stakeholders who must approve the change","To schedule the change during a maintenance window","To document the business reason for the change"],a:0,x:"A backout plan explains how to undo a change and restore the previous state if something goes wrong. Approval, scheduling, and justification are separate parts of the change request."},
 {id:"b18",d:1,q:"In a zero trust architecture, which component makes the decision to grant or deny an access request?",o:["Policy engine","Policy enforcement point","Policy administrator","Data plane"],a:0,x:"The policy engine evaluates the request against policy and decides. The policy administrator carries out that decision, and the policy enforcement point, in the data plane, lets the traffic through or blocks it."},
 {id:"b19",d:1,q:"A security team places a file named Q4-salaries.xlsx on a file server. It contains no real data, and opening it sends an alert. What is this file?",o:["Honeyfile","Honeypot","Honeynet","DNS sinkhole"],a:0,x:"A honeyfile is a decoy file that alerts when someone opens it. A honeypot is a decoy system, a honeynet is a network of decoys, and a DNS sinkhole redirects lookups for malicious domains."},
 {id:"b20",d:1,q:"A user sends an encrypted email to a coworker using asymmetric encryption. Which key is used to encrypt the message?",o:["The coworker's public key","The coworker's private key","The user's private key","The user's public key"],a:0,x:"To keep a message confidential, you encrypt it with the recipient's public key, so only the recipient's private key can decrypt it. Signing, by contrast, uses the sender's private key."},
 {id:"b21",d:1,q:"Which of the following algorithms is used for key exchange rather than for encrypting bulk data?",o:["Diffie-Hellman","AES","3DES","ChaCha20"],a:0,x:"Diffie-Hellman lets two parties agree on a shared secret over an untrusted network. AES, 3DES, and ChaCha20 are symmetric ciphers used to encrypt the data itself."},
 {id:"b22",d:1,q:"A web server's certificate must secure www.example.com, mail.example.com, and vpn.example.com, and new subdomains will be added often. Which certificate type is the BEST fit?",o:["Wildcard certificate","Self-signed certificate","Code-signing certificate","A separate certificate for each name"],a:0,x:"A wildcard certificate (*.example.com) covers every subdomain at that level, including ones added later. A self-signed certificate is not trusted by browsers, and separate certificates mean more to manage each time a name is added."},
 {id:"b23",d:1,q:"A browser needs to check whether one website's certificate has been revoked, without downloading a full list. Which of the following does it use?",o:["OCSP","CRL","CSR","SAN"],a:0,x:"OCSP checks the status of a single certificate in real time. A CRL is the full downloaded list, a CSR requests a new certificate, and a SAN lists extra names a certificate covers."},
 {id:"b24",d:1,q:"Which of the following stores a laptop's disk encryption keys in a chip on the motherboard and supports secure boot?",o:["TPM","HSM","Key management system","Secure enclave"],a:0,x:"A Trusted Platform Module is a chip on the motherboard that stores keys and measures the boot process. An HSM is a separate appliance for many systems, and a key management system is software or a service."},
 {id:"b25",d:1,q:"An attacker hides a text file of stolen passwords inside an ordinary-looking image so it can leave the network unnoticed. Which technique is this?",o:["Steganography","Tokenization","Data masking","Encryption"],a:0,x:"Steganography hides data inside other data, such as an image, so its existence is concealed. Encryption makes data unreadable but obvious, and tokenization and masking protect sensitive values in systems."},
 {id:"b26",d:1,q:"Which concept ensures that a sender cannot later deny having sent a signed message?",o:["Non-repudiation","Confidentiality","Availability","Authorization"],a:0,x:"A digital signature made with the sender's private key proves who sent the message, so the sender cannot deny it. That is non-repudiation."},
 {id:"b27",d:1,q:"Which physical control is designed specifically to stop tailgating into a secure area?",o:["Access control vestibule","Bollards","Fencing","Lighting"],a:0,x:"An access control vestibule lets only one door open at a time, so a second person cannot slip in behind the first. Bollards stop vehicles, and fencing and lighting protect the perimeter."},
 {id:"b28",d:2,q:"Which threat actor is MOST likely to have the resources to stay hidden in a network for years while stealing intellectual property?",o:["Nation-state","Unskilled attacker","Hacktivist","Insider threat"],a:0,x:"Nation-state actors have large budgets and long-term goals such as espionage, so they run advanced persistent threats. Unskilled attackers lack the skill, hacktivists usually want publicity, and insiders already have access."},
 {id:"b29",d:2,q:"A finance clerk receives an email from what appears to be the CEO's real mailbox asking for an urgent wire transfer to a new supplier. The CEO's account was hacked last week. Which attack is this?",o:["Business email compromise","Vishing","Typosquatting","Watering hole attack"],a:0,x:"Business email compromise uses a real or spoofed business mailbox to trick staff into sending money. Vishing uses voice calls, typosquatting uses a misspelled domain, and a watering hole infects a site the targets visit."},
 {id:"b30",d:2,q:"Attackers compromise a popular industry news website and plant malware that infects visitors from one target company. Which attack is this?",o:["Watering hole attack","Spear phishing","Supply chain attack","Pharming"],a:0,x:"A watering hole attack compromises a site the targets are known to visit. Spear phishing sends targeted messages, a supply chain attack goes through a vendor's product, and pharming redirects traffic at the DNS level."},
 {id:"b31",d:2,q:"An employee stores customer files in a personal cloud storage account that the IT department never approved. What is this an example of?",o:["Shadow IT","Insider threat","Data exfiltration by an APT","Misconfiguration"],a:0,x:"Using hardware or software without IT's approval is shadow IT. It creates risk even when the employee means no harm."},
 {id:"b32",d:2,q:"Which of the following BEST reduces the risk of attackers logging in to new network devices with factory settings?",o:["Changing default credentials before deployment","Disabling SNMP traps","Enabling port mirroring","Using a separate management VLAN only"],a:0,x:"Default usernames and passwords are publicly documented, so they must be changed before a device goes live. A management VLAN helps but does not stop someone on it from using the default login."},
 {id:"b33",d:2,q:"A program checks that a user has permission to a file, then opens it a moment later. An attacker swaps the file for a link to a protected file in between. Which vulnerability is this?",o:["Time-of-check to time-of-use (TOCTOU)","Buffer overflow","Memory injection","Directory traversal"],a:0,x:"TOCTOU is a race condition in which the resource changes between the check and the use. A buffer overflow overruns memory, memory injection writes code into a process, and directory traversal uses ../ in a path."},
 {id:"b34",d:2,q:"A web server log shows requests such as GET /images/../../../../windows/win.ini. Which attack is being attempted?",o:["Directory traversal","SQL injection","Cross-site scripting","Command injection"],a:0,x:"Repeated ../ sequences try to climb out of the web folder to reach other files, which is directory traversal."},
 {id:"b35",d:2,q:"A cloud storage bucket holding customer invoices was left readable by anyone on the internet. What type of vulnerability is this?",o:["Misconfiguration","Zero-day","Resource reuse","Virtual machine escape"],a:0,x:"An insecure setting, such as public access on a storage bucket, is a misconfiguration. A zero-day is an unknown flaw in software, not a setting someone chose."},
 {id:"b36",d:2,q:"A user installs an app on a company phone from a website instead of the official app store. What is this called?",o:["Sideloading","Jailbreaking","Rooting","Bluesnarfing"],a:0,x:"Installing apps from outside the official store is sideloading. Jailbreaking and rooting remove the operating system's restrictions, and bluesnarfing steals data over Bluetooth."},
 {id:"b37",d:2,q:"Malware spreads from server to server through an unpatched network service, and no one opens a file or clicks a link. Which type of malware is this?",o:["Worm","Virus","Trojan","Logic bomb"],a:0,x:"A worm spreads on its own across a network. A virus needs a user to run an infected file, a Trojan pretends to be legitimate software, and a logic bomb waits for a trigger."},
 {id:"b38",d:2,q:"Users report that their files have new extensions and cannot be opened, and a text file in each folder demands payment in cryptocurrency. Which malware is this?",o:["Ransomware","Spyware","Rootkit","Bloatware"],a:0,x:"Encrypting files and demanding payment for the key is ransomware."},
 {id:"b39",d:2,q:"A user signs in from New York at 9:00 a.m. and from Tokyo at 9:25 a.m. the same day. Which indicator of compromise is this?",o:["Impossible travel","Concurrent session usage","Out-of-cycle logging","Resource consumption"],a:0,x:"Nobody can travel from New York to Tokyo in 25 minutes, so this is impossible travel, a sign the credentials are being used by someone else."},
 {id:"b40",d:2,q:"An analyst finds that the security log on a domain controller has no entries for a four-hour period during which the server was running. What does this MOST likely indicate?",o:["An attacker cleared the logs to hide activity","The server was running a scheduled backup","Normal log rotation","A false positive in the SIEM"],a:0,x:"Missing logs on a running server are a classic sign that an attacker deleted entries to cover their tracks. Log rotation archives entries; it does not leave unexplained gaps."},
 {id:"b41",d:2,q:"An attacker on the same Wi-Fi network sends forged ARP replies so that traffic between a victim and the gateway passes through the attacker's laptop. Which attack is this?",o:["On-path attack","Replay attack","DNS poisoning","Evil twin"],a:0,x:"ARP poisoning places the attacker between two parties, which is an on-path attack. An evil twin is a fake access point, and DNS poisoning corrupts name resolution."},
 {id:"b42",d:2,q:"An attacker captures a valid authentication token from network traffic and sends it again later to gain access. Which control would BEST stop this?",o:["Timestamps and one-time session tokens","Longer passwords","Disk encryption","An application allow list"],a:0,x:"A replay attack reuses captured data. Tokens that expire quickly and messages with timestamps or nonces cannot be reused."},
 {id:"b43",d:2,q:"Attackers send small DNS queries to open resolvers with the victim's IP address spoofed as the source, and the victim is flooded with large responses. Which attack is this?",o:["Amplified DDoS","DNS poisoning","Domain hijacking","Replay attack"],a:0,x:"Small requests that trigger large replies aimed at a spoofed victim are an amplification (reflected) DDoS attack."},
 {id:"b44",d:2,q:"An attacker forces a client and server to negotiate an old, weak version of TLS so the traffic can be decrypted. Which attack is this?",o:["Downgrade attack","Birthday attack","Collision attack","Brute-force attack"],a:0,x:"Forcing the use of an older, weaker protocol or cipher is a downgrade attack. Disabling old versions on the server stops it."},
 {id:"b45",d:2,q:"Which of the following is the BEST defense against SQL injection?",o:["Parameterized queries","A host-based firewall","Full-disk encryption","Account lockout"],a:0,x:"Parameterized queries (prepared statements) keep user input separate from the SQL command, so the input cannot change the query. Input validation also helps."},
 {id:"b46",d:2,q:"A company puts its point-of-sale terminals on their own VLAN with firewall rules that let them reach only the payment processor. Which mitigation is this?",o:["Segmentation","Decommissioning","Patching","Encryption"],a:0,x:"Separating systems into their own network zone limits what an attacker can reach, which is segmentation."},
 {id:"b47",d:2,q:"Only programs on an approved list can run on a set of factory-floor computers. Which mitigation technique is this?",o:["Application allow list","Deny list","Sandboxing","Host-based IPS"],a:0,x:"An allow list permits only approved applications and blocks everything else. A deny list blocks known bad items and allows the rest."},
 {id:"b48",d:2,q:"A user finds a USB drive labeled Confidential in the parking lot and plugs it in to see who owns it. Malware installs. What type of threat vector was used?",o:["Removable device","Image-based","Message-based","Unsecure wireless network"],a:0,x:"Malware delivered on a USB drive that someone plugs in uses removable media as the threat vector. Leaving drives for people to find is also called baiting."},
 {id:"b49",d:2,q:"A researcher finds a flaw in a company's website and quietly reports it to the company so it can be fixed before anyone abuses it. What motivates this actor?",o:["Ethical","Financial gain","Espionage","Revenge"],a:0,x:"Finding flaws and reporting them responsibly is an ethical motivation."},
 {id:"b50",d:2,q:"Which of the following is an example of a supply chain attack?",o:["Malware inserted into a vendor's software update that customers install","A phishing email sent to the finance team","A brute-force attack on the VPN","A DDoS attack against the company website"],a:0,x:"A supply chain attack compromises a supplier, vendor, or product to reach the real target. A tainted software update is the classic example."},
 {id:"b51",d:3,q:"Under the shared responsibility model for infrastructure as a service (IaaS), who is responsible for patching the guest operating system?",o:["The customer","The cloud provider","The hypervisor vendor","Both equally"],a:0,x:"In IaaS, the provider secures the physical hardware and the hypervisor, and the customer manages and patches the operating systems and everything above them."},
 {id:"b52",d:3,q:"Which cloud model lets a customer run code without managing any servers, paying only when the code runs?",o:["Serverless","IaaS","Virtualization","Containerization"],a:0,x:"Serverless computing runs functions on demand while the provider manages the servers. With IaaS, the customer manages the virtual machines."},
 {id:"b53",d:3,q:"An engineer wants each application to be packaged with its libraries so it runs the same way on any host, while sharing the host's kernel. Which technology should the engineer use?",o:["Containers","Virtual machines","Air-gapped servers","Thin clients"],a:0,x:"Containers bundle an app with its dependencies and share the host operating system's kernel. Virtual machines each run a full operating system of their own."},
 {id:"b54",d:3,q:"Administrators must first connect to a single hardened server before they can manage any system in the secure network zone. What is this hardened server called?",o:["Jump server","Proxy server","Load balancer","Domain controller"],a:0,x:"A jump server (jump box) is the one hardened entry point admins use to reach a secure zone."},
 {id:"b55",d:3,q:"A firewall protecting a hospital's life-support monitoring network must keep traffic flowing even if the firewall's inspection engine fails. How should the firewall be configured?",o:["Fail-open","Fail-closed","Fail-secure","Inline blocking"],a:0,x:"Fail-open lets traffic pass if the device fails, putting availability first, which matters for life-safety systems. Fail-closed (fail-secure) blocks everything on failure."},
 {id:"b56",d:3,q:"A company wants its public web server reachable from the internet but separated from the internal network. Where should the server be placed?",o:["In a screened subnet","On the internal LAN","Behind the internal firewall only","On an air-gapped network"],a:0,x:"A screened subnet (formerly called a DMZ) holds public-facing servers between the internet and the internal network."},
 {id:"b57",d:3,q:"Which standard requires a device to authenticate before a switch port will pass its traffic?",o:["802.1X","802.11ac","802.3af","802.1Q"],a:0,x:"802.1X is port-based network access control, usually with a RADIUS server. 802.11ac is Wi-Fi, 802.3af is Power over Ethernet, and 802.1Q is VLAN tagging."},
 {id:"b58",d:3,q:"A small branch office needs one device that combines a firewall, intrusion prevention, antivirus, and web filtering. Which should it buy?",o:["Unified threat management appliance","Web application firewall","Load balancer","Jump server"],a:0,x:"A UTM appliance combines several security functions in one box, which suits small sites. A WAF protects only web applications."},
 {id:"b59",d:3,q:"Which of the following protects data in transit?",o:["TLS","Full-disk encryption","A secure enclave","Database encryption"],a:0,x:"TLS encrypts data as it moves across a network. Full-disk and database encryption protect data at rest, and a secure enclave protects data in use."},
 {id:"b60",d:3,q:"A company must keep EU citizens' personal data in data centers inside the EU. Which concept requires this?",o:["Data sovereignty","Data masking","Data classification","Data retention"],a:0,x:"Data sovereignty means data is subject to the laws of the country where it is stored, which can require keeping it within certain borders."},
 {id:"b61",d:3,q:"A help desk screen shows customers' card numbers as XXXX-XXXX-XXXX-1234. Which technique is this?",o:["Data masking","Tokenization","Hashing","Steganography"],a:0,x:"Masking hides part of a value when it is displayed. Tokenization replaces the whole value with a token, and hashing is a one-way transformation."},
 {id:"b62",d:3,q:"A company can afford to lose at most one hour of transaction data after an outage. Which metric does this define?",o:["Recovery point objective (RPO)","Recovery time objective (RTO)","Mean time to repair (MTTR)","Mean time between failures (MTBF)"],a:0,x:"RPO is the maximum acceptable data loss, measured in time. RTO is how quickly service must be restored."},
 {id:"b63",d:3,q:"A recovery site has racks, power, and network connections, but no servers. Equipment must be shipped in after a disaster. Which type of site is it?",o:["Cold site","Warm site","Hot site","Mobile site"],a:0,x:"A cold site has space and power but little or no equipment, so it takes the longest to bring online."},
 {id:"b64",d:3,q:"Before applying a risky update to a virtual machine, an administrator wants a way to roll back within seconds if it fails. What should the administrator take?",o:["A snapshot","A full tape backup","A differential backup","A replication job"],a:0,x:"A snapshot captures the VM's state at a point in time and can be reverted almost instantly. Restoring from tape takes far longer."},
 {id:"b65",d:3,q:"Which of the following gives a data center power for days during a regional outage?",o:["Generator","UPS","Surge protector","Power distribution unit"],a:0,x:"A generator runs on fuel and can supply power for as long as it is refueled. A UPS battery covers only minutes, enough to switch to a generator or shut down cleanly."},
 {id:"b66",d:3,q:"Department leaders meet in a conference room and talk through how they would respond to a ransomware outage, without touching any systems. Which type of test is this?",o:["Tabletop exercise","Failover test","Parallel processing","Simulation"],a:0,x:"A tabletop exercise is a discussion-based walk-through. A failover test actually switches systems over, and a simulation acts out the scenario on systems."},
 {id:"b67",d:3,q:"A company runs its DNS service on both Linux and Windows servers so that a single operating system vulnerability cannot stop name resolution. Which resilience concept is this?",o:["Platform diversity","Load balancing","Clustering","Geographic dispersion"],a:0,x:"Using different platforms or vendors so one flaw cannot affect everything is platform diversity."},
 {id:"b68",d:3,q:"Which device spreads incoming requests across several web servers so no single server is overloaded?",o:["Load balancer","Proxy server","Jump server","Web application firewall"],a:0,x:"A load balancer distributes traffic across a pool of servers for performance and availability."},
 {id:"b69",d:3,q:"A water treatment plant monitors and controls pumps at remote stations from a central system. Which type of system is this?",o:["SCADA","SDN","SASE","VDI"],a:0,x:"Supervisory Control and Data Acquisition (SCADA) systems monitor and control industrial processes across sites. They are a type of industrial control system (ICS)."},
 {id:"b70",d:3,q:"Which of the following is a security concern specific to IoT devices?",o:["Weak default credentials and infrequent firmware updates","Too much processing power for encryption","Mandatory vendor patching every week","Built-in hardware security modules"],a:0,x:"Many IoT devices ship with default passwords and rarely get firmware updates, which makes them easy targets."},
 {id:"b71",d:3,q:"Which data type is a company's secret manufacturing process that gives it a competitive advantage?",o:["Trade secret","Regulated data","Public data","Personally identifiable information"],a:0,x:"Confidential business information that gives a competitive edge, such as a recipe or process, is a trade secret."},
 {id:"b72",d:3,q:"A company replaces its branch VPNs and firewalls with a single cloud service that applies security policies to users wherever they work. What is this approach?",o:["Secure access service edge (SASE)","Software-defined networking (SDN)","Infrastructure as code (IaC)","Unified threat management (UTM)"],a:0,x:"SASE combines networking, such as SD-WAN, with cloud-delivered security for users in any location."},
 {id:"b73",d:4,q:"Which of the following BEST describes hardening a new server before deployment?",o:["Disabling unneeded services, closing unused ports, and changing default settings","Installing every available software package","Giving all users administrator rights","Turning off logging to improve performance"],a:0,x:"Hardening shrinks the attack surface by removing what is not needed and securing what remains."},
 {id:"b74",d:4,q:"A company wants employees' phones to be company-owned but allow personal apps. Which mobile deployment model is this?",o:["COPE","BYOD","CYOD","VDI"],a:0,x:"Corporate-owned, personally enabled (COPE) devices belong to the company but allow personal use. BYOD devices belong to the employee."},
 {id:"b75",d:4,q:"Which wireless security standard uses Simultaneous Authentication of Equals (SAE) to resist offline password-cracking attacks?",o:["WPA3","WPA2","WEP","WPS"],a:0,x:"WPA3 replaced WPA2's pre-shared key handshake with SAE, which resists offline dictionary attacks. WEP is broken, and WPS is a setup feature with a weak PIN."},
 {id:"b76",d:4,q:"Old hard drives that held patient records will be thrown away. Which method gives the MOST assurance that the data cannot be recovered?",o:["Physical destruction such as shredding","A quick format","Deleting the files","Reinstalling the operating system"],a:0,x:"Shredding destroys the media itself, so nothing can be recovered. Formatting, deleting, and reinstalling leave data that recovery tools can often find."},
 {id:"b77",d:4,q:"After destroying a batch of drives, the disposal vendor provides a signed document listing each serial number. What is this document?",o:["Certificate of destruction","Chain of custody form","Asset inventory","Data retention policy"],a:0,x:"A certificate of destruction proves that specific media was destroyed, which supports compliance."},
 {id:"b78",d:4,q:"A vulnerability scanner is given administrator credentials so it can check installed patches and settings on each host. What type of scan is this?",o:["Credentialed scan","Non-credentialed scan","Penetration test","Port scan"],a:0,x:"A credentialed scan logs in to each system, so it finds missing patches and misconfigurations that an outside view would miss."},
 {id:"b79",d:4,q:"A vulnerability has a CVSS base score of 9.8. How is this severity rated?",o:["Critical","High","Medium","Low"],a:0,x:"In CVSS v3, scores of 9.0 to 10.0 are Critical, 7.0 to 8.9 High, 4.0 to 6.9 Medium, and 0.1 to 3.9 Low."},
 {id:"b80",d:4,q:"After a patch is applied to fix a reported vulnerability, what should the analyst do NEXT to confirm the fix?",o:["Rescan the system","Close the ticket","Update the risk register to Accepted","Run a tabletop exercise"],a:0,x:"Rescanning confirms the vulnerability is actually gone before the ticket is closed."},
 {id:"b81",d:4,q:"A legacy system cannot be patched, and management formally documents its approval to leave it as is with extra controls until it is replaced. What is this called?",o:["An exception","A false positive","Risk transference","Remediation"],a:0,x:"A documented, approved decision not to fix a vulnerability for now is an exception (or exemption). It is a form of accepting the risk."},
 {id:"b82",d:4,q:"An analyst wants to see which internal hosts sent the most data to the internet yesterday, without storing packet contents. Which data source is BEST?",o:["NetFlow","Full packet capture","Application logs","Vulnerability scan output"],a:0,x:"NetFlow records who talked to whom, when, and how much, without the contents. A full packet capture would also work but stores far more data than needed."},
 {id:"b83",d:4,q:"A SIEM rule generates hundreds of harmless alerts each day, and analysts have started ignoring it. What should the team do?",o:["Tune the alert rule","Disable the SIEM","Delete the logs it uses","Lower the severity of every alert"],a:0,x:"Alert tuning adjusts the rule so it fires on real problems, cutting false positives without losing visibility."},
 {id:"b84",d:4,q:"Which email security control publishes a DNS record listing the mail servers allowed to send for a domain?",o:["SPF","DKIM","DMARC","S/MIME"],a:0,x:"SPF (Sender Policy Framework) lists allowed sending servers. DKIM signs messages, and DMARC sets the policy for messages that fail SPF or DKIM."},
 {id:"b85",d:4,q:"A company wants receiving mail servers to reject messages that fail authentication checks for its domain and to send it reports. Which control should it publish?",o:["DMARC","SPF","DKIM","An email gateway"],a:0,x:"DMARC tells receivers what to do with mail that fails SPF or DKIM, such as reject or quarantine it, and asks them to send reports."},
 {id:"b86",d:4,q:"An alert fires because an accountant who never accesses engineering files suddenly downloads thousands of them at night. Which tool MOST likely raised the alert?",o:["User behavior analytics","A web filter","A WAF","An email gateway"],a:0,x:"User behavior analytics learns each user's normal activity and alerts on unusual behavior."},
 {id:"b87",d:4,q:"An administrator wants a screen-lock timeout applied to every Windows computer in the domain from one place. What should the administrator use?",o:["Group Policy","SELinux","A host-based IPS","A DLP policy"],a:0,x:"Group Policy pushes settings from Active Directory to domain computers."},
 {id:"b88",d:4,q:"Which of the following blocks users from reaching known phishing domains by refusing to resolve the names?",o:["DNS filtering","Port security","802.1X","A load balancer"],a:0,x:"DNS filtering checks lookups against lists of malicious domains and blocks them before a connection is made."},
 {id:"b89",d:4,q:"Which authentication factor is a fingerprint?",o:["Something you are","Something you know","Something you have","Somewhere you are"],a:0,x:"Biometrics, such as fingerprints and face scans, are something you are."},
 {id:"b90",d:4,q:"A user signs in with a password and a PIN. Why is this NOT multifactor authentication?",o:["Both are something you know","A PIN is a biometric","Passwords are not authentication factors","MFA requires a hardware token"],a:0,x:"MFA needs factors of different types. A password and a PIN are both knowledge factors, so this is single-factor authentication."},
 {id:"b91",d:4,q:"A partner company's employees access a shared portal by signing in with their own company's credentials. What is this arrangement?",o:["Federation","Single sign-on within one company","Attestation","Role-based access control"],a:0,x:"Federation is trust between organizations, so users sign in with their home identity provider's account. SAML and OpenID Connect are common federation standards."},
 {id:"b92",d:4,q:"A calendar app is allowed to read a user's contacts from another service without ever seeing the user's password. Which standard makes this possible?",o:["OAuth","LDAP","RADIUS","Kerberos"],a:0,x:"OAuth grants an app limited access to resources on the user's behalf, using tokens instead of the password."},
 {id:"b93",d:4,q:"Access to a payroll system is allowed only for Finance department staff, on company devices, during business hours. Which access control model is this?",o:["Attribute-based access control","Discretionary access control","Mandatory access control","Role-based access control"],a:0,x:"ABAC makes decisions from several attributes, such as department, device, and time. RBAC would decide only by role."},
 {id:"b94",d:4,q:"A user who creates a file decides which coworkers may read it. Which access control model is this?",o:["Discretionary access control","Mandatory access control","Rule-based access control","Attribute-based access control"],a:0,x:"In DAC, the owner of a resource controls who can access it."},
 {id:"b95",d:4,q:"An administrator receives domain admin rights for one hour to complete a change, after which they are removed automatically. What is this?",o:["Just-in-time permissions","Least privilege","Separation of duties","Password vaulting"],a:0,x:"Just-in-time access grants elevated rights only when needed and only for a limited time. It supports least privilege."},
 {id:"b96",d:4,q:"Which tool controls, monitors, and records the use of administrator accounts, including checking out their passwords?",o:["Privileged access management (PAM)","Data loss prevention (DLP)","Mobile device management (MDM)","A SIEM"],a:0,x:"PAM manages privileged accounts: it vaults their passwords, grants access on request, and records admin sessions."},
 {id:"b97",d:4,q:"When HR marks an employee as terminated, all of the employee's accounts are disabled within minutes without manual work. What is this?",o:["Automated deprovisioning","Attestation","Identity proofing","Federation"],a:0,x:"Automating account removal from HR records closes access quickly and reliably."},
 {id:"b98",d:4,q:"Which is a risk of relying heavily on automation and orchestration?",o:["A single point of failure if the orchestration platform goes down","Slower response to common alerts","Fewer standard configurations","Less consistent baselines"],a:0,x:"If every automated process depends on one platform, its failure stops them all. Faster response and consistent baselines are benefits of automation."},
 {id:"b99",d:4,q:"During an incident, an analyst confirms that an alert is real and determines that three servers are affected. Which phase of incident response is this?",o:["Analysis","Detection","Containment","Preparation"],a:0,x:"Analysis confirms the incident and works out its scope. Detection is the first notice of a possible incident."},
 {id:"b100",d:4,q:"An investigator must collect evidence from a running server. Which should be collected FIRST?",o:["Contents of RAM","Hard drive image","Backup tapes","Archived logs"],a:0,x:"By the order of volatility, the most short-lived evidence comes first. RAM is lost when the power goes off, so it is collected before the disk."},
 {id:"b101",d:4,q:"Before analyzing a seized hard drive, an investigator connects it through a device that prevents any writes. What is this device?",o:["Write blocker","Faraday bag","Hardware security module","Packet sniffer"],a:0,x:"A write blocker lets investigators read a drive without changing it, which preserves the evidence."},
 {id:"b102",d:4,q:"Lawyers instruct IT not to delete any email belonging to employees involved in a lawsuit. What is this instruction?",o:["Legal hold","Chain of custody","E-discovery","Data retention"],a:0,x:"A legal hold suspends normal deletion so data needed in litigation is preserved."},
 {id:"b103",d:4,q:"After a breach, the team determines that an unpatched VPN appliance let the attacker in. Which activity is this?",o:["Root cause analysis","Threat hunting","Containment","Lessons learned"],a:0,x:"Root cause analysis finds the underlying reason an incident happened, so it can be fixed for good."},
