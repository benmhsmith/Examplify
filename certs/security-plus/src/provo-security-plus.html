  {id:"a2",g:"app",d:2,t:"Cross-site scripting (XSS)",def:"Injecting malicious script into a web page so it runs in other users' browsers",sc:"An attacker posts a comment containing a script tag that runs in every visitor's browser. What attack is this?",fix:"Input validation and output encoding",fixAvoid:["a1","a3"],alt:["xss", "cross site scripting"]},
  {id:"a3",g:"app",d:2,t:"Buffer overflow",def:"Writing more data into a memory buffer than it can hold, overwriting adjacent memory",sc:"An application crashes when a field receives far more characters than it expects, and the attacker gains code execution. What vulnerability is this?",fix:"Bounds checking and input validation in the code",fixAvoid:["a1","a2"],alt:["overflow", "buffer overrun"]},
  {id:"a5",g:"app",d:2,t:"Race condition",def:"A flaw where the result depends on the timing between two operations, such as checking a value and then using it",sc:"Two transactions run at the same moment and both pass a balance check before either withdrawal is recorded. What vulnerability is this?",avoid:["a18"],alt:["race"]},
  {id:"a13",g:"app",d:2,t:"Memory injection",def:"Writing malicious code into the memory of a running process so it runs inside that process",sc:"Malware writes its code into the memory of a trusted running process so it runs under that process's name. What attack is this?"},
  {id:"a14",g:"app",d:2,t:"Directory traversal",def:"Using ../ sequences in input to reach files outside the folder an application meant to allow",sc:"A request for /download?file=../../../../etc/passwd returns the server's account file. What attack is this?"},
  {id:"a15",g:"app",d:2,t:"Privilege escalation",def:"Gaining higher permissions than an account was given",sc:"A standard user exploits a flaw in a service to get administrator rights on the server. What attack is this?"},
  {id:"a18",g:"app",d:2,t:"Time-of-check to time-of-use (TOCTOU)",def:"A race condition where a resource changes between the moment it is checked and the moment it is used",sc:"A program checks that a file is safe, but an attacker swaps the file before the program opens it. What specific flaw is this?",alt:["toctou", "toc tou"]},
  {id:"a4",g:"plat",d:2,t:"Zero-day vulnerability",def:"A flaw unknown to the vendor, so no patch exists yet",sc:"Attackers exploit a flaw that the software maker has not discovered and has no fix for. What is it called?",alt:["zero day", "0day", "zero-day"]},
  {id:"a17",g:"plat",d:2,t:"Malicious update",def:"A software update that was tampered with so that it delivers malware",sc:"Attackers break into a vendor's update server, and customers install a backdoored patch. What vulnerability is this?",fix:"Verifying the digital signature on every update",alt:["malicious updates"]},
  {id:"a19",g:"plat",d:2,t:"Sideloading",def:"Installing apps from outside the official app store",sc:"A user installs an Android app from a website instead of the Play Store. What is this called?",alt:["side loading"]},
  {id:"a20",g:"plat",d:2,t:"Jailbreaking",def:"Removing a mobile operating system's built-in restrictions to get full control of the device",sc:"A user removes Apple's restrictions from an iPhone to install unapproved apps and tweaks. What is this called?",alt:["jailbreak", "rooting"]},
  {id:"a21",g:"plat",d:2,t:"Misconfiguration",def:"An insecure setting, such as an open cloud storage bucket or a default left in place",sc:"A cloud storage bucket holding customer files was set to allow public access. What type of vulnerability is this?",alt:["misconfigured"]},
  {id:"a22",g:"plat",d:2,t:"Virtual machine escape",def:"Breaking out of a virtual machine to reach the hypervisor or other virtual machines",sc:"Malware in one guest VM exploits a flaw to run code on the host's hypervisor. What attack is this?",alt:["vm escape"]},
  {id:"a23",g:"plat",d:2,t:"Resource reuse",def:"Leftover data in memory or storage that is handed to a new virtual machine or user",sc:"A new cloud VM is given disk space that still holds another customer's old data. What virtualization vulnerability is this?"},
  {id:"a6",g:"mal",d:2,t:"Ransomware",def:"Malware that encrypts files and demands payment for the decryption key",sc:"Files across a file server are encrypted and a note demands cryptocurrency. What malware is this?",fix:"Offline backups and endpoint protection",fixAvoid:["a25"]},
  {id:"a7",g:"mal",d:2,t:"Logic bomb",def:"Malicious code that runs when a specific condition or date is met",sc:"Code planted by a former administrator deletes the payroll database when his account is removed. What is this?"},
  {id:"a8",g:"mal",d:2,t:"Rootkit",def:"Malware that hides deep in the operating system to keep privileged access and avoid detection",sc:"Malware modifies the operating system kernel so that its files and processes do not appear in normal tools. What is it?"},
  {id:"a9",g:"mal",d:2,t:"Keylogger",def:"Malware or hardware that records keystrokes to capture credentials",sc:"A small device between a keyboard and a PC records everything typed. What is it?",avoid:["a27"]},
  {id:"a24",g:"mal",d:2,t:"Trojan",def:"Malware disguised as legitimate software",sc:"A free game download secretly installs a backdoor along with the game. What malware is this?",alt:["trojan horse"]},
  {id:"a25",g:"mal",d:2,t:"Worm",def:"Malware that spreads across a network by itself, with no user action",sc:"Malware spreads from server to server through an unpatched network service without anyone opening anything. What is it?",fix:"Patching and network segmentation",fixAvoid:["a6"]},
  {id:"a26",g:"mal",d:2,t:"Virus",def:"Malware that attaches to files or programs and spreads when a user runs or shares them",sc:"Malicious code attaches itself to programs and spreads each time users run and share those programs. What is it?"},
  {id:"a27",g:"mal",d:2,t:"Spyware",def:"Malware that secretly gathers information about a user's activity",sc:"Hidden software tracks a user's browsing and sends it to a third party. What malware is this?"},
  {id:"a28",g:"mal",d:2,t:"Bloatware",def:"Unneeded software that comes preinstalled by the manufacturer and can add vulnerabilities",sc:"A new laptop comes with trial apps and utilities the user never asked for. What are they called?"},
  {id:"a10",g:"net",d:2,t:"Password spraying",def:"Trying a few common passwords against many accounts to avoid lockouts",sc:"Logs show one failed login for each of hundreds of accounts, all with the password Spring2026!. What attack is this?",fix:"Multifactor authentication",fixAvoid:["a31"],alt:["spraying"]},
  {id:"a11",g:"net",d:2,t:"On-path attack",def:"An attacker secretly intercepts and possibly alters traffic between two parties",sc:"An attacker on a café's Wi-Fi relays and reads traffic between a user and a website. What attack is this?",fix:"Encrypted protocols such as TLS",fixAvoid:["a37"],alt:["on path", "man in the middle", "mitm"]},
  {id:"a12",g:"net",d:2,t:"Distributed denial of service (DDoS)",def:"Many compromised systems flood a target so legitimate users cannot reach it",sc:"Thousands of infected devices flood a company's website with traffic until it stops responding. What attack is this?",fix:"Upstream traffic filtering from a DDoS protection service",avoid:["a33"],alt:["ddos"]},
  {id:"a16",g:"net",d:2,t:"Replay attack",def:"Capturing valid data, such as a login exchange or token, and sending it again later",sc:"An attacker records a valid login exchange and sends it again later to log in as the user. What attack is this?",fix:"Timestamps and one-time session tokens"},
  {id:"a31",g:"net",d:2,t:"Brute-force attack",def:"Trying every possible password against an account until one works",sc:"An attacker tries thousands of passwords against one admin account until one works. What attack is this?",fix:"Account lockout after repeated failed attempts",fixAvoid:["a10"],alt:["brute force"]},
  {id:"a32",g:"net",d:2,t:"DNS poisoning",def:"Corrupting DNS records or caches so names resolve to an attacker's address",sc:"Users who type the bank's correct address are sent to a fake site because a DNS server's cache was corrupted. What attack is this?",fix:"DNSSEC",alt:["dns cache poisoning", "dns spoofing"]},
  {id:"a33",g:"net",d:2,t:"Amplification attack",def:"Sending small requests with a spoofed source address to services that send much larger replies to the victim",sc:"Attackers send small DNS queries with the victim's address spoofed, and open resolvers flood the victim with large replies. What attack is this?",alt:["amplified ddos", "reflected ddos", "amplification"]},
  {id:"a34",g:"phys",d:2,t:"Evil twin",def:"A fake access point that copies a real network's name to lure users",sc:"An attacker sets up a hotspot named CoffeeShop-WiFi next to the real one and captures users' traffic. What is this?"},
  {id:"a35",g:"phys",d:2,t:"RFID cloning",def:"Copying the data from an RFID badge to make a working duplicate",sc:"An attacker stands near employees with a hidden reader and later opens doors with copies of their badges. What attack is this?",alt:["badge cloning", "rfid skimming"]},
  {id:"a36",g:"phys",d:2,t:"Environmental attack",def:"Attacking the systems that keep equipment running, such as cooling or power",sc:"Attackers turn off a data center's cooling so its servers overheat. What type of physical attack is this?"},
  {id:"a37",g:"phys",d:2,t:"Downgrade attack",def:"Forcing a connection to use an older, weaker protocol version or cipher",sc:"An on-path attacker makes a browser and server fall back from TLS 1.3 to an old, weak version. What attack is this?",fix:"Disabling old protocol versions on servers",fixAvoid:["a11"],alt:["downgrade"]},
  {id:"a38",g:"phys",d:2,t:"Hash collision",def:"Two different inputs that produce the same hash value",sc:"An attacker crafts a malicious file with the same MD5 hash as a legitimate one. What is this called?",fix:"A stronger hashing algorithm such as SHA-256",avoid:["a39"],alt:["collision"]},
  {id:"a39",g:"phys",d:2,t:"Birthday attack",def:"Using the math of probability to find hash collisions much faster than trying every value",sc:"An attacker uses the same math that makes shared birthdays common in a small group to find two inputs with matching hashes. What attack is this?"},
  {id:"a40",g:"ind",d:2,t:"Impossible travel",def:"Logins for one account from places too far apart to travel between in the time",sc:"A user signs in from Chicago and, 20 minutes later, from Singapore. Which indicator is this?",avoid:["a41"]},
  {id:"a41",g:"ind",d:2,t:"Concurrent session usage",def:"One account logged in from several places at the same time",sc:"The same account has active sessions on three different computers at once, though the user has only one. Which indicator is this?"},
  {id:"a42",g:"ind",d:2,t:"Account lockout",def:"An account locks because of failed logins the user did not make",sc:"A user arrives in the morning to find her account locked after failed logins she never attempted. Which indicator is this?"},
  {id:"a43",g:"ind",d:2,t:"Missing logs",def:"Gaps or deleted entries in logs, often a sign that an attacker covered their tracks",sc:"The security log on a domain controller has no entries at all for six hours overnight. Which indicator is this?"},
  {id:"a44",g:"ind",d:2,t:"Out-of-cycle logging",def:"Log activity at unusual times, such as admin commands in the middle of the night",sc:"Logs show a service account running admin commands at 3 a.m. on a Sunday, when no jobs are scheduled. Which indicator is this?"},
  {id:"a45",g:"ind",d:2,t:"Resource consumption",def:"Unexplained spikes in CPU, memory, disk, or bandwidth use",sc:"A file server's outbound bandwidth spikes overnight although no backup is scheduled. Which indicator is this?"},
  {id:"a46",g:"ind",d:2,t:"Blocked content",def:"Security tools blocking attempts to reach known bad sites or files",sc:"A proxy log shows a workstation trying again and again to reach a known command-and-control domain and being blocked. Which indicator is this?"},
  {id:"a47",g:"ind",d:2,t:"Published or documented",def:"The organization's data or flaws already reported publicly, such as on a leak site",sc:"Company login credentials appear on a public paste site. Which indicator is this?"},
  {id:"a48",g:"mit",d:2,t:"Segmentation",def:"Dividing a network into separate zones so a breach in one cannot spread easily",sc:"Point-of-sale terminals are moved to their own VLAN, separate from the office network. Which mitigation is this?",avoid:["a49"],alt:["network segmentation"]},
  {id:"a49",g:"mit",d:2,t:"Isolation",def:"Cutting a compromised or risky system off from everything else",sc:"An infected workstation is moved to a quarantine network that can reach nothing else. Which mitigation is this?"},
  {id:"a50",g:"mit",d:2,t:"Application allow list",def:"Letting only approved applications run",sc:"Only the applications IT approves can run on the point-of-sale terminals. Which mitigation is this?",alt:["allow list", "allowlist", "whitelist", "application allowlist"]},
  {id:"a51",g:"mit",d:2,t:"Patching",def:"Installing vendor updates that fix known vulnerabilities",sc:"A vendor releases a fix for a critical flaw, and IT installs it on every affected server. Which mitigation is this?",alt:["patch", "patch management"]},
  {id:"a52",g:"mit",d:2,t:"Configuration enforcement",def:"Automatically checking and reapplying approved settings so systems do not drift",sc:"A management tool checks every laptop daily and resets any setting that differs from the approved baseline. Which mitigation is this?"},
  {id:"a53",g:"mit",d:2,t:"Decommissioning",def:"Retiring a system securely: wiping its data and removing it from the network",sc:"An old server is wiped, removed from the domain, and unplugged from the network. Which mitigation is this?",alt:["decommission"]},
  {id:"a54",g:"mit",d:2,t:"Host-based firewall",def:"A firewall on the device itself that controls its own inbound and outbound traffic",sc:"Each laptop runs its own firewall that blocks inbound connections, even on hotel Wi-Fi. Which hardening technique is this?"},
  {id:"a55",g:"mit",d:2,t:"Disabling ports and protocols",def:"Turning off network ports and protocols that are not needed",sc:"An admin turns off Telnet and FTP on a switch and shuts down its unused ports. Which hardening technique is this?",alt:["disable unused ports", "disabling unused ports"]},
  {id:"a56",g:"mit",d:2,t:"Removing unnecessary software",def:"Uninstalling software that is not needed, which shrinks the attack surface",sc:"Before deployment, a technician uninstalls games and trial apps from a new laptop. Which hardening technique is this?",alt:["uninstall unnecessary software"]}
 ]},
 arch:{need:2,typed:true,labs:["shared","zones","recovery"],groups:[["model","Architecture models","Models"],["infra","Securing infrastructure","Infrastructure"],["data","Protecting data","Data"],["res","Sites & high availability","Resilience"],["backup","Backups, power & testing","Recovery"]],items:[
  {id:"r1",g:"model",d:3,t:"Infrastructure as code (IaC)",def:"Defining servers and networks in configuration files so they deploy the same way every time",sc:"Every server is built from version-controlled template files, so all deployments are identical. What practice is this?",alt:["iac"]},
  {id:"r2",g:"model",d:3,t:"Microservices",def:"An application built as small, independent services that communicate through APIs",sc:"An online store is split into separate services for search, cart, and payment that talk over APIs. What architecture is this?",alt:["microservice", "microservices architecture"]},
  {id:"r3",g:"model",d:3,t:"Serverless",def:"Running code in the cloud without managing servers; the provider runs it on demand",sc:"A developer uploads a function that runs only when an image is uploaded, without managing any server. What model is this?",alt:["serverless computing", "function as a service", "faas"]},
  {id:"r4",g:"model",d:3,t:"Air gap",def:"Physically isolating a system from every other network",sc:"A control system for a power plant has no physical connection to any other network. What is this called?",alt:["airgap", "air gapped"]},
  {id:"r13",g:"model",d:3,t:"Responsibility matrix",def:"A chart showing which security tasks the cloud provider handles and which the customer handles",sc:"A cloud contract includes a chart showing that the provider patches the hypervisor and the customer patches its own VMs. What is this chart?",alt:["shared responsibility matrix", "shared responsibility model"]},
  {id:"r14",g:"model",d:3,t:"Hybrid cloud",def:"A mix of on-premises or private cloud and public cloud that work together",sc:"A company keeps its database in its own data center but runs its website in a public cloud. Which cloud model is this?",alt:["hybrid"]},
  {id:"r15",g:"model",d:3,t:"Containerization",def:"Packaging an app with everything it needs to run in an isolated container that shares the host's operating system kernel",sc:"Developers package an app with its libraries so it runs the same on any host, sharing the host's kernel. What is this?",alt:["containers", "container"]},
  {id:"r16",g:"model",d:3,t:"Virtualization",def:"Running several virtual machines, each with its own operating system, on one physical host through a hypervisor",sc:"One physical server runs ten separate operating systems, each in its own VM. What technology is this?",alt:["virtual machines", "vm"]},
  {id:"r17",g:"model",d:3,t:"Software-defined networking (SDN)",def:"Separating network control from the forwarding hardware so the network is managed centrally in software",sc:"Paths across every switch are configured from one central controller instead of device by device. What is this?",alt:["sdn", "software defined networking"]},
  {id:"r18",g:"model",d:3,t:"Industrial control system (ICS/SCADA)",def:"Systems that monitor and control industrial processes such as power plants, pipelines, and water treatment",sc:"A water utility uses one system to monitor and control pumps at many remote stations. What type of system is this?",alt:["ics", "scada", "industrial control systems"]},
  {id:"r19",g:"model",d:3,t:"Real-time operating system (RTOS)",def:"An operating system that must respond to events within strict time limits, used in embedded devices",sc:"A car's braking controller runs an operating system that must respond within milliseconds every time. What type of operating system is this?",alt:["rtos"]},
  {id:"r20",g:"model",d:3,t:"Internet of Things (IoT)",def:"Everyday network-connected devices such as cameras, thermostats, and sensors",sc:"Smart thermostats and lights in an office connect to the network and are controlled from a phone app. What category of device are they?",alt:["iot"]},
  {id:"r21",g:"infra",d:3,t:"Jump server",def:"A hardened server that admins connect to first and then use to manage systems in a secure zone",sc:"Admins must log in to one hardened server before they can reach any server in the secure network. What is that server?",alt:["jump box", "jumpbox", "bastion host"]},
  {id:"r22",g:"infra",d:3,t:"Proxy server",def:"A server that makes requests on behalf of clients, often filtering web traffic",sc:"All employee web traffic goes through a server that fetches pages on their behalf and blocks banned sites. What is it?",alt:["proxy", "forward proxy"]},
  {id:"r23",g:"infra",d:3,t:"Load balancer",def:"A device that spreads traffic across several servers for performance and availability",sc:"Incoming web requests are shared across six web servers so that none is overloaded. Which device does this?",alt:["load balancing"]},
  {id:"r24",g:"infra",d:3,t:"Web application firewall (WAF)",def:"A firewall that inspects HTTP traffic to block web attacks such as SQL injection and cross-site scripting",sc:"A device in front of a web app blocks requests that contain SQL injection patterns. What is it?",alt:["waf"]},
  {id:"r25",g:"infra",d:3,t:"Unified threat management (UTM)",def:"One appliance that combines a firewall, intrusion prevention, antivirus, and content filtering",sc:"A small office buys one device that provides a firewall, intrusion prevention, antivirus, and web filtering. What is it?",alt:["utm"]},
  {id:"r26",g:"infra",d:3,t:"Fail-closed",def:"When a security device fails, it blocks all traffic, putting security ahead of availability",sc:"When the firewall crashes, no traffic passes at all until it is restored. What failure mode is this?",alt:["fail closed", "fail secure"]},
  {id:"r27",g:"infra",d:3,t:"Fail-open",def:"When a device fails, traffic keeps passing without inspection, putting availability ahead of security",sc:"When the intrusion prevention system crashes, traffic keeps flowing without being inspected. What failure mode is this?",alt:["fail open"]},
  {id:"r28",g:"infra",d:3,t:"Screened subnet",def:"A network zone between the internet and the internal network that holds public-facing servers; formerly called a DMZ",sc:"The company's public web and mail servers sit in a separate zone between two firewalls. What is this zone?",alt:["dmz", "demilitarized zone", "screened subnet"]},
  {id:"r29",g:"infra",d:3,t:"802.1X",def:"Port-based network access control: a device must authenticate before the switch port or access point passes its traffic",sc:"A switch port stays blocked until the connected laptop authenticates through a RADIUS server. Which standard is this?",alt:["8021x", "port based authentication", "port-based nac"]},
  {id:"r30",g:"infra",d:3,t:"Secure access service edge (SASE)",def:"A cloud service that combines networking and security, such as SD-WAN and a secure web gateway, for users anywhere",sc:"A company replaces its branch firewalls and VPN with one cloud service that secures users wherever they work. What is this approach?",alt:["sase"]},
  {id:"r5",g:"data",d:3,t:"Data masking",def:"Hiding part of a value when it is displayed, such as showing only the last four digits of a card",sc:"A support screen shows a customer's card number as XXXX-XXXX-XXXX-4421. What technique is this?",avoid:["r6"],alt:["masking"]},
  {id:"r6",g:"data",d:3,t:"Tokenization",def:"Replacing sensitive data with a random token that maps back to the original in a secured vault",sc:"Card numbers in the order database are replaced with random values, and the real numbers live in a separate vault. What technique is this?",avoid:["r5"]},
  {id:"r7",g:"data",d:3,t:"Data sovereignty",def:"Data is subject to the laws of the country where it is stored",sc:"A company must keep EU customer data in EU data centers because of the laws that apply there. Which concept is this?",alt:["sovereignty"]},
  {id:"r8",g:"data",d:3,t:"Data at rest",def:"Data stored on a disk, database, or backup and not currently moving or in use",sc:"Full-disk encryption on a laptop protects which state of data?",avoid:["r31","r32"]},
  {id:"r31",g:"data",d:3,t:"Data in transit",def:"Data moving across a network",sc:"TLS protects which state of data?"},
  {id:"r32",g:"data",d:3,t:"Data in use",def:"Data being processed in memory or by the CPU",sc:"A secure enclave protects data while an application is actively processing it in memory. Which state of data is this?"},
  {id:"r33",g:"data",d:3,t:"Geographic restrictions",def:"Limiting access to data or systems based on location",sc:"Logins to the HR system are blocked when they come from outside the country. Which data protection method is this?"},
  {id:"r34",g:"data",d:3,t:"Trade secret",def:"Confidential business information that gives a competitive edge, such as a formula or process",sc:"A soft-drink maker guards its secret recipe. What type of data is the recipe?"},
  {id:"r35",g:"data",d:3,t:"Regulated data",def:"Data whose handling is controlled by law or regulation, such as health records or payment card data",sc:"Patient records must be protected under HIPAA. What type of data are they?"},
  {id:"r9",g:"res",d:3,t:"Hot site",def:"A fully equipped, running recovery site that can take over almost immediately",sc:"A recovery site runs with current data and can take over within minutes. What type of site is it?",avoid:["r10","r11"],alt:["hot"]},
  {id:"r10",g:"res",d:3,t:"Warm site",def:"A recovery site with some equipment ready that needs time to become fully operational",sc:"A recovery site has servers installed but needs the latest data restored before use. What type of site is it?",avoid:["r9","r11"],alt:["warm"]},
  {id:"r11",g:"res",d:3,t:"Cold site",def:"A recovery location with space and power but little or no equipment ready",sc:"A recovery location has power and empty racks, so equipment must be brought in after a disaster. What type of site is it?",avoid:["r9","r10"],alt:["cold"]},
  {id:"r12",g:"res",d:3,t:"Geographic dispersion",def:"Placing sites far enough apart that a single disaster cannot affect all of them",sc:"A company puts its backup data center 600 miles from headquarters so one hurricane cannot take out both. What is this called?",alt:["geographic redundancy"]},
  {id:"r36",g:"res",d:3,t:"Clustering",def:"Several servers working together as one system, so another takes over if one fails",sc:"Two database servers share storage, and if one fails the other takes over its work automatically. What is this?"},
  {id:"r37",g:"res",d:3,t:"Platform diversity",def:"Using different operating systems or vendors so one flaw cannot take down everything",sc:"A company runs its DNS on both Linux and Windows servers so one operating system flaw cannot stop all name resolution. What is this?"},
  {id:"r38",g:"res",d:3,t:"Multi-cloud",def:"Using more than one cloud provider so the business does not depend on any single one",sc:"A company runs the same application on two different cloud providers so an outage at one does not stop it. What is this?",alt:["multicloud"]},
  {id:"r39",g:"res",d:3,t:"Capacity planning",def:"Making sure there are enough people, technology, and infrastructure to meet demand and survive disruptions",sc:"Before a holiday sale, IT confirms there are enough servers and staff to handle triple the normal traffic. What is this?"},
  {id:"r40",g:"backup",d:3,t:"Snapshot",def:"A point-in-time copy of a virtual machine or volume that can be rolled back to quickly",sc:"Before patching, an admin captures a point-in-time copy of the VM so it can be rolled back in seconds. What is this?"},
  {id:"r41",g:"backup",d:3,t:"Replication",def:"Copying data continuously or nearly continuously to another system or site",sc:"Every change to the main database is copied within seconds to a server at the recovery site. What is this?"},
  {id:"r42",g:"backup",d:3,t:"Journaling",def:"Writing every change to a log first, so data can be rebuilt after a crash",sc:"A database writes every change to a log before applying it, so after a crash it can replay the log. What is this?"},
  {id:"r43",g:"backup",d:3,t:"Offsite backup",def:"Backup copies kept at a different location from the original data",sc:"Weekly backup tapes are taken to a vault across town so one fire cannot destroy both copies. What is this?",alt:["off site backup", "offsite backups"]},
  {id:"r44",g:"backup",d:3,t:"Uninterruptible power supply (UPS)",def:"Battery power that keeps equipment running through short outages and lets it shut down cleanly",sc:"When the power flickers, the servers keep running for 15 minutes on batteries. What provides this?",alt:["ups"]},
  {id:"r45",g:"backup",d:3,t:"Generator",def:"Fuel-powered equipment that supplies power during long outages",sc:"A data center can keep running for days on its own fuel-powered equipment during a regional power outage. What provides this?",alt:["backup generator", "generators"]},
  {id:"r46",g:"backup",d:3,t:"Tabletop exercise",def:"Talking through a disaster scenario around a table without touching any systems",sc:"Department heads meet in a conference room and talk through how they would respond to a flood, step by step. What type of test is this?",alt:["tabletop"]},
  {id:"r47",g:"backup",d:3,t:"Failover test",def:"Deliberately switching to the backup system to prove it can take over",sc:"IT shuts down the main data center's links on purpose to confirm the recovery site takes over. What type of test is this?",alt:["failover", "fail over test"]},
  {id:"r48",g:"backup",d:3,t:"Parallel processing",def:"Running the recovery system alongside production on the same work to confirm it produces the same results",sc:"The recovery site processes the same transactions as production for a week so results can be compared. What type of test is this?",alt:["parallel test", "parallel testing"]}
 ]},
 ops:{need:2,typed:true,labs:["tools","vmcycle","disposal"],groups:[["harden","Hardening & secure coding","Hardening"],["mobile","Mobile devices","Mobile"],["asset","Asset management","Assets"],["vm","Vulnerability management","Vulns"],["mon","Monitoring & alerting","Monitoring"],["ent","Enterprise security tools","Tools"],["auto","Automation & orchestration","Automation"]],items:[
  {id:"o1",g:"harden",d:4,t:"Hardening",def:"Reducing the attack surface by removing unneeded services, closing ports, and changing defaults",sc:"Before deployment, an admin disables unused services and changes all default passwords. What is this process called?"},
  {id:"o4",g:"harden",d:4,t:"Sandboxing",def:"Running untrusted code in an isolated environment so it cannot affect the real system",sc:"An email attachment is opened in an isolated virtual environment to watch what it does. What technique is this?"},
  {id:"o13",g:"harden",d:4,t:"Secure baseline",def:"A documented set of approved security settings that systems are built to and checked against",sc:"Every new server is built from a documented set of approved security settings and checked against it each month. What is that set of settings?",alt:["baseline", "security baseline"]},
  {id:"o14",g:"harden",d:4,t:"WPA3",def:"The current Wi-Fi security standard, which uses SAE to resist offline password cracking",sc:"A new office wireless network should use the strongest current Wi-Fi security standard. Which should it use?",alt:["wpa 3"]},
  {id:"o15",g:"harden",d:4,t:"Input validation",def:"Checking that input matches what is expected before an application uses it",sc:"A web form rejects any ZIP code that is not exactly five digits. Which secure coding technique is this?",alt:["validation"]},
  {id:"o16",g:"harden",d:4,t:"Static code analysis",def:"Reviewing source code for flaws without running it",sc:"A tool scans an application's source code for security flaws before it is ever compiled. What is this?",alt:["static analysis", "sast"]},
  {id:"o17",g:"harden",d:4,t:"Code signing",def:"Digitally signing software so users can confirm who published it and that it was not changed",sc:"Before installing a driver, Windows checks that it was signed by the hardware maker and has not been altered. What makes this possible?"},
  {id:"o18",g:"harden",d:4,t:"Sanitized output (output encoding)",def:"Converting special characters in output so a browser shows them as text instead of running them",sc:"A web app converts < and > to safe codes before showing user comments, so injected scripts appear as plain text. What technique is this?"},
  {id:"o3",g:"mobile",d:4,t:"Mobile device management (MDM)",def:"Centrally enforces security policies on phones and tablets, such as screen locks and remote wipe",sc:"IT requires a PIN on every company phone and can wipe a lost one remotely. Which solution provides this?",alt:["mdm"]},
  {id:"o19",g:"mobile",d:4,t:"Bring your own device (BYOD)",def:"Employees use their own personal devices for work",sc:"Staff read work email on their personal phones, which the company manages with an app. Which deployment model is this?",alt:["byod"]},
  {id:"o20",g:"mobile",d:4,t:"Corporate-owned, personally enabled (COPE)",def:"The company owns the device and allows some personal use",sc:"The company buys phones for staff and lets them install personal apps as well. Which deployment model is this?",alt:["cope"]},
  {id:"o21",g:"mobile",d:4,t:"Choose your own device (CYOD)",def:"Employees pick a device from a list the company has approved",sc:"Staff pick one of three approved phone models, and the company provides the one they choose. Which deployment model is this?",alt:["cyod"]},
  {id:"o22",g:"mobile",d:4,t:"Geofencing",def:"Changing what a device can do based on its location",sc:"Company phones turn off their cameras automatically inside the research lab. What is this?"},
  {id:"o23",g:"asset",d:4,t:"Asset inventory",def:"A tracked list of every hardware and software asset, with its owner and location",sc:"IT keeps a list of every laptop, server, and software license, with who is responsible for each. What is this?"},
  {id:"o24",g:"asset",d:4,t:"Enumeration",def:"Discovering every asset that exists, such as by scanning the network for devices",sc:"A network scan finds 40 devices that are not in the company's records. What asset management activity found them?",avoid:["o23"]},
  {id:"o25",g:"asset",d:4,t:"Sanitization",def:"Removing data from media so it cannot be recovered, such as by overwriting it, while the media can be reused",sc:"Before reselling old laptops, IT overwrites every drive so no data can be recovered. What is this?",alt:["wiping", "data sanitization"]},
  {id:"o26",g:"asset",d:4,t:"Destruction",def:"Physically destroying media, such as by shredding or degaussing, so it can never be used again",sc:"Failed hard drives that held patient data are fed through an industrial shredder. What is this?",alt:["shredding", "physical destruction"]},
  {id:"o27",g:"asset",d:4,t:"Certificate of destruction",def:"Documentation from a vendor proving that media was destroyed or sanitized",sc:"After destroying old drives, a vendor provides a signed document listing each serial number it destroyed. What is this document?",alt:["certificate of sanitization"]},
  {id:"o28",g:"asset",d:4,t:"Data retention",def:"Keeping data for the required period, then disposing of it",sc:"Financial records must be kept for seven years and then deleted. Which part of asset management is this?"},
  {id:"o5",g:"vm",d:4,t:"CVSS",def:"A standard scoring system that rates vulnerability severity from 0 to 10",sc:"A scan report rates a flaw 9.8, Critical. Which scoring system produced that number?",avoid:["o6"],alt:["common vulnerability scoring system"]},
  {id:"o6",g:"vm",d:4,t:"CVE",def:"A public list that gives each known vulnerability a unique identifier",sc:"A vulnerability is referenced as CVE-2024-3094 in vendor advisories. What provides that identifier?",avoid:["o5"],alt:["common vulnerabilities and exposures"]},
  {id:"o7",g:"vm",d:4,t:"False positive",def:"A scan or alert reports a problem that does not actually exist",sc:"A scanner flags a server for a flaw in software that is not installed on it. What is this result?",avoid:["o8"],alt:["false positives"]},
  {id:"o8",g:"vm",d:4,t:"False negative",def:"A scan or alert misses a problem that really exists",sc:"A scan reports a server as clean, but it is later found to have an unpatched critical flaw. What was the scan result?",avoid:["o7"],alt:["false negatives"]},
  {id:"o29",g:"vm",d:4,t:"Vulnerability scan",def:"An automated check of systems for known flaws and missing patches",sc:"A tool checks every server weekly for missing patches and known flaws, then produces a report. What is this?",alt:["vuln scan", "vulnerability scanning"]},
  {id:"o30",g:"vm",d:4,t:"Credentialed scan",def:"A vulnerability scan that logs in to systems so it can find more detailed issues",sc:"A scanner is given an admin account so it can check the installed patches on each server. What kind of scan is this?",alt:["authenticated scan", "credentialed scanning"]},
  {id:"o31",g:"vm",d:4,t:"Bug bounty program",def:"Paying outside researchers who find and responsibly report vulnerabilities",sc:"A company pays $5,000 to a researcher who privately reported a flaw in its website. What program is this?",alt:["bug bounty"]},
  {id:"o32",g:"vm",d:4,t:"Threat feed",def:"A regularly updated stream of threat intelligence, such as malicious IP addresses and domains",sc:"The firewall automatically pulls a list of known malicious IP addresses from an intelligence provider every hour. What is the source?",alt:["threat intelligence feed", "threat intel feed"]},
  {id:"o33",g:"vm",d:4,t:"Package monitoring",def:"Tracking the third-party libraries an application uses for newly found vulnerabilities",sc:"A tool alerts developers when a library their app depends on has a newly published vulnerability. What is this?"},
  {id:"o34",g:"vm",d:4,t:"Rescanning",def:"Scanning again after a fix to confirm the vulnerability is gone",sc:"After patching, the team runs the scan again to confirm the flaw is gone. What step is this?",alt:["rescan"]},
  {id:"o35",g:"vm",d:4,t:"Exception",def:"Formal, documented approval to leave a vulnerability unfixed, usually with a review date",sc:"A legacy system cannot be patched, so management signs off on leaving it as it is until next year's review. What is this?",alt:["exemption", "risk exception"]},
  {id:"o9",g:"mon",d:4,t:"SIEM",def:"Collects and correlates logs from many sources to detect and alert on security events",sc:"Firewall, server, and endpoint logs are sent to one system that correlates them and raises alerts. What is the system?",avoid:["o10","o38"],alt:["siem"]},
  {id:"o10",g:"mon",d:4,t:"SOAR",def:"Automates the response to security events using playbooks",sc:"When a phishing alert fires, a playbook automatically blocks the sender and quarantines the email. Which tool runs it?",avoid:["o9"],alt:["soar"]},
  {id:"o11",g:"mon",d:4,t:"Data loss prevention (DLP)",def:"Detects and blocks sensitive data from leaving the organization",sc:"An email with customer Social Security numbers is blocked before it leaves the company. Which control blocked it?",alt:["dlp", "data loss protection"]},
  {id:"o12",g:"mon",d:4,t:"File integrity monitoring (FIM)",def:"Alerts when critical system or application files change",sc:"An alert fires when a system configuration file on a web server is modified. Which tool raised it?",alt:["fim"]},
  {id:"o36",g:"mon",d:4,t:"SNMP trap",def:"An alert a network device sends on its own when something happens, such as a link going down",sc:"A switch immediately sends a message to the monitoring server when one of its interfaces goes down. What is this message?"},
  {id:"o37",g:"mon",d:4,t:"NetFlow",def:"Records of traffic flows: which hosts talked, when, and how much data they sent, without the contents",sc:"An analyst sees which internal hosts sent the most data to the internet yesterday, without capturing any packet contents. Which data source is this?",alt:["netflow data", "flow data"]},
  {id:"o38",g:"mon",d:4,t:"Log aggregation",def:"Collecting logs from many systems into one place",sc:"Logs from 200 servers are all forwarded to one central store so they can be searched together. What is this?",alt:["log collection", "centralized logging"]},
  {id:"o39",g:"mon",d:4,t:"Alert tuning",def:"Adjusting alert rules to cut false positives without missing real events",sc:"Analysts adjust a rule that fires hundreds of harmless alerts a day so it fires only on real problems. What is this?"},
  {id:"o40",g:"mon",d:4,t:"Quarantine",def:"Isolating a suspicious file or device so it can do no harm while it is examined",sc:"Antivirus moves a suspicious attachment into a protected folder where it cannot run. What is this?"},
  {id:"o41",g:"mon",d:4,t:"Archiving",def:"Storing older logs and data long-term for compliance and investigations",sc:"Logs older than 90 days are moved to low-cost storage and kept for seven years. What is this?"},
  {id:"o2",g:"ent",d:4,t:"Endpoint detection and response (EDR)",def:"Monitors endpoints for suspicious behavior and can respond automatically, such as by isolating a host",sc:"A tool on each laptop spots ransomware-like behavior and isolates the laptop from the network. What is the tool?",avoid:["o48"],alt:["edr"]},
  {id:"o42",g:"ent",d:4,t:"DNS filtering",def:"Blocking access to malicious or banned domains at the DNS lookup",sc:"Lookups for known phishing domains return a block page for every device on the network. What control is this?",alt:["dns filter"]},
  {id:"o43",g:"ent",d:4,t:"Web filter",def:"Blocking websites by category or address",sc:"Staff cannot reach gambling or social media sites because those categories are blocked. What control is this?",avoid:["o42"],alt:["url filtering", "content filter", "web filtering"]},
  {id:"o44",g:"ent",d:4,t:"SPF",def:"A DNS record listing the mail servers allowed to send email for a domain",sc:"A receiving mail server checks a DNS record to see whether the server that sent a message is allowed to send for that domain. Which email control is this?",alt:["sender policy framework"]},
  {id:"o45",g:"ent",d:4,t:"DKIM",def:"A digital signature added to email so receivers can verify it came from the domain and was not changed",sc:"Outgoing messages carry a signature that receivers check against a public key published in the sender's DNS. Which email control is this?",alt:["domainkeys identified mail"]},
  {id:"o46",g:"ent",d:4,t:"DMARC",def:"A DNS policy telling receivers what to do with email that fails SPF or DKIM, plus reports to the domain owner",sc:"A domain publishes a policy telling receivers to reject any message that fails SPF and DKIM checks, and to send reports. Which email control is this?",alt:["dmarc policy"]},
  {id:"o47",g:"ent",d:4,t:"Email gateway",def:"A system that filters incoming and outgoing email for spam, malware, and phishing",sc:"All mail passes through a system that strips malicious attachments and quarantines phishing before it reaches inboxes. What is it?",alt:["secure email gateway", "email security gateway"]},
  {id:"o48",g:"ent",d:4,t:"Extended detection and response (XDR)",def:"Detection and response that correlates data from endpoints, network, cloud, and email together",sc:"One platform links an alert on a laptop with suspicious email and cloud logins to show a single attack. What is it?",alt:["xdr"]},
  {id:"o49",g:"ent",d:4,t:"User behavior analytics (UBA)",def:"Learning each user's normal behavior and alerting on unusual activity",sc:"An alert fires because an accountant who never touches engineering files suddenly downloads thousands of them. What tool raised it?",alt:["uba", "ueba", "user and entity behavior analytics"]},
  {id:"o50",g:"ent",d:4,t:"Group Policy",def:"Windows settings pushed centrally from Active Directory to many computers",sc:"An admin sets a 15-minute screen lock once in Active Directory, and every domain computer applies it. What feature is this?",alt:["gpo", "group policy object"]},
  {id:"o51",g:"ent",d:4,t:"SELinux",def:"A Linux security module that adds mandatory access control",sc:"A Linux server limits what each service can access using labels that even the root user's processes must obey. What feature is this?",alt:["se linux", "security enhanced linux"]},
  {id:"o52",g:"auto",d:4,t:"User provisioning automation",def:"Automatically creating, changing, and removing accounts based on HR records",sc:"When HR marks an employee as terminated, all of her accounts are disabled within minutes with no manual work. What is this?",alt:["automated provisioning"]},
  {id:"o53",g:"auto",d:4,t:"Guardrails",def:"Automated checks that stop actions that break policy",sc:"A script automatically blocks any attempt to make a cloud storage bucket public. What is this?"},
  {id:"o54",g:"auto",d:4,t:"Continuous integration (CI)",def:"Automatically building and testing code every time developers commit changes",sc:"Every time a developer commits code, it is built and run through security tests automatically. What practice is this?",alt:["ci"]},
  {id:"o55",g:"auto",d:4,t:"Workforce multiplier",def:"Automation that lets a small team do the work of a much larger one",sc:"Automated playbooks let a three-person security team handle the alert volume of a team of fifteen. Which benefit of automation is this?"},
  {id:"o56",g:"auto",d:4,t:"Technical debt",def:"The future cost and risk created by quick fixes or code nobody maintains",sc:"Undocumented scripts written years ago now break with every update, and nobody can safely change them. What is this?"},
  {id:"o57",g:"auto",d:4,t:"Single point of failure",def:"One component whose failure stops the whole process",sc:"All automated responses run through one orchestration server, and when it went down, nothing ran. What risk does this show?",alt:["spof"]},
  {id:"o58",g:"auto",d:4,t:"Automatic escalation",def:"Automatically raising a ticket's priority or notifying someone when set conditions are met",sc:"A ticket left unanswered for 30 minutes is automatically reassigned to the on-call manager. What is this?",alt:["escalation"]}
 ]},
 iam:{need:2,typed:true,labs:["factors","acmodels","flows"],groups:[["auth","Accounts & federation","Accounts"],["factor","Authentication factors","Factors"],["pass","Passwords & privileged access","Privileged"],["access","Access control models","Access"]],items:[
  {id:"i2",g:"auth",d:4,t:"Single sign-on (SSO)",def:"One login gives a user access to many systems",sc:"After logging in once in the morning, an employee opens email, HR, and the ticketing system without signing in again. What provides this?",alt:["sso"]},
  {id:"i3",g:"auth",d:4,t:"Federation",def:"Trusting identities issued by another organization so users can sign in with their home account",sc:"A partner's employees access a shared portal using their own company's login. What is this arrangement called?"},
  {id:"i4",g:"auth",d:4,t:"SAML",def:"An XML-based standard that passes authentication data between an identity provider and a service provider",sc:"A cloud app receives an XML assertion from the company's identity provider to log the user in. Which standard is this?",avoid:["i5"],alt:["security assertion markup language"]},
  {id:"i5",g:"auth",d:4,t:"OAuth",def:"An authorization standard that lets an app access resources on a user's behalf without sharing the password",sc:"A calendar app gets permission to read a user's contacts without ever seeing the user's password. Which standard allows this?",avoid:["i4","i11"],alt:["oauth2", "oauth 2.0"]},
  {id:"i11",g:"auth",d:4,t:"OpenID Connect",def:"An identity layer built on OAuth that lets users sign in with an account they already have",sc:"A website offers Sign in with Google using an identity layer built on top of OAuth. Which standard is this?",alt:["oidc"]},
  {id:"i12",g:"auth",d:4,t:"LDAP",def:"A protocol for querying and managing directory services such as Active Directory",sc:"An application looks up a user's group memberships in Active Directory over port 389. Which protocol is it using?",alt:["lightweight directory access protocol"]},
  {id:"i13",g:"auth",d:4,t:"Attestation",def:"Formally confirming that users' access is still correct, often by managers reviewing it",sc:"Each quarter, managers review and sign off on what their team members can access. What is this?",alt:["access review", "access recertification"]},
  {id:"i14",g:"auth",d:4,t:"Deprovisioning",def:"Removing a person's accounts and access when they leave or change roles",sc:"On a contractor's last day, all of her accounts are disabled and her access removed. What process is this?",alt:["offboarding", "deprovision"]},
  {id:"i15",g:"auth",d:4,t:"Identity proofing",def:"Verifying a person's real identity before creating an account, such as by checking ID",sc:"Before issuing a new hire's credentials, HR checks her passport in person. What is this?"},
  {id:"i1",g:"factor",d:4,t:"Multifactor authentication (MFA)",def:"Requiring two or more different factor types, such as something you know and something you have",sc:"A user signs in with a password and then approves a prompt on a phone app. What is this?",alt:["mfa", "2fa", "two factor authentication"]},
  {id:"i16",g:"factor",d:4,t:"Something you know",def:"An authentication factor based on knowledge, such as a password or PIN",sc:"A user types a PIN to unlock a smart card. Which factor is the PIN?",alt:["knowledge factor"]},
  {id:"i17",g:"factor",d:4,t:"Something you have",def:"An authentication factor based on possession, such as a smart card, token, or phone",sc:"A user must have a hardware security key plugged in to sign in. Which factor is the key?",alt:["possession factor"]},
  {id:"i18",g:"factor",d:4,t:"Something you are",def:"An authentication factor based on biometrics, such as a fingerprint or face",sc:"A laptop unlocks when it recognizes the user's face. Which factor is this?",alt:["biometric", "biometrics", "inherence factor"]},
  {id:"i19",g:"factor",d:4,t:"Somewhere you are",def:"An authentication factor based on location, such as GPS or IP address",sc:"A banking app allows logins only when the phone's location is inside the user's home country. Which factor is this?",alt:["location", "location factor"]},
  {id:"i20",g:"factor",d:4,t:"Soft token",def:"An authenticator app that generates time-based one-time codes",sc:"A user opens an app on her phone and types the six-digit code it shows, which changes every 30 seconds. What is she using?",alt:["authenticator app", "totp app"]},
  {id:"i21",g:"factor",d:4,t:"Passwordless authentication",def:"Signing in without a password, such as with a passkey or a biometric on a trusted device",sc:"A user signs in with a passkey and a fingerprint on her laptop, and no password exists for the account. What is this?",alt:["passwordless", "passkey", "passkeys"]},
  {id:"i10",g:"pass",d:4,t:"Just-in-time permissions",def:"Elevated access granted only for a limited time when it is needed",sc:"An admin receives domain admin rights for one hour to finish a change, and they are then removed automatically. What is this?",alt:["jit", "just in time access"]},
  {id:"i22",g:"pass",d:4,t:"Password vault",def:"Encrypted storage for privileged account passwords, which admins check out when needed",sc:"Admins check out the domain admin password from a secure store, which changes it after use. What is the store?",avoid:["i23"]},
  {id:"i23",g:"pass",d:4,t:"Password manager",def:"An app that creates and stores a unique, strong password for each site",sc:"An employee uses an app that creates and remembers a different random password for every website. What is it?"},
  {id:"i24",g:"pass",d:4,t:"Ephemeral credentials",def:"Credentials created for one task that expire automatically",sc:"A script receives a login that works for only 15 minutes and is then deleted. What type of credentials are these?",avoid:["i10"]},
  {id:"i25",g:"pass",d:4,t:"Password complexity",def:"Rules that require a mix of character types in a password",sc:"A policy requires passwords to include uppercase and lowercase letters, numbers, and symbols. What is this?"},
  {id:"i26",g:"pass",d:4,t:"Privileged access management (PAM)",def:"Tools that control, monitor, and record the use of administrator accounts",sc:"A company deploys a system that grants admin rights on request, records each admin session, and rotates admin passwords. What is it?",avoid:["i10","i22","i24"],alt:["pam"]},
  {id:"i6",g:"access",d:4,t:"Least privilege",def:"Giving users only the access they need to do their job",sc:"A new accountant gets access only to the finance folders needed for the job and nothing else. Which principle is this?",alt:["principle of least privilege", "polp"]},
  {id:"i7",g:"access",d:4,t:"Role-based access control (RBAC)",def:"Access is assigned according to a user's job role",sc:"Everyone in the Nurse group gets the same access to patient charts. Which access control model is this?",avoid:["i8","i9"],alt:["rbac", "role based"]},
  {id:"i8",g:"access",d:4,t:"Attribute-based access control (ABAC)",def:"Access is decided by attributes such as department, location, and time of day",sc:"Access to a payroll app is allowed only for Finance staff, on company devices, during business hours. Which model is this?",avoid:["i7","i9","i28"],alt:["abac", "attribute based"]},
  {id:"i9",g:"access",d:4,t:"Mandatory access control (MAC)",def:"Access is decided by security labels and clearances set by the system, not by the data owner",sc:"Only users with a Secret clearance can open files labeled Secret, and owners cannot change this. Which model is this?",avoid:["i7","i8"],alt:["mac", "mandatory"]},
  {id:"i27",g:"access",d:4,t:"Discretionary access control (DAC)",def:"The owner of a resource decides who can access it",sc:"A user creates a folder and decides herself which coworkers can open it. Which access control model is this?",alt:["dac", "discretionary"]},
  {id:"i28",g:"access",d:4,t:"Rule-based access control",def:"Access is decided by rules an admin sets that apply to everyone, such as time-of-day limits",sc:"Nobody can log in to the payroll system outside 7 a.m. to 7 p.m., whatever their role. Which access control model is this?",alt:["rule based", "rbac rule"]}
 ]},
 ir:{need:2,typed:true,labs:["irtimeline","volatility","logs"],groups:[["proc","Response process","Process"],["inv","Investigation & exercises","Forensics"],["src","Data sources","Data sources"]],items:[
  {id:"n1",g:"proc",d:4,t:"Preparation",def:"Building the team, tools, and plans before an incident happens",sc:"A company writes its incident response plan and trains its team before any incident occurs. Which step is this?"},
  {id:"n2",g:"proc",d:4,t:"Detection",def:"Noticing that an incident may be happening, through alerts, logs, or reports",sc:"A SIEM alert shows unusual logins at 3 a.m., and an analyst opens a ticket. Which step is this?"},
  {id:"n3",g:"proc",d:4,t:"Analysis",def:"Confirming the incident and working out its scope and impact",sc:"An analyst confirms the alert is real and determines that three servers are affected. Which step is this?"},
  {id:"n4",g:"proc",d:4,t:"Containment",def:"Limiting the damage, such as by isolating an infected system",sc:"An infected workstation is disconnected from the network to stop the spread. Which step is this?"},
  {id:"n5",g:"proc",d:4,t:"Eradication",def:"Removing the cause of the incident, such as deleting malware and closing the hole it used",sc:"The team removes the malware and deletes the backdoor account the attacker created. Which step is this?"},
  {id:"n6",g:"proc",d:4,t:"Recovery",def:"Restoring systems to normal operation and confirming they work",sc:"Cleaned servers are restored from backup, returned to production, and watched closely. Which step is this?"},
  {id:"n7",g:"proc",d:4,t:"Lessons learned",def:"Reviewing the incident afterward to improve future response",sc:"A week after the incident, the team meets to discuss what went well and what to change. Which step is this?",alt:["lessons learned meeting", "post incident review", "after action review"]},
  {id:"n8",g:"inv",d:4,t:"Chain of custody",def:"A record of everyone who handled evidence, when, and why",sc:"Each person who handles a seized hard drive signs a form with the time and the reason. What is this record?",alt:["custody"]},
  {id:"n9",g:"inv",d:4,t:"Legal hold",def:"An instruction to preserve data that may be needed in litigation",sc:"Lawyers tell IT not to delete any email from a group of employees involved in a lawsuit. What is this?"},
  {id:"n10",g:"inv",d:4,t:"E-discovery",def:"Identifying and collecting electronic information for legal proceedings",sc:"A company searches and produces emails and documents requested by the other side in a lawsuit. What is this process?",alt:["ediscovery", "electronic discovery"]},
  {id:"n11",g:"inv",d:4,t:"Root cause analysis",def:"Finding the underlying reason an incident happened",sc:"After the breach, the team determines that an unpatched VPN appliance let the attacker in. What activity is this?",alt:["rca", "root cause"]},
  {id:"n12",g:"inv",d:4,t:"Threat hunting",def:"Proactively searching for threats that have not triggered any alert",sc:"An analyst searches logs for signs of a known attacker technique even though no alert has fired. What activity is this?"},
  {id:"n13",g:"inv",d:4,t:"Tabletop exercise",def:"Talking through an incident scenario around a table without touching any systems",sc:"The response team talks through a ransomware scenario in a conference room without touching any systems. What type of exercise is this?",alt:["tabletop"]},
  {id:"n14",g:"inv",d:4,t:"Simulation",def:"A realistic practice incident that the team acts out on test systems",sc:"The team stages a realistic fake breach on test systems and carries out every response step. What type of exercise is this?"},
  {id:"n15",g:"inv",d:4,t:"Acquisition",def:"Collecting evidence, such as by making a forensic image of a drive",sc:"An investigator makes a bit-for-bit copy of a suspect's hard drive. Which forensic step is this?",alt:["evidence acquisition", "imaging"]},
  {id:"n16",g:"inv",d:4,t:"Preservation",def:"Protecting evidence from change, such as with write blockers and hashes",sc:"Investigators connect a seized drive through a write blocker and record its hash before they analyze it. Which forensic step is this?",alt:["evidence preservation"]},
  {id:"n17",g:"inv",d:4,t:"Order of volatility",def:"Collecting the most short-lived evidence first, such as memory before disk",sc:"An investigator captures RAM before imaging the hard drive because RAM is lost when power is removed. What principle is this?",alt:["volatility"]},
  {id:"n18",g:"src",d:4,t:"Firewall logs",def:"Records of which connections a firewall allowed or blocked",sc:"To see whether traffic from an outside IP address was allowed in at the perimeter, which log should the analyst check?"},
  {id:"n19",g:"src",d:4,t:"Application logs",def:"Events an application records, such as errors and user actions",sc:"To see which records a user exported from the CRM, which log should the analyst check?"},
  {id:"n20",g:"src",d:4,t:"OS security logs",def:"Login, privilege, and audit events recorded by the operating system",sc:"To find failed logins on a Windows server, which log should the analyst check?"},
  {id:"n21",g:"src",d:4,t:"IPS/IDS logs",def:"Records of known attack signatures detected, and blocked, on the network",sc:"Which log shows which known attack signatures were detected and blocked on the network?"},
  {id:"n22",g:"src",d:4,t:"Endpoint logs",def:"Records from a device's security agent, such as processes started and files changed",sc:"To see which processes ran on one laptop just before it was infected, which data source should the analyst check?"},
  {id:"n23",g:"src",d:4,t:"Metadata",def:"Data about data, such as an email's sender, timestamps, and headers",sc:"An analyst examines an email's headers to trace the servers it passed through. Which data source is this?"},
  {id:"n24",g:"src",d:4,t:"Packet capture",def:"A full copy of network traffic, including its contents",sc:"To see exactly what data an infected host sent out, an analyst reviews the full contents of its traffic. Which data source is this?",alt:["pcap", "packet captures"]},
  {id:"n25",g:"src",d:4,t:"Vulnerability scan output",def:"A report of the flaws and missing patches found on systems",sc:"To find out whether the breached server had known unpatched flaws before the attack, which data source should the analyst check?"}
 ]},
 grc:{need:2,typed:true,labs:["risk","responses","docs","agreements"],groups:[["policy","Policies & awareness","Policies"],["roles","Data roles","Roles"],["risk","Risk management","Risk"],["bia","Business impact analysis","BIA"],["third","Third parties & agreements","Vendors"],["comp","Compliance & privacy","Compliance"],["audit","Audits & testing","Audits"]],items:[
  {id:"g1",g:"policy",d:5,t:"Acceptable use policy (AUP)",def:"Rules for how employees may use company systems, networks, and data",sc:"New hires sign a document listing what they may and may not do with company computers. What is the document?",alt:["aup"]},
  {id:"g4",g:"policy",d:5,t:"Security awareness training",def:"Teaching staff to recognize and report threats such as phishing",sc:"Employees complete a course and simulated phishing tests on how to spot suspicious emails. What is this?",alt:["awareness training", "security training"]},
  {id:"g14",g:"policy",d:5,t:"Information security policy",def:"The top-level policy that sets the organization's security goals and who is responsible for what",sc:"Leadership approves one document that sets the company's overall security goals and responsibilities. What is it?",alt:["security policy", "infosec policy"]},
  {id:"g15",g:"policy",d:5,t:"Standard",def:"A mandatory rule with specific requirements, such as a minimum password length",sc:"A document requires every password to be at least 14 characters and all stored data to use AES-256. What type of document is this?",avoid:["g16"]},
  {id:"g16",g:"policy",d:5,t:"Procedure",def:"Step-by-step instructions for carrying out a task",sc:"A document lists, step by step, how help desk staff must reset a user's password. What type of document is this?"},
  {id:"g17",g:"policy",d:5,t:"Guideline",def:"Recommended advice that is not mandatory",sc:"A document suggests, but does not require, that staff lock their screens when stepping away. What type of document is this?"},
  {id:"g18",g:"policy",d:5,t:"Playbook",def:"A checklist of actions for responding to one specific type of incident",sc:"When a phishing email is reported, the team follows a checklist written just for phishing. What is the checklist?",alt:["runbook"]},
  {id:"g19",g:"policy",d:5,t:"Phishing campaign",def:"Sending simulated phishing emails to staff to test and train them",sc:"The security team sends fake phishing emails to staff and records who clicks. What is this?",avoid:["g4"],alt:["phishing simulation", "simulated phishing"]},
  {id:"g20",g:"policy",d:5,t:"Anomalous behavior recognition",def:"Training staff to notice and report unusual or risky behavior",sc:"Training teaches employees to report a coworker who suddenly copies large amounts of data late at night. What is this training topic?"},
  {id:"g2",g:"roles",d:5,t:"Data owner",def:"The senior person accountable for a data set, including how it is classified",sc:"The VP of Sales decides how customer records are classified and who may access them. What role is the VP?",avoid:["g3"]},
  {id:"g3",g:"roles",d:5,t:"Data custodian",def:"The person who maintains and protects data day to day, such as running backups",sc:"A database administrator applies the access rules and runs nightly backups of the customer records. What role is this?",avoid:["g2"]},
  {id:"g21",g:"roles",d:5,t:"Data controller",def:"The organization that decides why and how personal data is processed",sc:"Under GDPR, a retailer decides what customer data to collect and why. What is the retailer's role?",avoid:["g2"]},
  {id:"g22",g:"roles",d:5,t:"Data processor",def:"An organization that processes personal data on behalf of the controller",sc:"A payroll company processes employee data on behalf of its client. What role is the payroll company?",avoid:["g3"]},
  {id:"g23",g:"roles",d:5,t:"Data subject",def:"The person the personal data is about",sc:"Under GDPR, a customer whose order history a company stores has the right to see that data. What is the customer called?"},
  {id:"g5",g:"risk",d:5,t:"Risk transference",def:"Shifting the impact of a risk to another party, such as by buying insurance",sc:"A company buys cybersecurity insurance to cover the cost of a breach. Which risk response is this?",alt:["transfer", "transference"]},
  {id:"g6",g:"risk",d:5,t:"Risk acceptance",def:"Acknowledging a risk and choosing not to act on it",sc:"Management decides the cost of fixing a low-impact risk is higher than its likely loss and does nothing. Which risk response is this?",alt:["accept", "acceptance"]},
  {id:"g7",g:"risk",d:5,t:"Risk avoidance",def:"Stopping the activity that creates the risk",sc:"A company stops offering a risky service entirely instead of securing it. Which risk response is this?",alt:["avoid", "avoidance"]},
  {id:"g8",g:"risk",d:5,t:"Risk mitigation",def:"Reducing the likelihood or impact of a risk with controls",sc:"A company adds MFA and network segmentation to lower the chance of a breach. Which risk response is this?",alt:["mitigate", "mitigation", "risk reduction"]},
  {id:"g9",g:"risk",d:5,t:"Annualized loss expectancy (ALE)",def:"The expected yearly cost of a risk: single loss expectancy times the annualized rate of occurrence",sc:"A risk costs $5,000 each time and happens twice a year. Which value is $10,000?",alt:["ale"]},
  {id:"g24",g:"risk",d:5,t:"Single loss expectancy (SLE)",def:"The cost of one occurrence of a risk: asset value times exposure factor",sc:"A server worth $10,000 would lose 40% of its value in one flood. What is the $4,000 figure?",alt:["sle"]},
  {id:"g25",g:"risk",d:5,t:"Annualized rate of occurrence (ARO)",def:"How many times a risk is expected to happen in one year",sc:"A flood is expected once every 10 years. What does the value 0.1 represent?",alt:["aro"]},
  {id:"g26",g:"risk",d:5,t:"Risk register",def:"A document listing identified risks with their owners, ratings, and responses",sc:"The security team keeps a list of every identified risk with its owner, score, and planned response. What is it?"},
  {id:"g27",g:"risk",d:5,t:"Risk appetite",def:"How much risk an organization is willing to accept to reach its goals",sc:"The board states it will accept moderate risk to launch products quickly. What has the board defined?"},
  {id:"g28",g:"risk",d:5,t:"Key risk indicator (KRI)",def:"A metric that warns when a risk is growing",sc:"The number of unpatched critical servers is tracked monthly to warn when breach risk is rising. What is this metric?",alt:["kri"]},
  {id:"g29",g:"risk",d:5,t:"Risk owner",def:"The person accountable for managing a specific risk",sc:"The VP of Operations is named as accountable for the risk of a supplier outage. What is her role for this risk?"},
  {id:"g30",g:"risk",d:5,t:"Qualitative risk analysis",def:"Rating risks with categories such as high, medium, and low",sc:"A team rates each risk as high, medium, or low for likelihood and impact. What type of analysis is this?"},
  {id:"g31",g:"risk",d:5,t:"Quantitative risk analysis",def:"Rating risks with numbers, such as dollar values and yearly frequencies",sc:"A team calculates each risk's expected yearly cost in dollars. What type of analysis is this?"},
  {id:"g32",g:"bia",d:5,t:"Recovery time objective (RTO)",def:"The longest a system can be down before the outage causes unacceptable harm",sc:"Management says the order system must be back online within 4 hours of an outage. Which metric is this?",alt:["rto"]},
  {id:"g33",g:"bia",d:5,t:"Recovery point objective (RPO)",def:"The most data, measured in time, the business can afford to lose",sc:"The business can lose no more than 15 minutes of transactions, so backups run every 15 minutes. Which metric is this?",alt:["rpo"]},
  {id:"g34",g:"bia",d:5,t:"Mean time between failures (MTBF)",def:"The average time a repairable system runs between failures",sc:"A drive model averages 1.2 million hours of operation between failures. Which metric is this?",alt:["mtbf"]},
  {id:"g35",g:"bia",d:5,t:"Mean time to repair (MTTR)",def:"The average time it takes to repair a failed system and return it to service",sc:"On average, it takes the team 3 hours to repair a failed switch. Which metric is this?",alt:["mttr"]},
  {id:"g36",g:"bia",d:5,t:"Business impact analysis (BIA)",def:"Identifying the most critical business functions and what an outage of each would cost",sc:"The team identifies which business functions matter most and what a day's outage of each would cost. What is this?",alt:["bia"]},
  {id:"g10",g:"third",d:5,t:"Service-level agreement (SLA)",def:"A contract that defines the level of service a provider must deliver, such as uptime",sc:"A contract promises 99.9% uptime and credits if the provider misses it. What type of agreement is this?",avoid:["g11"],alt:["sla"]},
  {id:"g11",g:"third",d:5,t:"Non-disclosure agreement (NDA)",def:"An agreement that legally requires a party to keep shared information confidential",sc:"A vendor signs an agreement not to reveal the product plans it sees during a project. What is it?",avoid:["g10"],alt:["nda"]},
  {id:"g12",g:"third",d:5,t:"Right-to-audit clause",def:"A contract term that lets the customer assess the vendor's security controls",sc:"A contract allows the customer to inspect the vendor's security controls each year. What is this term called?",alt:["right to audit"]},
  {id:"g37",g:"third",d:5,t:"Master service agreement (MSA)",def:"An agreement that sets the general terms for all future work between two parties",sc:"A company signs one agreement with a consultancy that sets payment and liability terms for every future project. What is it?",avoid:["g38"],alt:["msa"]},
  {id:"g38",g:"third",d:5,t:"Statement of work (SOW)",def:"A document that defines the specific work, deliverables, and timeline for one project",sc:"A document lists exactly what a contractor will deliver for a network upgrade and by when. What is it?",alt:["sow"]},

function heroRadar(){
  const cx=180,cy=95,pt=(r,deg)=>{const a=(deg-90)*Math.PI/180;return [(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];};

    const hit=((deg-50+360)%360)/360*RADAR_S; return `<circle cx="${x}" cy="${y}" r="4" fill="${DOMC[d]}" class="blip" style="animation-delay:${(hit-RADAR_S).toFixed(2)}s"/>`; }).join("");

  ${ring}${blips}`;
}

/* options: array of strings; answer: index into options (pre-shuffle) */
/* Why each answer: the correct option with why it is right, then every other option with why it is wrong.
   why[i] is keyed by the option's original index; the correct option falls back to explain. sel marks the student's pick. */
function whyList(o){
  const {options,answer,why,explain,sel,mono,display}=o; const order=display||options.map((_,i)=>i);
  const txt=i=>`<b class="${mono?"mono":""}">${esc(options[i])}</b>`; const you=i=>i===sel?` <span class="why-you">your answer</span>`:"";
  const right=`<li class="why-ok"><span class="why-k" aria-label="Correct">✓</span><div>${txt(answer)}${you(answer)}<div>${why&&why[answer]?why[answer]:(explain||"")}</div></div></li>`;
  const wrong=order.filter(i=>i!==answer).map(i=>`<li class="why-no"><span class="why-k" aria-label="Incorrect">✗</span><div>${txt(i)}${you(i)}<div>${why&&why[i]?why[i]:""}</div></div></li>`).join("");
  return `<ul class="why">${right}${wrong}</ul>`;
}
function choiceQ(area,cfg){
  const n=cfg.options.length;
  let order=[...Array(n).keys()];
  if(cfg.shuffle!==false) shuffle(order);
  const labels = cfg.labels || "ABCDEFG".split("");
  const inst = mode==="instructor" && !cfg.forceStudent;
  const deferred = !!cfg.deferred && !inst;
  area.innerHTML=`<div class="card">
    ${cfg.meta?`<div class="q-meta">${cfg.meta}</div>`:""}
    <div class="q-prompt">${cfg.prompt}</div>
    <div class="opts ${cfg.grid?'grid7':''} ${cfg.optHtml?'picopts':''}">${order.map((oi,i)=>`<button class="opt" data-i="${oi}" ${cfg.optHtml?`aria-label="${esc(labels[i])}: picture ${i+1}"`:""}><span class="k">${esc(cfg.labels?labels[oi]:labels[i])}</span><span class="tx ${cfg.mono?'mono':''}">${cfg.optHtml?cfg.optHtml[oi]:esc(cfg.options[oi])}</span></button>`).join("")}</div>
    <div class="q-actions">
      ${inst?`<button class="btn" data-act="reveal">Reveal answer</button>`:""}
      <button class="btn ${inst?'ghost':''}" data-act="next" ${deferred?'disabled':'hidden'}>${cfg.nextLabel||"Next"}</button>
      <span class="kbd">Keys: ${cfg.labels?'number':'A–D'} to answer · Enter for next</span>
    </div>
    <div class="fb" hidden></div></div>`;
  const btns=[...area.querySelectorAll(".opt")];
  const fb=area.querySelector(".fb"), nextB=area.querySelector('[data-act="next"]'), revB=area.querySelector('[data-act="reveal"]');
  let done=false, chosen=null;
  function reveal(sel){
    done=true;
    btns.forEach(b=>{ b.disabled=true; const i=+b.dataset.i; if(i===cfg.answer) b.classList.add("correct"); else if(sel!==null && i===sel && !inst) b.classList.add("wrong"); });
    const ok = sel===cfg.answer;
    fb.innerHTML = (inst?`<div class="v ok">Answer: ${esc(cfg.options[cfg.answer])}</div>`:`<div class="v ${ok?'ok':'bad'}">${ok?'Correct.':'Not quite. Correct answer: '+esc(cfg.options[cfg.answer])}</div>`)
      + (cfg.why?(cfg.whyNote?`<p>${cfg.whyNote}</p>`:"")+whyList({options:cfg.options,answer:cfg.answer,why:cfg.why,explain:cfg.explain,sel:inst?null:sel,mono:cfg.mono,display:order}):(cfg.explain?`<p>${cfg.explain}</p>`:""));
    fb.hidden=false; nextB.hidden=false; if(revB) revB.hidden=true;
    if(!inst && cfg.onResult) cfg.onResult(ok);
    nextB.focus({preventScroll:true});
  }
  function choose(i){
    if(done) return;
    if(inst || deferred){
      btns.forEach(b=>b.classList.toggle("picked", +b.dataset.i===i));
      chosen=i; if(deferred){ nextB.disabled=false; cfg.onSelect&&cfg.onSelect(i); }
      return;
    }
    reveal(i);
  }
  btns.forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  if(revB) revB.addEventListener("click",()=>reveal(chosen));
  nextB.addEventListener("click",()=>{ if(deferred && chosen===null) return; cfg.onNext&&cfg.onNext(chosen); });
  curKeys=e=>{
    const k=e.key.toUpperCase();
    if(k==="ENTER"){ e.preventDefault(); if(inst && !done){ reveal(chosen); } else if(!nextB.hidden && !nextB.disabled) nextB.click(); return; }
    let idx=-1;
    if(cfg.labels){ idx = cfg.labels.findIndex(l=>l[0]===k); }
    else { const L="ABCDEFG".indexOf(k); const N="1234567".indexOf(k); idx = L>=0?L:N; if(idx>=0 && idx<order.length) idx=order[idx]; else idx=-1; }
    if(idx>=0 && idx<n) choose(idx);
  };
}

    const head = inst||gaveUp ? `<div class="v ok">Answer: <span class="mono">${esc(cfg.answer)}</span></div>` : `<div class="v ${ok?'ok':'bad'}">${ok?'Correct.':'Not quite. Answer: <span class="mono">'+esc(cfg.answer)+'</span>'}</div>`;

    fb.hidden=false; nextB.hidden=false; nextB.focus({preventScroll:true});

  }

  area.querySelector('[data-act="check"]')?.addEventListener("click",chk);
  area.querySelector('[data-act="skip"]')?.addEventListener("click",()=>finish(false,true));
  area.querySelector('[data-act="reveal"]')?.addEventListener("click",()=>finish(true,true));
  nextB.addEventListener("click",()=>cfg.onNext());
  curKeys=e=>{ if(e.key!=="Enter") return; e.preventDefault(); if(!done){ if(inst) finish(true,true); else chk(); } else nextB.click(); };
  if(inp) setTimeout(()=>inp.focus({preventScroll:true}),0);
}

function poolRun(area,mod,items,toQ,sc){
  const S=sc||{r:0,t:0}; let q=shuffle(items.slice());
  function next(){
    if(!q.length) q=shuffle(items.slice());
    const it=q.shift(); const cfg=toQ(it);
    choiceQ(area,{...cfg,onResult:ok=>{ S.t++; if(ok) S.r++; else q.splice(Math.min(3,q.length),0,it); rec(mod,it.id,ok); scoreUpd(S.r,S.t); },onNext:next});
  }
  next();
}

const QUAL_NEED=4;
const QUAL_GROUPS=[
 {q:"FIRST",short:"First",rule:"Pick the action that comes first in the process, usually the one that stops harm from spreading or protects evidence. Containment comes before eradication, recovery, and reporting.",concept:["The action that comes first in the process, such as containing the threat","The most thorough long-term fix","The action that restores service fastest","Reporting the incident to management"],cwhy:["A long-term fix may be right eventually, but FIRST asks what comes before anything else, usually stopping the harm or following the process in order.", "Restoring service before the threat is contained can bring the problem straight back.", "Reporting matters, but it does not come before the action the process puts first."]},
 {q:"NEXT",short:"Next",rule:"Work out which step the scenario has already finished, then choose the step that comes right after it. Many NEXT questions follow the incident response process.",concept:["Which step the scenario already finished, so you can choose the step that follows","Which fix is cheapest","Which control category applies","Who the incident should be reported to"],cwhy:["Cost does not decide the order. The step that follows the finished one does.", "The control category describes a control. It does not tell you where you are in the process.", "Reporting is one step, not the rule for every NEXT question. Find the step that follows the one just finished."]},
 {q:"BEST",short:"Best",rule:"Several options may help. Choose the one that meets every stated requirement and addresses the actual cause, not a workaround that only gets close.",concept:["The option that meets every stated requirement and addresses the cause","Any option that would help","The fastest option, even if it misses a requirement","The option with the most features"],cwhy:["Several options may help. BEST means the one that meets every requirement most directly.", "Speed does not win if it misses a stated requirement.", "Extra features do not matter if the option misses a requirement."]},
 {q:"MOST likely",short:"Most likely",rule:"Match the answer to the evidence. The indicators in the scenario, such as the delivery method, the log entries, or who is affected, point to one attack or cause.",concept:["The attack or cause that matches the specific evidence in the scenario","The most severe attack that could possibly happen","The attack that is easiest to stop","The answer mentioned first in the question"],cwhy:["The worst case is rarely the likeliest. Match the attack to the clues in the scenario.", "How easy an attack is to stop says nothing about which attack is happening.", "Where an answer appears in the question is not evidence. Match the clues in the scenario."]},
 {q:"MINIMUM",short:"Minimum",rule:"Choose the smallest option that still meets every requirement: the least privilege, the narrowest access, the simplest control. Larger options often work, but they are not the minimum.",concept:["The smallest option that still meets every requirement","The cheapest option, even if it falls short","The broadest option, to allow for growth","Any option that meets most of the requirements"],cwhy:["Cheaper is not enough. The option must still meet every requirement.", "Extra scope goes beyond the minimum the question asks for, and against least privilege.", "Meeting most requirements is not enough. MINIMUM means the smallest option that meets all of them."]}
];
/* A qualifier is mastered once QUAL_NEED different questions about it are answered correctly. Credit stays until Reset or Prestige. */
function qualState(){
  P.qualM=P.qualM||{}; const old=P.items.qualifier||{};
  return QUAL_GROUPS.map((g,k)=>{ const keys=Object.assign({},P.qualM[k]||{}); QUAL.forEach(it=>{ if(it.qual===g.q&&old[it.id]===true) keys["q:"+it.id]=1; });

  }
  let lastId=null;
  function build(){
    const st=qualState(); const need=st.filter(x=>!x.mastered).map(x=>x.k);
    const k=(need.length&&Math.random()<0.8)?pick(need):rnd(QUAL_GROUPS.length); const g=QUAL_GROUPS[k];
