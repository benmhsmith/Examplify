 {id:"b48",d:2,q:"A user finds a USB drive labeled Confidential in the parking lot and plugs it in to see who owns it. Malware installs. What type of threat vector was used?",o:["Removable device","Image-based","Message-based","Unsecure wireless network"],a:0,x:"Malware delivered on a USB drive that someone plugs in uses removable media as the threat vector. Leaving drives for people to find is also called baiting.",w:["","Image-based vectors hide code in image files.","Message-based vectors arrive by email, SMS, or chat.","An unsecure wireless network is attacked over the air."]},
 {id:"b49",d:2,q:"A researcher finds a flaw in a company's website and quietly reports it to the company so it can be fixed before anyone abuses it. What motivates this actor?",o:["Ethical","Financial gain","Espionage","Revenge"],a:0,x:"Finding flaws and reporting them responsibly is an ethical motivation.",w:["","There is no money involved. The researcher reported the flaw privately.","Espionage is secretly stealing information.","Revenge is getting back at someone. This researcher is helping."]},
 {id:"b50",d:2,q:"Which of the following is an example of a supply chain attack?",o:["Malware inserted into a vendor's software update that customers install","A phishing email sent to the finance team","A brute-force attack on the VPN","A DDoS attack against the company website"],a:0,x:"A supply chain attack compromises a supplier, vendor, or product to reach the real target. A tainted software update is the classic example.",w:["","A phishing email to staff is social engineering, not a supply chain attack.","Brute force on the VPN attacks the company directly.","A DDoS attacks the company directly."]},
 {id:"b51",d:3,q:"Under the shared responsibility model for infrastructure as a service (IaaS), who is responsible for patching the guest operating system?",o:["The customer","The cloud provider","The hypervisor vendor","Both equally"],a:0,x:"In IaaS, the provider secures the physical hardware and the hypervisor, and the customer manages and patches the operating systems and everything above them.",w:["","In IaaS the provider secures the hardware and hypervisor, not the guest OS.","The hypervisor vendor has no role in patching customer VMs.","The model splits the work: the guest OS belongs to the customer."]},
 {id:"b52",d:3,q:"Which cloud model lets a customer run code without managing any servers, paying only when the code runs?",o:["Serverless","IaaS","Virtualization","Containerization"],a:0,x:"Serverless computing runs functions on demand while the provider manages the servers. With IaaS, the customer manages the virtual machines.",w:["","IaaS means managing virtual servers yourself.","Virtualization runs VMs, which still need managing.","Containers still run on hosts someone must manage."]},
 {id:"b53",d:3,q:"An engineer wants each application to be packaged with its libraries so it runs the same way on any host, while sharing the host's kernel. Which technology should the engineer use?",o:["Containers","Virtual machines","Air-gapped servers","Thin clients"],a:0,x:"Containers bundle an app with its dependencies and share the host operating system's kernel. Virtual machines each run a full operating system of their own.",w:["","VMs each run their own full operating system rather than sharing the host's kernel.","Air gapping isolates systems from networks.","Thin clients are lightweight desktops that run apps from a server."]},
 {id:"b54",d:3,q:"Administrators must first connect to a single hardened server before they can manage any system in the secure network zone. What is this hardened server called?",o:["Jump server","Proxy server","Load balancer","Domain controller"],a:0,x:"A jump server (jump box) is the one hardened entry point admins use to reach a secure zone.",w:["","A proxy forwards client requests, usually web traffic.","A load balancer spreads traffic across servers.","A domain controller handles authentication."]},
 {id:"b55",d:3,q:"A firewall protecting a hospital's life-support monitoring network must keep traffic flowing even if the firewall's inspection engine fails. How should the firewall be configured?",o:["Fail-open","Fail-closed","Fail-secure","Inline blocking"],a:0,x:"Fail-open lets traffic pass if the device fails, putting availability first, which matters for life-safety systems. Fail-closed (fail-secure) blocks everything on failure.",w:["","Fail-closed blocks all traffic on failure, which could cut off life-support monitoring.","Fail-secure is another name for fail-closed.","Inline blocking drops traffic it judges bad. It is not a failure mode."]},
 {id:"b56",d:3,q:"A company wants its public web server reachable from the internet but separated from the internal network. Where should the server be placed?",o:["In a screened subnet","On the internal LAN","Behind the internal firewall only","On an air-gapped network"],a:0,x:"A screened subnet (formerly called a DMZ) holds public-facing servers between the internet and the internal network.",w:["","The internal LAN would put a public server inside the trusted network.","Behind the internal firewall is the internal network, not a separate zone.","An air-gapped network has no internet connection at all."]},
 {id:"b57",d:3,q:"Which standard requires a device to authenticate before a switch port will pass its traffic?",o:["802.1X","802.11ac","802.3af","802.1Q"],a:0,x:"802.1X is port-based network access control, usually with a RADIUS server. 802.11ac is Wi-Fi, 802.3af is Power over Ethernet, and 802.1Q is VLAN tagging.",w:["","802.11ac is a Wi-Fi standard.","802.3af is Power over Ethernet.","802.1Q is VLAN tagging."]},
 {id:"b58",d:3,q:"A small branch office needs one device that combines a firewall, intrusion prevention, antivirus, and web filtering. Which should it buy?",o:["Unified threat management appliance","Web application firewall","Load balancer","Jump server"],a:0,x:"A UTM appliance combines several security functions in one box, which suits small sites. A WAF protects only web applications.",w:["","A WAF protects only web applications.","A load balancer spreads traffic. It is not a security suite.","A jump server is an admin entry point."]},
 {id:"b59",d:3,q:"Which of the following protects data in transit?",o:["TLS","Full-disk encryption","A secure enclave","Database encryption"],a:0,x:"TLS encrypts data as it moves across a network. Full-disk and database encryption protect data at rest, and a secure enclave protects data in use.",w:["","Full-disk encryption protects data at rest.","A secure enclave protects data in use.","Database encryption protects stored data at rest."]},
 {id:"b60",d:3,q:"A company must keep EU citizens' personal data in data centers inside the EU. Which concept requires this?",o:["Data sovereignty","Data masking","Data classification","Data retention"],a:0,x:"Data sovereignty means data is subject to the laws of the country where it is stored, which can require keeping it within certain borders.",w:["","Masking hides part of a value on screen.","Classification labels data by sensitivity. It does not decide which country it lives in.","Retention decides how long data is kept, not where."]},
 {id:"b61",d:3,q:"A help desk screen shows customers' card numbers as XXXX-XXXX-XXXX-1234. Which technique is this?",o:["Data masking","Tokenization","Hashing","Steganography"],a:0,x:"Masking hides part of a value when it is displayed. Tokenization replaces the whole value with a token, and hashing is a one-way transformation.",w:["","Tokenization replaces the whole value with a token.","Hashing transforms the whole value one-way. It would not show the last four digits.","Steganography hides data inside other files."]},
 {id:"b62",d:3,q:"A company can afford to lose at most one hour of transaction data after an outage. Which metric does this define?",o:["Recovery point objective (RPO)","Recovery time objective (RTO)","Mean time to repair (MTTR)","Mean time between failures (MTBF)"],a:0,x:"RPO is the maximum acceptable data loss, measured in time. RTO is how quickly service must be restored.",w:["","RTO is how long the system can be down, not how much data can be lost.","MTTR is the average time to repair.","MTBF is the average time between failures."]},
 {id:"b63",d:3,q:"A recovery site has racks, power, and network connections, but no servers. Equipment must be shipped in after a disaster. Which type of site is it?",o:["Cold site","Warm site","Hot site","Mobile site"],a:0,x:"A cold site has space and power but little or no equipment, so it takes the longest to bring online.",w:["","A warm site has equipment ready. Only data needs restoring.","A hot site is fully running with current data.","A mobile site is a portable trailer or container."]},
 {id:"b64",d:3,q:"Before applying a risky update to a virtual machine, an administrator wants a way to roll back within seconds if it fails. What should the administrator take?",o:["A snapshot","A full tape backup","A differential backup","A replication job"],a:0,x:"A snapshot captures the VM's state at a point in time and can be reverted almost instantly. Restoring from tape takes far longer.",w:["","Restoring from tape takes far longer than seconds.","A differential backup still has to be restored, which takes time.","Replication copies data elsewhere. It would also copy the failed update."]},
 {id:"b65",d:3,q:"Which of the following gives a data center power for days during a regional outage?",o:["Generator","UPS","Surge protector","Power distribution unit"],a:0,x:"A generator runs on fuel and can supply power for as long as it is refueled. A UPS battery covers only minutes, enough to switch to a generator or shut down cleanly.",w:["","A UPS runs on batteries for minutes, long enough to switch to a generator or shut down cleanly.","A surge protector blocks voltage spikes. It supplies no power.","A PDU distributes power within a rack. It does not generate any."]},
 {id:"b66",d:3,q:"Department leaders meet in a conference room and talk through how they would respond to a ransomware outage, without touching any systems. Which type of test is this?",o:["Tabletop exercise","Failover test","Parallel processing","Simulation"],a:0,x:"A tabletop exercise is a discussion-based walk-through. A failover test actually switches systems over, and a simulation acts out the scenario on systems.",w:["","A failover test actually switches systems over to the backup.","Parallel processing runs the recovery site alongside production on real work.","A simulation acts out the scenario on systems, not just in discussion."]},
 {id:"b67",d:3,q:"A company runs its DNS service on both Linux and Windows servers so that a single operating system vulnerability cannot stop name resolution. Which resilience concept is this?",o:["Platform diversity","Load balancing","Clustering","Geographic dispersion"],a:0,x:"Using different platforms or vendors so one flaw cannot affect everything is platform diversity.",w:["","Load balancing spreads traffic across servers, which could all share the same OS flaw.","Clustering lets servers take over for each other, but the same flaw could hit them all.","Geographic dispersion spreads sites across locations, not across operating systems."]},
 {id:"b68",d:3,q:"Which device spreads incoming requests across several web servers so no single server is overloaded?",o:["Load balancer","Proxy server","Jump server","Web application firewall"],a:0,x:"A load balancer distributes traffic across a pool of servers for performance and availability.",w:["","A proxy makes requests on behalf of clients, usually outbound web traffic.","A jump server is an admin entry point.","A WAF filters web attacks. It does not spread the load."]},
 {id:"b69",d:3,q:"A water treatment plant monitors and controls pumps at remote stations from a central system. Which type of system is this?",o:["SCADA","SDN","SASE","VDI"],a:0,x:"Supervisory Control and Data Acquisition (SCADA) systems monitor and control industrial processes across sites. They are a type of industrial control system (ICS).",w:["","SDN manages networks centrally in software.","SASE is cloud-delivered networking and security.","VDI hosts virtual desktops."]},
 {id:"b70",d:3,q:"Which of the following is a security concern specific to IoT devices?",o:["Weak default credentials and infrequent firmware updates","Too much processing power for encryption","Mandatory vendor patching every week","Built-in hardware security modules"],a:0,x:"Many IoT devices ship with default passwords and rarely get firmware updates, which makes them easy targets.",w:["","IoT devices usually have too little processing power, not too much.","IoT devices are often patched rarely, not weekly.","Few IoT devices have HSMs. That would be a strength, not a concern."]},
 {id:"b71",d:3,q:"Which data type is a company's secret manufacturing process that gives it a competitive advantage?",o:["Trade secret","Regulated data","Public data","Personally identifiable information"],a:0,x:"Confidential business information that gives a competitive edge, such as a recipe or process, is a trade secret.",w:["","Regulated data is controlled by law, like health or card data.","Public data is meant to be shared openly.","PII identifies people. A manufacturing process does not."]},
 {id:"b72",d:3,q:"A company replaces its branch VPNs and firewalls with a single cloud service that applies security policies to users wherever they work. What is this approach?",o:["Secure access service edge (SASE)","Software-defined networking (SDN)","Infrastructure as code (IaC)","Unified threat management (UTM)"],a:0,x:"SASE combines networking, such as SD-WAN, with cloud-delivered security for users in any location.",w:["","SDN centralizes network control, but it does not deliver security to users anywhere.","IaC defines infrastructure in code files.","UTM is one on-site box that combines security functions, not a cloud service."]},
 {id:"b73",d:4,q:"Which of the following BEST describes hardening a new server before deployment?",o:["Disabling unneeded services, closing unused ports, and changing default settings","Installing every available software package","Giving all users administrator rights","Turning off logging to improve performance"],a:0,x:"Hardening shrinks the attack surface by removing what is not needed and securing what remains.",w:["","Installing everything adds attack surface instead of shrinking it.","Admin rights for everyone is the opposite of least privilege.","Turning off logging removes your ability to detect attacks."]},
 {id:"b74",d:4,q:"A company wants employees' phones to be company-owned but allow personal apps. Which mobile deployment model is this?",o:["COPE","BYOD","CYOD","VDI"],a:0,x:"Corporate-owned, personally enabled (COPE) devices belong to the company but allow personal use. BYOD devices belong to the employee.",w:["","BYOD devices belong to the employee, not the company.","With CYOD the employee chooses from approved models. The key point here is company ownership plus personal use.","VDI is a desktop hosting model, not a phone ownership model."]},
 {id:"b75",d:4,q:"Which wireless security standard uses Simultaneous Authentication of Equals (SAE) to resist offline password-cracking attacks?",o:["WPA3","WPA2","WEP","WPS"],a:0,x:"WPA3 replaced WPA2's pre-shared key handshake with SAE, which resists offline dictionary attacks. WEP is broken, and WPS is a setup feature with a weak PIN.",w:["","WPA2 uses the older pre-shared key handshake, which is open to offline guessing.","WEP is broken and should never be used.","WPS is a setup shortcut with a weak PIN."]},
 {id:"b76",d:4,q:"Old hard drives that held patient records will be thrown away. Which method gives the MOST assurance that the data cannot be recovered?",o:["Physical destruction such as shredding","A quick format","Deleting the files","Reinstalling the operating system"],a:0,x:"Shredding destroys the media itself, so nothing can be recovered. Formatting, deleting, and reinstalling leave data that recovery tools can often find.",w:["","A quick format leaves the data on the disk, where recovery tools can find it.","Deleting files removes only the pointers to the data.","Reinstalling the OS overwrites only part of the drive."]},
 {id:"b77",d:4,q:"After destroying a batch of drives, the disposal vendor provides a signed document listing each serial number. What is this document?",o:["Certificate of destruction","Chain of custody form","Asset inventory","Data retention policy"],a:0,x:"A certificate of destruction proves that specific media was destroyed, which supports compliance.",w:["","A chain of custody form tracks who handled evidence.","An asset inventory lists the assets you own.","A retention policy says how long data is kept."]},
 {id:"b78",d:4,q:"A vulnerability scanner is given administrator credentials so it can check installed patches and settings on each host. What type of scan is this?",o:["Credentialed scan","Non-credentialed scan","Penetration test","Port scan"],a:0,x:"A credentialed scan logs in to each system, so it finds missing patches and misconfigurations that an outside view would miss.",w:["","A non-credentialed scan sees only what is visible from outside, without logging in.","A penetration test actively exploits flaws. It is not an automated patch check.","A port scan only finds open ports."]},
 {id:"b79",d:4,q:"A vulnerability has a CVSS base score of 9.8. How is this severity rated?",o:["Critical","High","Medium","Low"],a:0,x:"In CVSS v3, scores of 9.0 to 10.0 are Critical, 7.0 to 8.9 High, 4.0 to 6.9 Medium, and 0.1 to 3.9 Low.",w:["","High is 7.0 to 8.9.","Medium is 4.0 to 6.9.","Low is 0.1 to 3.9."]},
 {id:"b80",d:4,q:"After a patch is applied to fix a reported vulnerability, what should the analyst do NEXT to confirm the fix?",o:["Rescan the system","Close the ticket","Update the risk register to Accepted","Run a tabletop exercise"],a:0,x:"Rescanning confirms the vulnerability is actually gone before the ticket is closed.",w:["","Closing the ticket before confirming the fix may leave the flaw open.","The risk was remediated, not accepted.","A tabletop exercise practices incident response. It does not verify a patch."]},
 {id:"b81",d:4,q:"A legacy system cannot be patched, and management formally documents its approval to leave it as is with extra controls until it is replaced. What is this called?",o:["An exception","A false positive","Risk transference","Remediation"],a:0,x:"A documented, approved decision not to fix a vulnerability for now is an exception (or exemption). It is a form of accepting the risk.",w:["","A false positive is a reported flaw that does not exist. This flaw is real.","Transference shifts the cost to someone else, such as an insurer.","Remediation fixes the flaw. Here it stays unfixed."]},
 {id:"b82",d:4,q:"An analyst wants to see which internal hosts sent the most data to the internet yesterday, without storing packet contents. Which data source is BEST?",o:["NetFlow","Full packet capture","Application logs","Vulnerability scan output"],a:0,x:"NetFlow records who talked to whom, when, and how much, without the contents. A full packet capture would also work but stores far more data than needed.",w:["","A full packet capture works but stores all the contents, which the analyst wants to avoid.","Application logs record app events, not traffic volumes by host.","Scan output lists flaws, not traffic."]},
 {id:"b83",d:4,q:"A SIEM rule generates hundreds of harmless alerts each day, and analysts have started ignoring it. What should the team do?",o:["Tune the alert rule","Disable the SIEM","Delete the logs it uses","Lower the severity of every alert"],a:0,x:"Alert tuning adjusts the rule so it fires on real problems, cutting false positives without losing visibility.",w:["","Disabling the SIEM removes all detection.","Deleting the logs destroys evidence and breaks other rules.","Lowering every alert's severity hides real problems too."]},
 {id:"b84",d:4,q:"Which email security control publishes a DNS record listing the mail servers allowed to send for a domain?",o:["SPF","DKIM","DMARC","S/MIME"],a:0,x:"SPF (Sender Policy Framework) lists allowed sending servers. DKIM signs messages, and DMARC sets the policy for messages that fail SPF or DKIM.",w:["","DKIM signs each message. It does not list allowed servers.","DMARC sets the policy for messages that fail SPF or DKIM.","S/MIME encrypts and signs individual messages."]},
 {id:"b85",d:4,q:"A company wants receiving mail servers to reject messages that fail authentication checks for its domain and to send it reports. Which control should it publish?",o:["DMARC","SPF","DKIM","An email gateway"],a:0,x:"DMARC tells receivers what to do with mail that fails SPF or DKIM, such as reject or quarantine it, and asks them to send reports.",w:["","SPF lists allowed senders, but it does not tell receivers what to do on failure or ask them for reports.","DKIM signs messages. It does not set a policy.","An email gateway filters your own mail. It does not instruct other companies' servers."]},
 {id:"b86",d:4,q:"An alert fires because an accountant who never accesses engineering files suddenly downloads thousands of them at night. Which tool MOST likely raised the alert?",o:["User behavior analytics","A web filter","A WAF","An email gateway"],a:0,x:"User behavior analytics learns each user's normal activity and alerts on unusual behavior.",w:["","A web filter blocks websites.","A WAF protects web applications from attacks.","An email gateway filters mail."]},
 {id:"b87",d:4,q:"An administrator wants a screen-lock timeout applied to every Windows computer in the domain from one place. What should the administrator use?",o:["Group Policy","SELinux","A host-based IPS","A DLP policy"],a:0,x:"Group Policy pushes settings from Active Directory to domain computers.",w:["","SELinux enforces access control on Linux.","A HIPS blocks suspicious activity. It does not push settings.","DLP stops data leaks."]},
 {id:"b88",d:4,q:"Which of the following blocks users from reaching known phishing domains by refusing to resolve the names?",o:["DNS filtering","Port security","802.1X","A load balancer"],a:0,x:"DNS filtering checks lookups against lists of malicious domains and blocks them before a connection is made.",w:["","Port security limits which devices can use a switch port.","802.1X authenticates devices on the network.","A load balancer spreads traffic."]},
 {id:"b89",d:4,q:"Which authentication factor is a fingerprint?",o:["Something you are","Something you know","Something you have","Somewhere you are"],a:0,x:"Biometrics, such as fingerprints and face scans, are something you are.",w:["","Something you know is a password or PIN.","Something you have is a token or phone.","Somewhere you are is location."]},
 {id:"b90",d:4,q:"A user signs in with a password and a PIN. Why is this NOT multifactor authentication?",o:["Both are something you know","A PIN is a biometric","Passwords are not authentication factors","MFA requires a hardware token"],a:0,x:"MFA needs factors of different types. A password and a PIN are both knowledge factors, so this is single-factor authentication.",w:["","A PIN is a number you remember, so it is knowledge, not a biometric.","Passwords are a factor: something you know.","MFA needs two different factor types. A hardware token is one option, not a requirement."]},
 {id:"b91",d:4,q:"A partner company's employees access a shared portal by signing in with their own company's credentials. What is this arrangement?",o:["Federation","Single sign-on within one company","Attestation","Role-based access control"],a:0,x:"Federation is trust between organizations, so users sign in with their home identity provider's account. SAML and OpenID Connect are common federation standards.",w:["","SSO within one company uses that company's own identity provider only.","Attestation is reviewing and confirming access.","RBAC grants access by role inside one organization."]},
 {id:"b92",d:4,q:"A calendar app is allowed to read a user's contacts from another service without ever seeing the user's password. Which standard makes this possible?",o:["OAuth","LDAP","RADIUS","Kerberos"],a:0,x:"OAuth grants an app limited access to resources on the user's behalf, using tokens instead of the password.",w:["","LDAP queries directories.","RADIUS authenticates network access.","Kerberos authenticates users inside a Windows domain. It does not grant third-party apps access."]},
 {id:"b93",d:4,q:"Access to a payroll system is allowed only for Finance department staff, on company devices, during business hours. Which access control model is this?",o:["Attribute-based access control","Discretionary access control","Mandatory access control","Role-based access control"],a:0,x:"ABAC makes decisions from several attributes, such as department, device, and time. RBAC would decide only by role.",w:["","With DAC, the owner decides who gets access.","MAC uses labels and clearances.","RBAC would decide by role only, without device and time."]},
 {id:"b94",d:4,q:"A user who creates a file decides which coworkers may read it. Which access control model is this?",o:["Discretionary access control","Mandatory access control","Rule-based access control","Attribute-based access control"],a:0,x:"In DAC, the owner of a resource controls who can access it.",w:["","MAC uses labels the owner cannot change.","Rule-based access applies admin rules to everyone.","ABAC decides from several attributes, not the owner's choice."]},
 {id:"b95",d:4,q:"An administrator receives domain admin rights for one hour to complete a change, after which they are removed automatically. What is this?",o:["Just-in-time permissions","Least privilege","Separation of duties","Password vaulting"],a:0,x:"Just-in-time access grants elevated rights only when needed and only for a limited time. It supports least privilege.",w:["","Least privilege is the goal. Just-in-time is the specific way it is done here.","Separation of duties splits tasks between people.","Password vaulting stores admin passwords. It does not grant timed rights."]},
 {id:"b96",d:4,q:"Which tool controls, monitors, and records the use of administrator accounts, including checking out their passwords?",o:["Privileged access management (PAM)","Data loss prevention (DLP)","Mobile device management (MDM)","A SIEM"],a:0,x:"PAM manages privileged accounts: it vaults their passwords, grants access on request, and records admin sessions.",w:["","DLP stops data leaks.","MDM manages mobile devices.","A SIEM collects logs. It does not vault passwords or control admin sessions."]},
 {id:"b97",d:4,q:"When HR marks an employee as terminated, all of the employee's accounts are disabled within minutes without manual work. What is this?",o:["Automated deprovisioning","Attestation","Identity proofing","Federation"],a:0,x:"Automating account removal from HR records closes access quickly and reliably.",w:["","Attestation is managers reviewing and confirming access.","Identity proofing verifies who someone is before creating an account.","Federation is trust between organizations for sign-in."]},
 {id:"b98",d:4,q:"Which is a risk of relying heavily on automation and orchestration?",o:["A single point of failure if the orchestration platform goes down","Slower response to common alerts","Fewer standard configurations","Less consistent baselines"],a:0,x:"If every automated process depends on one platform, its failure stops them all. Faster response and consistent baselines are benefits of automation.",w:["","Automation speeds up response. It does not slow it down.","Automation creates more standard configurations, not fewer.","Automation makes baselines more consistent, not less."]},
 {id:"b99",d:4,q:"During an incident, an analyst confirms that an alert is real and determines that three servers are affected. Which phase of incident response is this?",o:["Analysis","Detection","Containment","Preparation"],a:0,x:"Analysis confirms the incident and works out its scope. Detection is the first notice of a possible incident.",w:["","Detection is the first notice that something may be wrong. Confirming it and finding the scope is analysis.","Containment stops the spread. Nothing has been contained yet.","Preparation happens before any incident."]},
 {id:"b100",d:4,q:"An investigator must collect evidence from a running server. Which should be collected FIRST?",o:["Contents of RAM","Hard drive image","Backup tapes","Archived logs"],a:0,x:"By the order of volatility, the most short-lived evidence comes first. RAM is lost when the power goes off, so it is collected before the disk.",w:["","The disk keeps its data after power-off, so it comes after RAM.","Backup tapes last for years. They are among the last things to collect.","Archived logs are long-lasting, so they are collected later."]},
 {id:"b101",d:4,q:"Before analyzing a seized hard drive, an investigator connects it through a device that prevents any writes. What is this device?",o:["Write blocker","Faraday bag","Hardware security module","Packet sniffer"],a:0,x:"A write blocker lets investigators read a drive without changing it, which preserves the evidence.",w:["","A Faraday bag blocks wireless signals to a seized phone.","An HSM stores cryptographic keys.","A packet sniffer captures network traffic."]},
 {id:"b102",d:4,q:"Lawyers instruct IT not to delete any email belonging to employees involved in a lawsuit. What is this instruction?",o:["Legal hold","Chain of custody","E-discovery","Data retention"],a:0,x:"A legal hold suspends normal deletion so data needed in litigation is preserved.",w:["","Chain of custody tracks who handled evidence.","E-discovery is finding and producing the records, which a legal hold preserves first.","Retention is the normal schedule for keeping data. A legal hold overrides it."]},
 {id:"b103",d:4,q:"After a breach, the team determines that an unpatched VPN appliance let the attacker in. Which activity is this?",o:["Root cause analysis","Threat hunting","Containment","Lessons learned"],a:0,x:"Root cause analysis finds the underlying reason an incident happened, so it can be fixed for good.",w:["","Threat hunting searches for threats that have not raised an alert.","Containment stops the spread. It does not find the cause.","Lessons learned reviews the response afterward. Finding the underlying cause is root cause analysis."]},
 {id:"b104",d:4,q:"To find failed login attempts on a Windows server, which data source should an analyst check?",o:["OS security logs","Firewall logs","NetFlow records","Vulnerability scan output"],a:0,x:"The Windows Security event log records logon successes and failures.",w:["","Firewall logs show allowed and blocked connections, not Windows logons.","NetFlow shows traffic volumes, not logon events.","Scan output lists vulnerabilities."]},
 {id:"b105",d:4,q:"An analyst examines an email's headers to trace the mail servers it passed through. What type of data is the analyst using?",o:["Metadata","Packet capture","Endpoint logs","Application logs"],a:0,x:"Email headers are metadata: data about the message, such as sender, timestamps, and the servers it passed through.",w:["","A packet capture is the full traffic, not saved email headers.","Endpoint logs come from a device's security agent.","Application logs record an app's events and errors."]},
 {id:"b106",d:4,q:"An analyst searches logs for signs of a known attacker technique even though no alert has fired. What is this activity?",o:["Threat hunting","Incident containment","Vulnerability scanning","Penetration testing"],a:0,x:"Threat hunting proactively looks for threats that have not triggered an alert.",w:["","Containment acts on a confirmed incident.","Vulnerability scanning looks for flaws, not attacker activity.","A penetration test attacks systems with permission."]},
 {id:"b107",d:5,q:"Which document is mandatory and sets specific technical requirements, such as a minimum password length of 14 characters?",o:["Standard","Guideline","Procedure","Policy"],a:0,x:"A standard sets mandatory, specific requirements. A policy states high-level goals, a procedure gives step-by-step instructions, and a guideline offers optional advice.",w:["","Guidelines are optional advice.","Procedures give step-by-step instructions.","A policy states high-level goals. A standard sets the specific requirement."]},
 {id:"b108",d:5,q:"Under GDPR, which role decides why and how personal data is processed?",o:["Data controller","Data processor","Data custodian","Data subject"],a:0,x:"The controller determines the purpose and means of processing. A processor handles data on the controller's behalf, and the data subject is the person the data is about.",w:["","A processor handles data on the controller's behalf.","A custodian looks after data day to day. That role is not a GDPR term for deciding purpose.","The data subject is the person the data is about."]},
 {id:"b109",d:5,q:"A database administrator applies access rules and runs nightly backups for data that the VP of Sales is accountable for. What is the administrator's role?",o:["Data custodian","Data owner","Data controller","Data subject"],a:0,x:"The custodian handles data day to day under the owner's direction. The owner is the senior person accountable for the data.",w:["","The owner is the VP, who is accountable for the data.","The controller is a GDPR role for the organization that decides why data is processed.","The data subject is the person the data is about."]},
 {id:"b110",d:5,q:"An asset is worth $50,000 and would lose 20% of its value in one incident. The incident is expected twice a year. What is the ALE?",o:["$20,000","$10,000","$100,000","$5,000"],a:0,x:"SLE = $50,000 × 0.20 = $10,000. ALE = SLE × ARO = $10,000 × 2 = $20,000.",w:["","$10,000 is the SLE for one incident. It still needs multiplying by an ARO of 2.","$100,000 multiplies the asset value by 2 without the 20% exposure factor.","$5,000 divides instead of multiplying."]},
 {id:"b111",d:5,q:"A company decides to stop offering a high-risk online service instead of trying to secure it. Which risk response is this?",o:["Avoid","Accept","Transfer","Mitigate"],a:0,x:"Avoiding a risk means stopping the activity that creates it.",w:["","Accepting means keeping the service and living with the risk.","Transferring shifts the cost to someone else, such as an insurer.","Mitigating means adding controls and keeping the service."]},
 {id:"b112",d:5,q:"A document lists every identified risk along with its owner, likelihood, impact, and planned response. What is it?",o:["Risk register","Business impact analysis","Asset inventory","Statement of work"],a:0,x:"A risk register tracks identified risks and how each will be handled.",w:["","A BIA studies the impact of outages on business functions.","An asset inventory lists assets, not risks.","A statement of work defines project deliverables."]},
 {id:"b113",d:5,q:"A team rates each risk as high, medium, or low without assigning dollar values. Which type of risk analysis is this?",o:["Qualitative","Quantitative","Annualized","Inherent"],a:0,x:"Qualitative analysis uses categories or ratings. Quantitative analysis uses numbers, such as SLE and ALE in dollars.",w:["","Quantitative analysis uses dollar values and numbers.","Annualized describes a number such as ALE, not a type of analysis.","Inherent risk is the risk before controls, not a method of rating."]},
 {id:"b114",d:5,q:"Which agreement sets the general terms for all future projects between a company and a consultancy, with each project then described separately?",o:["Master service agreement (MSA)","Statement of work (SOW)","Service-level agreement (SLA)","Non-disclosure agreement (NDA)"],a:0,x:"An MSA sets the overall terms. Each project is then defined in its own statement of work.",w:["","An SOW defines one specific project.","An SLA sets service levels.","An NDA keeps information confidential."]},
 {id:"b115",d:5,q:"Which document defines the specific deliverables, timeline, and tasks for one project with a vendor?",o:["Statement of work (SOW)","Master service agreement (MSA)","Memorandum of understanding (MOU)","Business partners agreement (BPA)"],a:0,x:"An SOW lists exactly what will be delivered and when for one engagement.",w:["","An MSA sets the general terms for all projects.","An MOU states shared intent.","A BPA covers partnership terms like profit sharing."]},
 {id:"b116",d:5,q:"Two government agencies sign a document stating their shared intention to exchange threat data. It contains no binding terms. What is it?",o:["Memorandum of understanding (MOU)","Master service agreement (MSA)","Service-level agreement (SLA)","Statement of work (SOW)"],a:0,x:"An MOU expresses shared intent and is usually not legally binding.",w:["","An MSA is a binding contract with general terms.","An SLA sets service levels.","An SOW defines project work."]},
 {id:"b117",d:5,q:"Before choosing a new cloud vendor, a company reviews the vendor's security certifications, financial health, and history of breaches. What is this process?",o:["Vendor due diligence","Penetration testing","Attestation","Change management"],a:0,x:"Due diligence is investigating a vendor before signing, to understand the risks it brings.",w:["","A penetration test attacks systems. It does not review finances or history.","Attestation confirms access or compliance.","Change management controls changes to systems."]},
 {id:"b118",d:5,q:"Which regulation gives people in the European Union the right to have their personal data erased?",o:["GDPR","PCI DSS","SOX","HIPAA"],a:0,x:"GDPR includes the right to erasure, often called the right to be forgotten. PCI DSS covers payment cards, SOX covers financial reporting, and HIPAA covers U.S. health data.",w:["","PCI DSS protects payment card data.","SOX covers financial reporting by public companies.","HIPAA covers U.S. health information."]},
 {id:"b119",d:5,q:"A store that stores and processes credit card payments must comply with which standard?",o:["PCI DSS","GDPR","ISO 9001","NIST SP 800-88"],a:0,x:"PCI DSS is the security standard for any organization that stores, processes, or sends payment card data.",w:["","GDPR covers personal data of people in the EU.","ISO 9001 is about quality management.","NIST SP 800-88 gives guidance on media sanitization."]},
 {id:"b120",d:5,q:"Penetration testers are given network diagrams, source code, and test accounts before they start. What type of test is this?",o:["Known environment","Unknown environment","Partially known environment","Passive reconnaissance"],a:0,x:"A known environment test (formerly white box) gives testers full information. An unknown environment test gives them none.",w:["","An unknown environment test gives testers nothing in advance.","A partially known test gives some information, not full access to code and accounts.","Passive reconnaissance gathers public information. It is not a type of test environment."]},
 {id:"b121",d:5,q:"A tester studies a company's website, job postings, and public DNS records without sending any traffic to its network. What is this?",o:["Passive reconnaissance","Active reconnaissance","Vulnerability scanning","Social engineering"],a:0,x:"Passive reconnaissance gathers information without directly interacting with the target's systems.",w:["","Active reconnaissance touches the target, for example by port scanning.","Vulnerability scanning sends probes to the target.","Social engineering means interacting with people."]},
 {id:"b122",d:5,q:"Which document sets the limits of a penetration test, such as which systems may be tested and during which hours?",o:["Rules of engagement","Non-disclosure agreement","Service-level agreement","Acceptable use policy"],a:0,x:"Rules of engagement define the scope, timing, and allowed methods of a test.",w:["","An NDA keeps findings confidential. It does not set the test's limits.","An SLA sets service levels.","An AUP covers how employees use company systems."]},
 {id:"b123",d:5,q:"The security team sends simulated phishing emails to staff and gives extra training to anyone who clicks. What is this?",o:["A phishing campaign","A penetration test","A tabletop exercise","An external audit"],a:0,x:"A phishing campaign tests and trains staff with realistic but harmless phishing emails.",w:["","A penetration test attacks systems, not staff awareness.","A tabletop exercise is a discussion about responding to incidents.","An external audit is an independent review of controls."]},
 {id:"b124",d:5,q:"The order system must be restored within four hours of an outage to avoid unacceptable losses. Which metric is this?",o:["Recovery time objective (RTO)","Recovery point objective (RPO)","Mean time between failures (MTBF)","Annualized rate of occurrence (ARO)"],a:0,x:"RTO is the maximum acceptable downtime. RPO is the maximum acceptable data loss.",w:["","RPO is how much data can be lost, not how long the system can be down.","MTBF is the average time between failures.","ARO is how often an event is expected each year."]},
 {id:"b125",d:5,q:"An independent firm reviews a company's security controls and reports its findings to the company's regulator. What type of assessment is this?",o:["External audit","Internal audit","Self-assessment","Vulnerability scan"],a:0,x:"An external audit is carried out by an independent outside party. An internal audit uses the company's own staff.",w:["","An internal audit is done by the company's own staff.","A self-assessment is done by the company itself.","A vulnerability scan is an automated technical check, not a review of controls."]},
 {id:"b126",d:5,q:"Which of the following is a consequence of non-compliance with a regulation?",o:["Fines and sanctions","Lower insurance premiums","Faster audits","Automatic certification"],a:0,x:"Regulators can impose fines and sanctions. Other consequences include reputational damage, loss of license, and contract impacts.",w:["","Non-compliance raises insurance costs, not lowers them.","Audits become more frequent and stricter, not faster.","Certification is lost, not granted."]},
 {id:"b127",d:5,q:"Which business continuity activity identifies the most critical business functions and what an outage of each would cost?",o:["Business impact analysis","Risk transference","Penetration testing","Change management"],a:0,x:"A business impact analysis identifies critical functions and the impact of losing them. It produces values such as RTO and RPO.",w:["","Risk transference shifts cost to someone else.","Penetration testing looks for exploitable flaws.","Change management controls changes."]}
];

/* Term modules. Each module is a set of terms asked several ways (name it, define it, a scenario, and,
   where a term has one, the best defense). A term is mastered after `need` different kinds of question
   about it are answered correctly. They cover every term in the SY0-701 objectives that suits this format. */
const TERMSETS = {
 controls:{need:2,typed:true,groups:[["cat","Control categories","Categories"],["type","Control types","Types"],["cia","CIA, AAA & core concepts","Concepts"],["zt","Zero trust","Zero trust"],["phys","Physical security","Physical"],["decep","Deception & disruption","Deception"],["change","Change management","Change"]],items:[
  {id:"c1",g:"cat",d:1,t:"Technical control",def:"A control carried out by a system, such as a firewall rule, encryption, or antivirus",sc:"A firewall rule that blocks inbound traffic on unused ports belongs to which control category?"},
  {id:"c2",g:"cat",d:1,t:"Managerial control",def:"A control that sets direction and oversight, such as a security policy or a risk assessment",sc:"Leadership approves a written information security policy. Which control category is the policy?"},
  {id:"c3",g:"cat",d:1,t:"Operational control",def:"A control carried out by people day to day, such as security guards or awareness training",sc:"Staff attend monthly security awareness sessions run by the security team. Which control category is this?"},
  {id:"c4",g:"cat",d:1,t:"Physical control",def:"A control that restricts physical access, such as fences, door locks, or bollards",sc:"Concrete bollards are placed in front of a building entrance. Which control category are they?"},
  {id:"c5",g:"type",d:1,t:"Preventive control",def:"Stops an incident from happening in the first place",sc:"A door stays locked until an authorized badge is scanned. Which control type is this?"},
  {id:"c6",g:"type",d:1,t:"Deterrent control",def:"Discourages an attacker from trying, without physically stopping them",sc:"A sign warns that the premises are under video surveillance. Which control type is the sign?"},
  {id:"c7",g:"type",d:1,t:"Detective control",def:"Identifies and records an incident while or after it happens",sc:"An analyst reviews login logs each morning to find unauthorized access. Which control type is this?"},
  {id:"c8",g:"type",d:1,t:"Corrective control",def:"Fixes damage or restores normal operation after an incident",sc:"After a ransomware attack, a server is restored from backup. Which control type is the restore?"},
  {id:"c9",g:"type",d:1,t:"Compensating control",def:"An alternative control used when the primary control cannot be put in place",sc:"A legacy system cannot be patched, so it is moved onto an isolated network segment. Which control type is the isolation?",alt:["compensation"]},
  {id:"c14",g:"type",d:1,t:"Directive control",def:"Tells people what they should or should not do, such as a policy or an instruction",sc:"An instruction in the employee handbook tells staff to store sensitive files only on the encrypted share. Which control type is this?"},
  {id:"c15",g:"cia",d:1,t:"Confidentiality",def:"Keeping information secret from anyone who is not authorized to see it",sc:"Customer records are encrypted so that only authorized staff can read them. Which part of the CIA triad does this protect?"},
  {id:"c16",g:"cia",d:1,t:"Integrity",def:"Making sure data is not changed without authorization, and that any change can be detected",sc:"A file's hash is checked after download to confirm that nobody altered it. Which part of the CIA triad does this protect?"},
  {id:"c17",g:"cia",d:1,t:"Availability",def:"Making sure systems and data can be reached by authorized users when they need them",sc:"A company adds redundant power supplies and a second internet link so its website stays online. Which part of the CIA triad does this support?"},
  {id:"c18",g:"cia",d:1,t:"Authentication",def:"Proving that a user or device is who or what it claims to be",sc:"A user enters a password and a code from a phone app before the system lets her in. Which part of AAA is this?",alt:["authenticating"]},
  {id:"c19",g:"cia",d:1,t:"Authorization",def:"Deciding what an authenticated user is allowed to access or do",sc:"After logging in, an employee can open HR files but not finance files because of her group membership. Which part of AAA decides this?"},
  {id:"c20",g:"cia",d:1,t:"Accounting",def:"Recording what users do, such as when they logged in, what they accessed, and for how long",sc:"A VPN server logs each user's connection time and how much data they transferred. Which part of AAA is this?",alt:["auditing"]},
  {id:"c10",g:"cia",d:1,t:"Non-repudiation",def:"Proof that a specific person performed an action, so they cannot later deny it",sc:"A signed contract carries the sender's digital signature, so the sender cannot claim they never sent it. Which concept is this?",alt:["nonrepudiation"]},
  {id:"c12",g:"cia",d:1,t:"Gap analysis",def:"Comparing the current security posture with a target standard to find what is missing",sc:"A company compares its current controls with a security framework to list what still needs to be done. What is this called?",alt:["gap assessment"]},
  {id:"c11",g:"zt",d:1,t:"Zero trust",def:"No user or device is trusted by default; every access request is verified",sc:"Every request to an internal app is authenticated and authorized, even from inside the office network. Which model is this?",alt:["zero trust architecture", "zta", "zero trust model"]},
  {id:"c21",g:"zt",d:1,t:"Control plane",def:"The zero trust layer that decides whether access is allowed; it holds the policy engine and policy administrator",sc:"In a zero trust design, which plane contains the policy engine and decides whether a request is allowed?"},
  {id:"c22",g:"zt",d:1,t:"Data plane",def:"The zero trust layer where traffic actually flows, through a policy enforcement point that allows or blocks it",sc:"In a zero trust design, which plane carries the user's traffic to the resource once access is granted?"},
  {id:"c23",g:"zt",d:1,t:"Policy engine",def:"The zero trust component that checks each request against policy and decides to grant or deny it",sc:"Which zero trust component makes the actual decision to grant or deny an access request?",alt:["pe"]},
  {id:"c24",g:"zt",d:1,t:"Policy administrator",def:"The zero trust component that carries out the policy engine's decision by setting up or closing the session, such as by issuing a token",sc:"Which zero trust component takes the engine's grant decision and tells the enforcement point to open the session?",alt:["pa"]},
  {id:"c25",g:"zt",d:1,t:"Policy enforcement point",def:"The gatekeeper in the data plane that allows, monitors, and ends connections between a user and a resource",sc:"Which zero trust component sits in the path of the traffic and lets a connection through or blocks it?",alt:["pep"]},
  {id:"c26",g:"zt",d:1,t:"Adaptive identity",def:"Checking identity using context such as location, device, and behavior, and asking for more proof when the risk is higher",sc:"A login from a new country triggers an extra verification step that a login from the office does not. Which zero trust concept is this?",alt:["adaptive authentication"]},
  {id:"c27",g:"zt",d:1,t:"Threat scope reduction",def:"Limiting the number of entry points and the amount of access, so an attacker who gets in can reach less",sc:"A zero trust project removes unneeded network paths and gives each user only the access a task requires, so a compromise reaches less. Which zero trust goal is this?"},
  {id:"c28",g:"zt",d:1,t:"Implicit trust zone",def:"A network area where devices are trusted simply because of where they are, which zero trust removes",sc:"In a traditional network, any device plugged into the internal LAN is trusted automatically. What does zero trust call such an area?",alt:["implicit trust", "implicit trust zones"]},
  {id:"c29",g:"phys",d:1,t:"Bollards",def:"Short, sturdy posts that stop vehicles from reaching a building or entrance",sc:"Steel posts are installed outside a lobby's glass front so a car cannot drive through it. What are they?",alt:["bollard"]},
  {id:"c30",g:"phys",d:1,t:"Access control vestibule",def:"A small space between two doors where only one door can open at a time, which stops tailgating",sc:"Visitors enter a small room where the outer door must close before the inner door will open. What is this?",alt:["vestibule", "mantrap"]},
  {id:"c31",g:"phys",d:1,t:"Fencing",def:"A barrier that marks a boundary and keeps people out; tall fencing also discourages climbing",sc:"An 8-foot barrier topped with barbed wire surrounds a data center's grounds. What physical control is this?",alt:["fence"]},
  {id:"c32",g:"phys",d:1,t:"Video surveillance",def:"Cameras that record and monitor an area, which both deter and detect",sc:"Cameras with motion detection record the loading dock around the clock. What physical control is this?",alt:["cctv", "cameras", "camera", "video cameras", "surveillance cameras"]},
  {id:"c33",g:"phys",d:1,t:"Security guard",def:"A person who checks identities, watches entrances, and responds to events",sc:"A person at the front desk checks every visitor's ID and escorts them inside. What physical control is this?",alt:["guard", "security guards", "guards"]},
  {id:"c34",g:"phys",d:1,t:"Access badge",def:"An ID card, often with an RFID or smart chip, that opens doors and identifies the wearer",sc:"Employees tap a card on a reader to unlock each office door. What are they using?",alt:["badge", "access card", "id badge", "badge reader", "smart card", "rfid badge", "key card"]},
  {id:"c35",g:"phys",d:1,t:"Lighting",def:"Bright lights around a site that discourage intruders and help cameras record",sc:"Floodlights are added to a dark parking lot so guards and cameras can see anyone there at night. What physical control is this?",alt:["lights", "floodlights", "security lighting"]},
  {id:"c36",g:"phys",d:1,t:"Infrared sensor",def:"A sensor that detects body heat moving through an area",sc:"A motion sensor in a closed office detects the heat of a person moving after hours. Which sensor type is this?",alt:["infrared", "ir sensor", "pir sensor"]},
  {id:"c37",g:"phys",d:1,t:"Pressure sensor",def:"A sensor that detects weight or force, such as someone stepping on a mat",sc:"A mat in front of the vault door triggers an alarm when someone stands on it. Which sensor type is this?",alt:["pressure"]},
  {id:"c38",g:"phys",d:1,t:"Microwave sensor",def:"A sensor that sends out microwave signals and detects movement from changes in their reflection; it covers large areas",sc:"A sensor fills a warehouse with radio signals and raises an alarm when their reflection changes. Which sensor type is this?",alt:["microwave"]},
  {id:"c39",g:"phys",d:1,t:"Ultrasonic sensor",def:"A sensor that sends out high-frequency sound and detects movement from changes in the echo",sc:"A sensor emits sound above human hearing and raises an alarm when its echo changes. Which sensor type is this?",alt:["ultrasonic"]},
  {id:"c13",g:"decep",d:1,t:"Honeypot",def:"A decoy system that lures attackers so their activity can be observed",sc:"A fake, unprotected-looking server is placed on the network to attract and study attackers. What is it?",alt:["honey pot"]},
  {id:"c40",g:"decep",d:1,t:"Honeynet",def:"A network of decoy systems built to attract and study attackers",sc:"Researchers build a whole fake network of servers and workstations to watch how attackers move between them. What is this?",alt:["honey net"]},
  {id:"c41",g:"decep",d:1,t:"Honeyfile",def:"A decoy file with a tempting name that raises an alert when someone opens it",sc:"A file named passwords.xlsx with no real data sits on a file share and raises an alert whenever it is opened. What is it?",alt:["honey file"]},
  {id:"c42",g:"decep",d:1,t:"Honeytoken",def:"Fake data, such as a fake API key or account, that raises an alert when someone tries to use it",sc:"A fake cloud access key is planted in a code repository, and any attempt to use it triggers an alert. What is it?",alt:["honey token", "canary token"]},
  {id:"c43",g:"decep",d:1,t:"DNS sinkhole",def:"A DNS server that answers requests for malicious domains with a safe address, cutting malware off from its controller",sc:"Infected hosts that look up a known command-and-control domain are given an internal address that goes nowhere. What is this?",alt:["sinkhole"]},
  {id:"c44",g:"change",d:1,t:"Approval process",def:"The formal review and sign-off a change needs before it can be made",sc:"A firewall rule change waits until the change advisory board reviews and signs off on it. Which part of change management is this?",alt:["approval", "change approval"]},
  {id:"c45",g:"change",d:1,t:"Change owner",def:"The person or team responsible for carrying out a change and answering for its results",sc:"The network team lead is named as responsible for a router upgrade and must report how it went. What change management role is this?",alt:["owner", "ownership"]},
  {id:"c46",g:"change",d:1,t:"Stakeholders",def:"The people and groups a change affects, who should be consulted or kept informed",sc:"Before a payroll system upgrade, IT meets with HR and finance because the change will affect their work. What are HR and finance in this change?",alt:["stakeholder"]},
  {id:"c47",g:"change",d:1,t:"Impact analysis",def:"Working out what a change could affect, and the risk of making it or not making it",sc:"Before patching a database server, the team lists every application that depends on it and what could break. What is this?",alt:["impact assessment"]},
  {id:"c48",g:"change",d:1,t:"Backout plan",def:"A plan to undo a change and return to the previous state if it fails",sc:"A change request explains exactly how to reinstall the old firmware if the upgrade causes problems. What is this part of the request?",alt:["backout", "back out plan", "rollback plan"]},
  {id:"c49",g:"change",d:1,t:"Maintenance window",def:"An agreed time, usually outside business hours, when changes can be made with the least impact",sc:"Changes to the online store's servers may only be made between 1 a.m. and 4 a.m. on Sundays. What is this period called?",alt:["change window"]},
  {id:"c50",g:"change",d:1,t:"Standard operating procedure (SOP)",def:"Written step-by-step instructions for doing a routine task the same way every time",sc:"Technicians follow a documented step-by-step guide every time they set up a new server. What is the guide?"},
  {id:"c51",g:"change",d:1,t:"Allow list",def:"Only the items on an approved list may run or connect; everything else is blocked",sc:"Only applications on an approved list can run on the kiosks; everything else is blocked. What is this?",alt:["allowlist", "whitelist", "application allow list"]},
  {id:"c52",g:"change",d:1,t:"Deny list",def:"The items on the list are blocked; everything else is allowed",sc:"A firewall blocks a list of known malicious IP addresses and allows all other traffic. What is this?",alt:["denylist", "blacklist", "block list", "blocklist"]},
  {id:"c53",g:"change",d:1,t:"Dependencies",def:"Other systems or services that a component relies on, which a change to it can break",sc:"Restarting the authentication server will also interrupt the VPN, because the VPN relies on it. What technical consideration does this show?",alt:["dependency"]},
  {id:"c54",g:"change",d:1,t:"Version control",def:"Tracking every change to code or configuration files so any earlier version can be restored",sc:"Every edit to the router configurations is saved with who made it, and any older version can be restored. What is this?",alt:["versioning"]},
  {id:"c55",g:"change",d:1,t:"Legacy application",def:"Old software still in use that may be unsupported and poorly understood, so changes to it are risky",sc:"A 20-year-old billing program has no vendor support, and nobody knows how it will react to an operating system update. What is it?",alt:["legacy app", "legacy software", "legacy system"]}
 ]},
 crypto:{need:2,typed:true,labs:["keyflow","sort"],groups:[["enc","Encryption & hashing","Encryption"],["keys","Keys & key storage","Keys"],["pki","Certificates & PKI","PKI"],["obf","Obfuscation & ledgers","Obfuscation"],["level","Encryption levels","Levels"]],items:[
  {id:"k1",g:"enc",d:1,t:"Symmetric encryption",def:"One shared key both encrypts and decrypts the data",sc:"A backup file is encrypted with AES using one secret key that is also used to decrypt it. What kind of encryption is this?",avoid:["k2"],alt:["symmetric", "symmetric key", "secret key encryption"]},
  {id:"k2",g:"enc",d:1,t:"Asymmetric encryption",def:"A public and private key pair; data encrypted with one key can be decrypted only with the other",sc:"A sender encrypts a message with the recipient's public key so only the recipient's private key can decrypt it. What kind of encryption is this?",avoid:["k1"],alt:["asymmetric", "public key encryption", "public key cryptography"]},
  {id:"k3",g:"enc",d:1,t:"Hashing",def:"A one-way function that turns data into a fixed-length value used to check integrity",sc:"A technician compares a downloaded file's SHA-256 value with the value on the vendor's site. What technique is this?",alt:["hash", "hash function"]},
  {id:"k4",g:"enc",d:1,t:"Salting",def:"Adding random data to a password before hashing so identical passwords produce different hashes",sc:"Two users choose the same password, but their stored hashes are different. Which technique causes this?",avoid:["k5"]},
  {id:"k5",g:"enc",d:1,t:"Key stretching",def:"Running a hash many times to make each password guess slower for an attacker",sc:"A system uses PBKDF2 with many iterations so brute-forcing stolen hashes takes far longer. Which technique is this?",avoid:["k4"],alt:["key stretch"]},
  {id:"k6",g:"enc",d:1,t:"Digital signature",def:"A hash encrypted with the sender's private key, proving integrity, authenticity, and non-repudiation",sc:"A software publisher signs its installer so users can verify who made it and that it was not changed. What does the publisher use?",alt:["signature", "digital signatures"]},
  {id:"k14",g:"enc",d:1,t:"Key exchange",def:"Securely sharing or agreeing on encryption keys over an untrusted network, such as with Diffie-Hellman",sc:"Two systems use Diffie-Hellman to agree on a shared session key without ever sending the key itself. What is this process called?"},
  {id:"k15",g:"enc",d:1,t:"Key length",def:"The size of a key in bits; longer keys take far longer to brute-force",sc:"A company moves from 128-bit to 256-bit AES keys to make brute-force attacks impractical. Which property did it change?",alt:["key size"]},
  {id:"k16",g:"enc",d:1,t:"Transport encryption",def:"Encrypting data while it moves across a network, such as with TLS or IPsec",sc:"A web server uses TLS so that data between browsers and the server cannot be read on the way. What kind of encryption is this?",alt:["encryption in transit", "in transit encryption"]},
  {id:"k17",g:"enc",d:1,t:"Perfect forward secrecy",def:"Using a new key for every session, so one stolen key cannot decrypt past sessions",sc:"Even after a server's private key is stolen, recorded past TLS sessions cannot be decrypted because each used its own temporary key. What property is this?",alt:["pfs", "forward secrecy"]},
  {id:"k18",g:"keys",d:1,t:"Public key",def:"The half of a key pair that is shared openly, used to encrypt data for its owner or to check the owner's signatures",sc:"Ana wants anyone to be able to send her encrypted messages that only she can read. Which key does she share with everyone?",alt:["public"]},
  {id:"k19",g:"keys",d:1,t:"Private key",def:"The half of a key pair that only its owner keeps, used to decrypt data and to create digital signatures",sc:"A software publisher signs its installers with a key that must never leave its secure signing system. Which key is this?",alt:["private"]},
  {id:"k11",g:"keys",d:1,t:"Key escrow",def:"A trusted third party holds a copy of encryption keys so they can be recovered",sc:"A company stores copies of its encryption keys with a trusted third party in case they are lost. What is this called?",alt:["escrow"]},
  {id:"k12",g:"keys",d:1,t:"Trusted Platform Module (TPM)",def:"A chip on a device's motherboard that securely stores keys and supports secure boot and disk encryption",sc:"Full-disk encryption on a laptop stores its key in a chip built into the motherboard. What is the chip?",avoid:["k13"]},
  {id:"k13",g:"keys",d:1,t:"Hardware security module (HSM)",def:"A dedicated, tamper-resistant appliance that generates, stores, and manages keys for many systems",sc:"A bank uses a dedicated appliance to protect the signing keys for all of its servers. What is the appliance?",avoid:["k12"]},
  {id:"k20",g:"keys",d:1,t:"Key management system",def:"Software or a service that creates, stores, rotates, and retires keys through their whole life",sc:"A cloud service centrally creates, rotates, and expires the encryption keys for every database the company runs. What is it?",avoid:["k13"],alt:["kms"]},
  {id:"k21",g:"keys",d:1,t:"Secure enclave",def:"A protected area of a processor that keeps sensitive data, such as fingerprint data, isolated from the main operating system",sc:"A phone stores fingerprint data in an isolated part of its processor that even the operating system cannot read. What is this?"},
  {id:"k7",g:"pki",d:1,t:"Certificate authority (CA)",def:"A trusted entity that issues and signs digital certificates",sc:"Which entity signs a website's certificate so browsers will trust it?"},
  {id:"k8",g:"pki",d:1,t:"Certificate revocation list (CRL)",def:"A list a certificate authority publishes of certificates revoked before they expire",sc:"A browser downloads a list from the CA to check whether a certificate has been revoked. What is the list?",avoid:["k9"]},
  {id:"k9",g:"pki",d:1,t:"OCSP",def:"A protocol that checks the revocation status of a single certificate in real time",sc:"A browser asks the CA's responder whether one specific certificate is still valid. Which protocol is this?",avoid:["k8"],alt:["online certificate status protocol"]},
  {id:"k10",g:"pki",d:1,t:"Wildcard certificate",def:"One certificate that covers every subdomain at one level, such as *.example.com",sc:"A single certificate secures shop.example.com, mail.example.com, and www.example.com. What type of certificate is it?",alt:["wildcard"]},
  {id:"k22",g:"pki",d:1,t:"Self-signed certificate",def:"A certificate signed by its own creator instead of a trusted CA, so browsers do not trust it by default",sc:"An internal test server's certificate was signed by the server itself, and browsers show a warning. What type of certificate is it?",alt:["self signed"]},
  {id:"k23",g:"pki",d:1,t:"Third-party certificate",def:"A certificate signed by a public CA that browsers and operating systems already trust",sc:"A company gets its website certificate from a well-known public CA so that every browser trusts it. What type of certificate is this?",alt:["third party", "public ca certificate"]},
  {id:"k24",g:"pki",d:1,t:"Root of trust",def:"The trusted starting point, such as a root CA certificate, that all other trust is built on",sc:"A browser trusts a website because its certificate chains back to a CA certificate already stored in the browser. What is that stored certificate?",alt:["root ca", "root certificate", "trust anchor"]},
  {id:"k25",g:"pki",d:1,t:"Certificate signing request (CSR)",def:"A request containing a public key and identity details that is sent to a CA to get a certificate",sc:"An admin generates a key pair on a web server, then sends the CA a file holding the public key and the domain name. What is the file?"},
  {id:"k26",g:"pki",d:1,t:"Subject alternative name (SAN)",def:"A certificate field that lists the additional names a certificate covers",sc:"One certificate covers example.com, example.net, and shop.example.org because each name is listed in it. Which certificate field lists them?",avoid:["k10"]},
  {id:"k27",g:"obf",d:1,t:"Steganography",def:"Hiding data inside another file, such as an image, so nobody knows the data is there",sc:"An attacker hides stolen data inside the pixels of a vacation photo. What technique is this?"},
  {id:"k28",g:"obf",d:1,t:"Tokenization",def:"Replacing sensitive data with a random token that maps back to the original in a secured vault",sc:"A payment app stores a random stand-in value instead of the real card number, and only the processor can map it back. What is this?"},
  {id:"k29",g:"obf",d:1,t:"Data masking",def:"Hiding part of a value when it is shown, such as displaying only the last four digits",sc:"A call center screen shows Social Security numbers as ***-**-6789. What technique is this?",alt:["masking"]},
  {id:"k30",g:"obf",d:1,t:"Blockchain",def:"A distributed ledger of records linked by hashes, so past entries cannot be changed without detection",sc:"Transactions are recorded in blocks that each contain the hash of the block before, and many participants hold copies. What technology is this?",avoid:["k31"]},
  {id:"k31",g:"obf",d:1,t:"Open public ledger",def:"A shared record of blockchain transactions that anyone can view and verify",sc:"Anyone can download and verify the complete history of a cryptocurrency's transactions. What is this record called?",alt:["public ledger", "ledger"]},
  {id:"k32",g:"level",d:1,t:"Full-disk encryption (FDE)",def:"Encrypting an entire drive, including the operating system",sc:"A stolen laptop's whole drive, operating system included, cannot be read without the startup PIN. What is protecting it?",alt:["full disk encryption"]},
  {id:"k33",g:"level",d:1,t:"Partition encryption",def:"Encrypting one partition of a drive while the others stay unencrypted",sc:"Only the data partition of a server's disk is encrypted; the system partition is not. What level of encryption is this?"},
  {id:"k34",g:"level",d:1,t:"File encryption",def:"Encrypting individual files, such as with Windows EFS",sc:"A user encrypts one spreadsheet from its file properties, leaving the rest of the folder as it was. What level of encryption is this?"},
  {id:"k35",g:"level",d:1,t:"Database encryption",def:"Encrypting a whole database so all of its stored data is protected",sc:"A database administrator turns on transparent data encryption so every table is encrypted on disk. What level of encryption is this?"},
  {id:"k36",g:"level",d:1,t:"Record-level encryption",def:"Encrypting only specific records or fields in a database, such as the card number column",sc:"Only the credit card column in the orders table is encrypted; the other columns stay readable. What level of encryption is this?",alt:["record encryption", "column encryption", "field level encryption"]}
 ]},
 threats:{need:2,typed:true,labs:["profiler","map","phish"],groups:[["actor","Threat actors","Actors"],["motive","Motivations","Motives"],["social","Social engineering","Social"],["vector","Threat vectors & attack surfaces","Vectors"]],items:[
  {id:"t1",g:"actor",d:2,t:"Nation-state",def:"A government-backed group with large resources that often seeks espionage or disruption over long periods",sc:"A well-funded group backed by a foreign government stays hidden in a defense contractor's network for months. Which threat actor is this?",alt:["nation state", "apt", "advanced persistent threat"]},
  {id:"t2",g:"actor",d:2,t:"Unskilled attacker",def:"An attacker with little skill who relies on tools and exploits written by others",sc:"A teenager downloads a ready-made attack tool and runs it against a school website. Which threat actor is this?",alt:["script kiddie", "unskilled"]},
  {id:"t3",g:"actor",d:2,t:"Hacktivist",def:"An attacker motivated by a political or social cause",sc:"A group defaces a company's website to protest its environmental record. Which threat actor is this?"},
  {id:"t4",g:"actor",d:2,t:"Insider threat",def:"A current or former employee, contractor, or partner who misuses authorized access",sc:"An employee who was passed over for promotion copies customer data before resigning. Which threat actor is this?",alt:["insider"]},
  {id:"t5",g:"actor",d:2,t:"Organized crime",def:"A criminal group motivated mainly by financial gain, such as through ransomware",sc:"A professional criminal group runs ransomware campaigns to extort payments. Which threat actor is this?",alt:["organized criminals", "crime syndicate", "organized criminal"]},
  {id:"t6",g:"actor",d:2,t:"Shadow IT",def:"Hardware or software used without the IT department's knowledge or approval",sc:"A team stores project files in a personal cloud account that IT never approved. What is this called?"},
  {id:"t13",g:"motive",d:2,t:"Espionage",def:"Secretly gathering information, such as trade secrets or government plans",sc:"A foreign intelligence agency breaks into a defense contractor to copy weapons designs. What is the main motivation?"},
  {id:"t14",g:"motive",d:2,t:"Financial gain",def:"Attacking to make money, such as through ransom, fraud, or selling stolen data",sc:"A gang encrypts a hospital's files and demands $2 million in cryptocurrency. What is the main motivation?",avoid:["t16"],alt:["money", "financial"]},
  {id:"t15",g:"motive",d:2,t:"Revenge",def:"Attacking to get back at an organization or person for a wrong the attacker feels they suffered",sc:"An administrator who was just fired deletes the company's backups out of anger. What is the motivation?"},
  {id:"t16",g:"motive",d:2,t:"Blackmail",def:"Threatening to release damaging information unless demands are met",sc:"An attacker threatens to publish an executive's private emails unless she pays him. What is the motivation?"},
  {id:"t17",g:"motive",d:2,t:"Philosophical or political beliefs",def:"Attacking to promote a cause or an ideology",sc:"A group leaks a company's internal documents to protest its labor practices. What motivation drives this?",alt:["political beliefs", "philosophical beliefs", "hacktivism", "ideology"]},
  {id:"t18",g:"motive",d:2,t:"Service disruption",def:"Attacking to take systems offline and stop an organization from operating",sc:"Attackers flood a stock exchange's website during trading hours so that trades cannot go through. What is the goal?",alt:["disruption", "denial of service"]},
  {id:"t19",g:"motive",d:2,t:"War",def:"Cyberattacks a nation uses as part of a military conflict, such as against power grids",sc:"During an armed conflict, one country's military hackers shut down the other country's power grid. What motivation is this?",avoid:["t18"]},
  {id:"t20",g:"motive",d:2,t:"Ethical",def:"Hacking with permission or good intent, such as finding flaws and reporting them",sc:"A researcher finds a flaw in a website and reports it privately to the company so it can be fixed. What motivates this?",alt:["ethical hacking"]},
  {id:"t7",g:"social",d:2,t:"Phishing",def:"Fraudulent email that tricks people into revealing information or opening malicious links",sc:"Staff receive an email that looks like it is from IT and asks them to log in through a link to keep their account. What attack is this?",fix:"Security awareness training and email filtering",avoid:["t8","t9"]},
  {id:"t8",g:"social",d:2,t:"Smishing",def:"Phishing carried out by SMS text message",sc:"A text message claims a package is held and asks the user to pay a fee through a link. What attack is this?",avoid:["t7","t9"]},
  {id:"t9",g:"social",d:2,t:"Vishing",def:"Phishing carried out by voice call",sc:"A caller pretends to be from the bank's fraud team and asks for a one-time code. What attack is this?",avoid:["t7","t8"]},
  {id:"t10",g:"social",d:2,t:"Watering hole attack",def:"Compromising a website that the target group is known to visit",sc:"Attackers infect an industry forum that engineers at the target company use every day. What attack is this?",alt:["watering hole"]},
  {id:"t11",g:"social",d:2,t:"Typosquatting",def:"Registering a domain name that is a common misspelling of a legitimate one",sc:"An attacker registers gooogle.com to catch users who mistype the address. What is this called?"},
  {id:"t21",g:"social",d:2,t:"Impersonation",def:"Pretending to be someone else, such as a technician or an executive, to gain trust",sc:"A person in a copier company's uniform walks into the office and says he is there to service the printers. What technique is this?",avoid:["t23"]},
  {id:"t22",g:"social",d:2,t:"Business email compromise (BEC)",def:"Using a hacked or spoofed business email account to trick staff into sending money or data",sc:"Using the CFO's hacked mailbox, an attacker emails accounts payable to change a supplier's bank details. What attack is this?",avoid:["t7"],alt:["bec"]},
  {id:"t23",g:"social",d:2,t:"Pretexting",def:"Making up a believable story, the pretext, to get someone to give information or access",sc:"An attacker tells a receptionist he is an auditor who must confirm staff names for a surprise review. What technique is he relying on?"},
  {id:"t24",g:"social",d:2,t:"Disinformation",def:"False information spread on purpose to deceive people",sc:"A group knowingly posts fake news that a company's product is unsafe, to drive its stock price down. What is this?"},
  {id:"t25",g:"social",d:2,t:"Misinformation",def:"False information spread without the intent to deceive, often by people who believe it",sc:"Employees share an inaccurate rumor about a data breach that they genuinely believe is true. What is this?"},
  {id:"t26",g:"social",d:2,t:"Brand impersonation",def:"Copying a trusted brand's logos and look in emails or websites to trick victims",sc:"An email uses a bank's exact logo, colors, and fonts so that its fake login page looks real. What technique is this?",avoid:["t7"],alt:["brand impersonation"]},
  {id:"t12",g:"vector",d:2,t:"Supply chain attack",def:"Compromising a vendor, supplier, or software update to reach the real target",sc:"Attackers insert malware into a vendor's software update, which then installs at thousands of customers. What attack is this?",alt:["supply chain"]},
  {id:"t27",g:"vector",d:2,t:"Removable device",def:"Malware delivered on USB drives or other media that someone plugs in",sc:"USB drives labeled Payroll 2026 are left in the company parking lot. Which threat vector is this?",alt:["usb", "usb drive", "removable media", "baiting"]},
  {id:"t28",g:"vector",d:2,t:"Default credentials",def:"Factory-set usernames and passwords that were never changed",sc:"An attacker logs in to a new security camera with the username admin and the password admin. Which threat vector did the attacker use?",alt:["default passwords", "default password"]},
  {id:"t29",g:"vector",d:2,t:"Open service ports",def:"Network ports left listening for services that are not needed",sc:"A scan finds Telnet listening on a server that nobody uses for remote access. Which attack surface is this?",alt:["open ports", "open port"]},
  {id:"t30",g:"vector",d:2,t:"Unsupported systems",def:"Systems past their end of life that no longer receive security patches",sc:"A clinic still runs Windows 7 on a reception PC that gets no security updates. Which threat vector does this create?",alt:["unsupported system", "end of life", "eol", "legacy system"]},
  {id:"t31",g:"vector",d:2,t:"Unsecure wireless network",def:"Wi-Fi with weak or no encryption, or with open access",sc:"An office access point still uses WEP, which an attacker cracks from the parking lot. Which threat vector did the attacker use?",alt:["unsecure wifi", "open wifi", "insecure wireless", "insecure wifi"]},
  {id:"t32",g:"vector",d:2,t:"Message-based vector",def:"Attacks delivered through email, SMS, or instant messages",sc:"Malicious links are sent to staff through the company's chat app. Which type of threat vector is this?",alt:["message based"]},
  {id:"t33",g:"vector",d:2,t:"Image-based vector",def:"Malicious code or links hidden inside image files",sc:"A malicious SVG image runs embedded script when a user opens it. Which type of threat vector is this?",alt:["image based"]},
  {id:"t34",g:"vector",d:2,t:"File-based vector",def:"Malicious code hidden in documents or other files, such as Office macros or PDFs",sc:"A spreadsheet on a shared drive contains a macro that downloads malware when someone enables it. Which type of threat vector is this?",alt:["file based", "malicious attachment"]}
 ]},
 attacks:{need:2,typed:true,labs:["vulnhunt","malware","kill"],groups:[["app","Application flaws","Application"],["plat","Platform, mobile & cloud flaws","Platform"],["mal","Malware","Malware"],["net","Network & password attacks","Network"],["phys","Physical, wireless & crypto attacks","Other"],["ind","Indicators of malicious activity","Indicators"],["mit","Mitigation techniques","Mitigation"]],items:[
  {id:"a1",g:"app",d:2,t:"SQL injection",def:"Inserting database commands into application input so the database runs them",sc:"A login form accepts ' OR 1=1 -- as a username and lets the attacker in. What attack is this?",fix:"Input validation and parameterized queries",fixAvoid:["a2","a3"],alt:["sqli", "sql injection attack"]},
