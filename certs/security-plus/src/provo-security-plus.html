 {id:"b104",d:4,q:"To find failed login attempts on a Windows server, which data source should an analyst check?",o:["OS security logs","Firewall logs","NetFlow records","Vulnerability scan output"],a:0,x:"The Windows Security event log records logon successes and failures."},
 {id:"b105",d:4,q:"An analyst examines an email's headers to trace the mail servers it passed through. What type of data is the analyst using?",o:["Metadata","Packet capture","Endpoint logs","Application logs"],a:0,x:"Email headers are metadata: data about the message, such as sender, timestamps, and the servers it passed through."},
 {id:"b106",d:4,q:"An analyst searches logs for signs of a known attacker technique even though no alert has fired. What is this activity?",o:["Threat hunting","Incident containment","Vulnerability scanning","Penetration testing"],a:0,x:"Threat hunting proactively looks for threats that have not triggered an alert."},
 {id:"b107",d:5,q:"Which document is mandatory and sets specific technical requirements, such as a minimum password length of 14 characters?",o:["Standard","Guideline","Procedure","Policy"],a:0,x:"A standard sets mandatory, specific requirements. A policy states high-level goals, a procedure gives step-by-step instructions, and a guideline offers optional advice."},
 {id:"b108",d:5,q:"Under GDPR, which role decides why and how personal data is processed?",o:["Data controller","Data processor","Data custodian","Data subject"],a:0,x:"The controller determines the purpose and means of processing. A processor handles data on the controller's behalf, and the data subject is the person the data is about."},
 {id:"b109",d:5,q:"A database administrator applies access rules and runs nightly backups for data that the VP of Sales is accountable for. What is the administrator's role?",o:["Data custodian","Data owner","Data controller","Data subject"],a:0,x:"The custodian handles data day to day under the owner's direction. The owner is the senior person accountable for the data."},
 {id:"b110",d:5,q:"An asset is worth $50,000 and would lose 20% of its value in one incident. The incident is expected twice a year. What is the ALE?",o:["$20,000","$10,000","$100,000","$5,000"],a:0,x:"SLE = $50,000 × 0.20 = $10,000. ALE = SLE × ARO = $10,000 × 2 = $20,000."},
 {id:"b111",d:5,q:"A company decides to stop offering a high-risk online service instead of trying to secure it. Which risk response is this?",o:["Avoid","Accept","Transfer","Mitigate"],a:0,x:"Avoiding a risk means stopping the activity that creates it."},
 {id:"b112",d:5,q:"A document lists every identified risk along with its owner, likelihood, impact, and planned response. What is it?",o:["Risk register","Business impact analysis","Asset inventory","Statement of work"],a:0,x:"A risk register tracks identified risks and how each will be handled."},
 {id:"b113",d:5,q:"A team rates each risk as high, medium, or low without assigning dollar values. Which type of risk analysis is this?",o:["Qualitative","Quantitative","Annualized","Inherent"],a:0,x:"Qualitative analysis uses categories or ratings. Quantitative analysis uses numbers, such as SLE and ALE in dollars."},
 {id:"b114",d:5,q:"Which agreement sets the general terms for all future projects between a company and a consultancy, with each project then described separately?",o:["Master service agreement (MSA)","Statement of work (SOW)","Service-level agreement (SLA)","Non-disclosure agreement (NDA)"],a:0,x:"An MSA sets the overall terms. Each project is then defined in its own statement of work."},
 {id:"b115",d:5,q:"Which document defines the specific deliverables, timeline, and tasks for one project with a vendor?",o:["Statement of work (SOW)","Master service agreement (MSA)","Memorandum of understanding (MOU)","Business partners agreement (BPA)"],a:0,x:"An SOW lists exactly what will be delivered and when for one engagement."},
 {id:"b116",d:5,q:"Two government agencies sign a document stating their shared intention to exchange threat data. It contains no binding terms. What is it?",o:["Memorandum of understanding (MOU)","Master service agreement (MSA)","Service-level agreement (SLA)","Statement of work (SOW)"],a:0,x:"An MOU expresses shared intent and is usually not legally binding."},
 {id:"b117",d:5,q:"Before choosing a new cloud vendor, a company reviews the vendor's security certifications, financial health, and history of breaches. What is this process?",o:["Vendor due diligence","Penetration testing","Attestation","Change management"],a:0,x:"Due diligence is investigating a vendor before signing, to understand the risks it brings."},
 {id:"b118",d:5,q:"Which regulation gives people in the European Union the right to have their personal data erased?",o:["GDPR","PCI DSS","SOX","HIPAA"],a:0,x:"GDPR includes the right to erasure, often called the right to be forgotten. PCI DSS covers payment cards, SOX covers financial reporting, and HIPAA covers U.S. health data."},
 {id:"b119",d:5,q:"A store that stores and processes credit card payments must comply with which standard?",o:["PCI DSS","GDPR","ISO 9001","NIST SP 800-88"],a:0,x:"PCI DSS is the security standard for any organization that stores, processes, or sends payment card data."},
 {id:"b120",d:5,q:"Penetration testers are given network diagrams, source code, and test accounts before they start. What type of test is this?",o:["Known environment","Unknown environment","Partially known environment","Passive reconnaissance"],a:0,x:"A known environment test (formerly white box) gives testers full information. An unknown environment test gives them none."},
 {id:"b121",d:5,q:"A tester studies a company's website, job postings, and public DNS records without sending any traffic to its network. What is this?",o:["Passive reconnaissance","Active reconnaissance","Vulnerability scanning","Social engineering"],a:0,x:"Passive reconnaissance gathers information without directly interacting with the target's systems."},
 {id:"b122",d:5,q:"Which document sets the limits of a penetration test, such as which systems may be tested and during which hours?",o:["Rules of engagement","Non-disclosure agreement","Service-level agreement","Acceptable use policy"],a:0,x:"Rules of engagement define the scope, timing, and allowed methods of a test."},
 {id:"b123",d:5,q:"The security team sends simulated phishing emails to staff and gives extra training to anyone who clicks. What is this?",o:["A phishing campaign","A penetration test","A tabletop exercise","An external audit"],a:0,x:"A phishing campaign tests and trains staff with realistic but harmless phishing emails."},
 {id:"b124",d:5,q:"The order system must be restored within four hours of an outage to avoid unacceptable losses. Which metric is this?",o:["Recovery time objective (RTO)","Recovery point objective (RPO)","Mean time between failures (MTBF)","Annualized rate of occurrence (ARO)"],a:0,x:"RTO is the maximum acceptable downtime. RPO is the maximum acceptable data loss."},
 {id:"b125",d:5,q:"An independent firm reviews a company's security controls and reports its findings to the company's regulator. What type of assessment is this?",o:["External audit","Internal audit","Self-assessment","Vulnerability scan"],a:0,x:"An external audit is carried out by an independent outside party. An internal audit uses the company's own staff."},
 {id:"b126",d:5,q:"Which of the following is a consequence of non-compliance with a regulation?",o:["Fines and sanctions","Lower insurance premiums","Faster audits","Automatic certification"],a:0,x:"Regulators can impose fines and sanctions. Other consequences include reputational damage, loss of license, and contract impacts."},
 {id:"b127",d:5,q:"Which business continuity activity identifies the most critical business functions and what an outage of each would cost?",o:["Business impact analysis","Risk transference","Penetration testing","Change management"],a:0,x:"A business impact analysis identifies critical functions and the impact of losing them. It produces values such as RTO and RPO."}
];

/* Term modules. Each module is a set of terms asked several ways (name it, define it, a scenario, and,
   where a term has one, the best defense). A term is mastered after `need` different kinds of question
   about it are answered correctly. They cover every term in the SY0-701 objectives that suits this format. */
const TERMSETS = {
 controls:{need:2,groups:[["cat","Control categories","Categories"],["type","Control types","Types"],["cia","CIA, AAA & core concepts","Concepts"],["zt","Zero trust","Zero trust"],["phys","Physical security","Physical"],["decep","Deception & disruption","Deception"],["change","Change management","Change"]],items:[
  {id:"c1",g:"cat",d:1,t:"Technical control",def:"A control carried out by a system, such as a firewall rule, encryption, or antivirus",sc:"A firewall rule that blocks inbound traffic on unused ports belongs to which control category?"},
  {id:"c2",g:"cat",d:1,t:"Managerial control",def:"A control that sets direction and oversight, such as a security policy or a risk assessment",sc:"Leadership approves a written information security policy. Which control category is the policy?"},
  {id:"c3",g:"cat",d:1,t:"Operational control",def:"A control carried out by people day to day, such as security guards or awareness training",sc:"Staff attend monthly security awareness sessions run by the security team. Which control category is this?"},
  {id:"c4",g:"cat",d:1,t:"Physical control",def:"A control that restricts physical access, such as fences, door locks, or bollards",sc:"Concrete bollards are placed in front of a building entrance. Which control category are they?"},
  {id:"c5",g:"type",d:1,t:"Preventive control",def:"Stops an incident from happening in the first place",sc:"A door stays locked until an authorized badge is scanned. Which control type is this?"},
  {id:"c6",g:"type",d:1,t:"Deterrent control",def:"Discourages an attacker from trying, without physically stopping them",sc:"A sign warns that the premises are under video surveillance. Which control type is the sign?"},
  {id:"c7",g:"type",d:1,t:"Detective control",def:"Identifies and records an incident while or after it happens",sc:"An analyst reviews login logs each morning to find unauthorized access. Which control type is this?"},
  {id:"c8",g:"type",d:1,t:"Corrective control",def:"Fixes damage or restores normal operation after an incident",sc:"After a ransomware attack, a server is restored from backup. Which control type is the restore?"},
  {id:"c9",g:"type",d:1,t:"Compensating control",def:"An alternative control used when the primary control cannot be put in place",sc:"A legacy system cannot be patched, so it is moved onto an isolated network segment. Which control type is the isolation?"},
  {id:"c14",g:"type",d:1,t:"Directive control",def:"Tells people what they should or should not do, such as a policy or an instruction",sc:"An instruction in the employee handbook tells staff to store sensitive files only on the encrypted share. Which control type is this?"},
  {id:"c15",g:"cia",d:1,t:"Confidentiality",def:"Keeping information secret from anyone who is not authorized to see it",sc:"Customer records are encrypted so that only authorized staff can read them. Which part of the CIA triad does this protect?"},
  {id:"c16",g:"cia",d:1,t:"Integrity",def:"Making sure data is not changed without authorization, and that any change can be detected",sc:"A file's hash is checked after download to confirm that nobody altered it. Which part of the CIA triad does this protect?"},
  {id:"c17",g:"cia",d:1,t:"Availability",def:"Making sure systems and data can be reached by authorized users when they need them",sc:"A company adds redundant power supplies and a second internet link so its website stays online. Which part of the CIA triad does this support?"},
  {id:"c18",g:"cia",d:1,t:"Authentication",def:"Proving that a user or device is who or what it claims to be",sc:"A user enters a password and a code from a phone app before the system lets her in. Which part of AAA is this?"},
  {id:"c19",g:"cia",d:1,t:"Authorization",def:"Deciding what an authenticated user is allowed to access or do",sc:"After logging in, an employee can open HR files but not finance files because of her group membership. Which part of AAA decides this?"},
  {id:"c20",g:"cia",d:1,t:"Accounting",def:"Recording what users do, such as when they logged in, what they accessed, and for how long",sc:"A VPN server logs each user's connection time and how much data they transferred. Which part of AAA is this?"},
  {id:"c10",g:"cia",d:1,t:"Non-repudiation",def:"Proof that a specific person performed an action, so they cannot later deny it",sc:"A signed contract carries the sender's digital signature, so the sender cannot claim they never sent it. Which concept is this?"},
  {id:"c12",g:"cia",d:1,t:"Gap analysis",def:"Comparing the current security posture with a target standard to find what is missing",sc:"A company compares its current controls with a security framework to list what still needs to be done. What is this called?"},
  {id:"c11",g:"zt",d:1,t:"Zero trust",def:"No user or device is trusted by default; every access request is verified",sc:"Every request to an internal app is authenticated and authorized, even from inside the office network. Which model is this?"},
  {id:"c21",g:"zt",d:1,t:"Control plane",def:"The zero trust layer that decides whether access is allowed; it holds the policy engine and policy administrator",sc:"In a zero trust design, which plane contains the policy engine and decides whether a request is allowed?"},
  {id:"c22",g:"zt",d:1,t:"Data plane",def:"The zero trust layer where traffic actually flows, through a policy enforcement point that allows or blocks it",sc:"In a zero trust design, which plane carries the user's traffic to the resource once access is granted?"},
  {id:"c23",g:"zt",d:1,t:"Policy engine",def:"The zero trust component that checks each request against policy and decides to grant or deny it",sc:"Which zero trust component makes the actual decision to grant or deny an access request?"},
  {id:"c24",g:"zt",d:1,t:"Policy administrator",def:"The zero trust component that carries out the policy engine's decision by setting up or closing the session, such as by issuing a token",sc:"Which zero trust component takes the engine's grant decision and tells the enforcement point to open the session?"},
  {id:"c25",g:"zt",d:1,t:"Policy enforcement point",def:"The gatekeeper in the data plane that allows, monitors, and ends connections between a user and a resource",sc:"Which zero trust component sits in the path of the traffic and lets a connection through or blocks it?"},
  {id:"c26",g:"zt",d:1,t:"Adaptive identity",def:"Checking identity using context such as location, device, and behavior, and asking for more proof when the risk is higher",sc:"A login from a new country triggers an extra verification step that a login from the office does not. Which zero trust concept is this?"},
  {id:"c27",g:"zt",d:1,t:"Threat scope reduction",def:"Limiting the number of entry points and the amount of access, so an attacker who gets in can reach less",sc:"A zero trust project removes unneeded network paths and gives each user only the access a task requires, so a compromise reaches less. Which zero trust goal is this?"},
  {id:"c28",g:"zt",d:1,t:"Implicit trust zone",def:"A network area where devices are trusted simply because of where they are, which zero trust removes",sc:"In a traditional network, any device plugged into the internal LAN is trusted automatically. What does zero trust call such an area?"},
  {id:"c29",g:"phys",d:1,t:"Bollards",def:"Short, sturdy posts that stop vehicles from reaching a building or entrance",sc:"Steel posts are installed outside a lobby's glass front so a car cannot drive through it. What are they?"},
  {id:"c30",g:"phys",d:1,t:"Access control vestibule",def:"A small space between two doors where only one door can open at a time, which stops tailgating",sc:"Visitors enter a small room where the outer door must close before the inner door will open. What is this?"},
  {id:"c31",g:"phys",d:1,t:"Fencing",def:"A barrier that marks a boundary and keeps people out; tall fencing also discourages climbing",sc:"An 8-foot barrier topped with barbed wire surrounds a data center's grounds. What physical control is this?"},
  {id:"c32",g:"phys",d:1,t:"Video surveillance",def:"Cameras that record and monitor an area, which both deter and detect",sc:"Cameras with motion detection record the loading dock around the clock. What physical control is this?"},
  {id:"c33",g:"phys",d:1,t:"Security guard",def:"A person who checks identities, watches entrances, and responds to events",sc:"A person at the front desk checks every visitor's ID and escorts them inside. What physical control is this?"},
  {id:"c34",g:"phys",d:1,t:"Access badge",def:"An ID card, often with an RFID or smart chip, that opens doors and identifies the wearer",sc:"Employees tap a card on a reader to unlock each office door. What are they using?"},
  {id:"c35",g:"phys",d:1,t:"Lighting",def:"Bright lights around a site that discourage intruders and help cameras record",sc:"Floodlights are added to a dark parking lot so guards and cameras can see anyone there at night. What physical control is this?"},
  {id:"c36",g:"phys",d:1,t:"Infrared sensor",def:"A sensor that detects body heat moving through an area",sc:"A motion sensor in a closed office detects the heat of a person moving after hours. Which sensor type is this?"},
  {id:"c37",g:"phys",d:1,t:"Pressure sensor",def:"A sensor that detects weight or force, such as someone stepping on a mat",sc:"A mat in front of the vault door triggers an alarm when someone stands on it. Which sensor type is this?"},
  {id:"c38",g:"phys",d:1,t:"Microwave sensor",def:"A sensor that sends out microwave signals and detects movement from changes in their reflection; it covers large areas",sc:"A sensor fills a warehouse with radio signals and raises an alarm when their reflection changes. Which sensor type is this?"},
  {id:"c39",g:"phys",d:1,t:"Ultrasonic sensor",def:"A sensor that sends out high-frequency sound and detects movement from changes in the echo",sc:"A sensor emits sound above human hearing and raises an alarm when its echo changes. Which sensor type is this?"},
  {id:"c13",g:"decep",d:1,t:"Honeypot",def:"A decoy system that lures attackers so their activity can be observed",sc:"A fake, unprotected-looking server is placed on the network to attract and study attackers. What is it?"},
  {id:"c40",g:"decep",d:1,t:"Honeynet",def:"A network of decoy systems built to attract and study attackers",sc:"Researchers build a whole fake network of servers and workstations to watch how attackers move between them. What is this?"},
  {id:"c41",g:"decep",d:1,t:"Honeyfile",def:"A decoy file with a tempting name that raises an alert when someone opens it",sc:"A file named passwords.xlsx with no real data sits on a file share and raises an alert whenever it is opened. What is it?"},
  {id:"c42",g:"decep",d:1,t:"Honeytoken",def:"Fake data, such as a fake API key or account, that raises an alert when someone tries to use it",sc:"A fake cloud access key is planted in a code repository, and any attempt to use it triggers an alert. What is it?"},
  {id:"c43",g:"decep",d:1,t:"DNS sinkhole",def:"A DNS server that answers requests for malicious domains with a safe address, cutting malware off from its controller",sc:"Infected hosts that look up a known command-and-control domain are given an internal address that goes nowhere. What is this?"},
  {id:"c44",g:"change",d:1,t:"Approval process",def:"The formal review and sign-off a change needs before it can be made",sc:"A firewall rule change waits until the change advisory board reviews and signs off on it. Which part of change management is this?"},
  {id:"c45",g:"change",d:1,t:"Change owner",def:"The person or team responsible for carrying out a change and answering for its results",sc:"The network team lead is named as responsible for a router upgrade and must report how it went. What change management role is this?"},
  {id:"c46",g:"change",d:1,t:"Stakeholders",def:"The people and groups a change affects, who should be consulted or kept informed",sc:"Before a payroll system upgrade, IT meets with HR and finance because the change will affect their work. What are HR and finance in this change?"},
  {id:"c47",g:"change",d:1,t:"Impact analysis",def:"Working out what a change could affect, and the risk of making it or not making it",sc:"Before patching a database server, the team lists every application that depends on it and what could break. What is this?"},
  {id:"c48",g:"change",d:1,t:"Backout plan",def:"A plan to undo a change and return to the previous state if it fails",sc:"A change request explains exactly how to reinstall the old firmware if the upgrade causes problems. What is this part of the request?"},
  {id:"c49",g:"change",d:1,t:"Maintenance window",def:"An agreed time, usually outside business hours, when changes can be made with the least impact",sc:"Changes to the online store's servers may only be made between 1 a.m. and 4 a.m. on Sundays. What is this period called?"},
  {id:"c50",g:"change",d:1,t:"Standard operating procedure (SOP)",def:"Written step-by-step instructions for doing a routine task the same way every time",sc:"Technicians follow a documented step-by-step guide every time they set up a new server. What is the guide?"},
  {id:"c51",g:"change",d:1,t:"Allow list",def:"Only the items on an approved list may run or connect; everything else is blocked",sc:"Only applications on an approved list can run on the kiosks; everything else is blocked. What is this?"},
  {id:"c52",g:"change",d:1,t:"Deny list",def:"The items on the list are blocked; everything else is allowed",sc:"A firewall blocks a list of known malicious IP addresses and allows all other traffic. What is this?"},
  {id:"c53",g:"change",d:1,t:"Dependencies",def:"Other systems or services that a component relies on, which a change to it can break",sc:"Restarting the authentication server will also interrupt the VPN, because the VPN relies on it. What technical consideration does this show?"},
  {id:"c54",g:"change",d:1,t:"Version control",def:"Tracking every change to code or configuration files so any earlier version can be restored",sc:"Every edit to the router configurations is saved with who made it, and any older version can be restored. What is this?"},
  {id:"c55",g:"change",d:1,t:"Legacy application",def:"Old software still in use that may be unsupported and poorly understood, so changes to it are risky",sc:"A 20-year-old billing program has no vendor support, and nobody knows how it will react to an operating system update. What is it?"}
 ]},
 crypto:{need:2,groups:[["enc","Encryption & hashing","Encryption"],["keys","Keys & key storage","Keys"],["pki","Certificates & PKI","PKI"],["obf","Obfuscation & ledgers","Obfuscation"],["level","Encryption levels","Levels"]],items:[
  {id:"k1",g:"enc",d:1,t:"Symmetric encryption",def:"One shared key both encrypts and decrypts the data",sc:"A backup file is encrypted with AES using one secret key that is also used to decrypt it. What kind of encryption is this?",avoid:["k2"]},
  {id:"k2",g:"enc",d:1,t:"Asymmetric encryption",def:"A public and private key pair; data encrypted with one key can be decrypted only with the other",sc:"A sender encrypts a message with the recipient's public key so only the recipient's private key can decrypt it. What kind of encryption is this?",avoid:["k1"]},
  {id:"k3",g:"enc",d:1,t:"Hashing",def:"A one-way function that turns data into a fixed-length value used to check integrity",sc:"A technician compares a downloaded file's SHA-256 value with the value on the vendor's site. What technique is this?"},
  {id:"k4",g:"enc",d:1,t:"Salting",def:"Adding random data to a password before hashing so identical passwords produce different hashes",sc:"Two users choose the same password, but their stored hashes are different. Which technique causes this?",avoid:["k5"]},
  {id:"k5",g:"enc",d:1,t:"Key stretching",def:"Running a hash many times to make each password guess slower for an attacker",sc:"A system uses PBKDF2 with many iterations so brute-forcing stolen hashes takes far longer. Which technique is this?",avoid:["k4"]},
  {id:"k6",g:"enc",d:1,t:"Digital signature",def:"A hash encrypted with the sender's private key, proving integrity, authenticity, and non-repudiation",sc:"A software publisher signs its installer so users can verify who made it and that it was not changed. What does the publisher use?"},
  {id:"k14",g:"enc",d:1,t:"Key exchange",def:"Securely sharing or agreeing on encryption keys over an untrusted network, such as with Diffie-Hellman",sc:"Two systems use Diffie-Hellman to agree on a shared session key without ever sending the key itself. What is this process called?"},
  {id:"k15",g:"enc",d:1,t:"Key length",def:"The size of a key in bits; longer keys take far longer to brute-force",sc:"A company moves from 128-bit to 256-bit AES keys to make brute-force attacks impractical. Which property did it change?"},
  {id:"k16",g:"enc",d:1,t:"Transport encryption",def:"Encrypting data while it moves across a network, such as with TLS or IPsec",sc:"A web server uses TLS so that data between browsers and the server cannot be read on the way. What kind of encryption is this?"},
  {id:"k17",g:"enc",d:1,t:"Perfect forward secrecy",def:"Using a new key for every session, so one stolen key cannot decrypt past sessions",sc:"Even after a server's private key is stolen, recorded past TLS sessions cannot be decrypted because each used its own temporary key. What property is this?"},
  {id:"k18",g:"keys",d:1,t:"Public key",def:"The half of a key pair that is shared openly, used to encrypt data for its owner or to check the owner's signatures",sc:"Ana wants anyone to be able to send her encrypted messages that only she can read. Which key does she share with everyone?"},
  {id:"k19",g:"keys",d:1,t:"Private key",def:"The half of a key pair that only its owner keeps, used to decrypt data and to create digital signatures",sc:"A software publisher signs its installers with a key that must never leave its secure signing system. Which key is this?"},
  {id:"k11",g:"keys",d:1,t:"Key escrow",def:"A trusted third party holds a copy of encryption keys so they can be recovered",sc:"A company stores copies of its encryption keys with a trusted third party in case they are lost. What is this called?"},
  {id:"k12",g:"keys",d:1,t:"Trusted Platform Module (TPM)",def:"A chip on a device's motherboard that securely stores keys and supports secure boot and disk encryption",sc:"Full-disk encryption on a laptop stores its key in a chip built into the motherboard. What is the chip?",avoid:["k13"]},
  {id:"k13",g:"keys",d:1,t:"Hardware security module (HSM)",def:"A dedicated, tamper-resistant appliance that generates, stores, and manages keys for many systems",sc:"A bank uses a dedicated appliance to protect the signing keys for all of its servers. What is the appliance?",avoid:["k12"]},
  {id:"k20",g:"keys",d:1,t:"Key management system",def:"Software or a service that creates, stores, rotates, and retires keys through their whole life",sc:"A cloud service centrally creates, rotates, and expires the encryption keys for every database the company runs. What is it?",avoid:["k13"]},
  {id:"k21",g:"keys",d:1,t:"Secure enclave",def:"A protected area of a processor that keeps sensitive data, such as fingerprint data, isolated from the main operating system",sc:"A phone stores fingerprint data in an isolated part of its processor that even the operating system cannot read. What is this?"},
  {id:"k7",g:"pki",d:1,t:"Certificate authority (CA)",def:"A trusted entity that issues and signs digital certificates",sc:"Which entity signs a website's certificate so browsers will trust it?"},
  {id:"k8",g:"pki",d:1,t:"Certificate revocation list (CRL)",def:"A list a certificate authority publishes of certificates revoked before they expire",sc:"A browser downloads a list from the CA to check whether a certificate has been revoked. What is the list?",avoid:["k9"]},
  {id:"k9",g:"pki",d:1,t:"OCSP",def:"A protocol that checks the revocation status of a single certificate in real time",sc:"A browser asks the CA's responder whether one specific certificate is still valid. Which protocol is this?",avoid:["k8"]},
  {id:"k10",g:"pki",d:1,t:"Wildcard certificate",def:"One certificate that covers every subdomain at one level, such as *.example.com",sc:"A single certificate secures shop.example.com, mail.example.com, and www.example.com. What type of certificate is it?"},
  {id:"k22",g:"pki",d:1,t:"Self-signed certificate",def:"A certificate signed by its own creator instead of a trusted CA, so browsers do not trust it by default",sc:"An internal test server's certificate was signed by the server itself, and browsers show a warning. What type of certificate is it?"},
  {id:"k23",g:"pki",d:1,t:"Third-party certificate",def:"A certificate signed by a public CA that browsers and operating systems already trust",sc:"A company gets its website certificate from a well-known public CA so that every browser trusts it. What type of certificate is this?"},
  {id:"k24",g:"pki",d:1,t:"Root of trust",def:"The trusted starting point, such as a root CA certificate, that all other trust is built on",sc:"A browser trusts a website because its certificate chains back to a CA certificate already stored in the browser. What is that stored certificate?"},
  {id:"k25",g:"pki",d:1,t:"Certificate signing request (CSR)",def:"A request containing a public key and identity details that is sent to a CA to get a certificate",sc:"An admin generates a key pair on a web server, then sends the CA a file holding the public key and the domain name. What is the file?"},
  {id:"k26",g:"pki",d:1,t:"Subject alternative name (SAN)",def:"A certificate field that lists the additional names a certificate covers",sc:"One certificate covers example.com, example.net, and shop.example.org because each name is listed in it. Which certificate field lists them?",avoid:["k10"]},
  {id:"k27",g:"obf",d:1,t:"Steganography",def:"Hiding data inside another file, such as an image, so nobody knows the data is there",sc:"An attacker hides stolen data inside the pixels of a vacation photo. What technique is this?"},
  {id:"k28",g:"obf",d:1,t:"Tokenization",def:"Replacing sensitive data with a random token that maps back to the original in a secured vault",sc:"A payment app stores a random stand-in value instead of the real card number, and only the processor can map it back. What is this?"},
  {id:"k29",g:"obf",d:1,t:"Data masking",def:"Hiding part of a value when it is shown, such as displaying only the last four digits",sc:"A call center screen shows Social Security numbers as ***-**-6789. What technique is this?"},
  {id:"k30",g:"obf",d:1,t:"Blockchain",def:"A distributed ledger of records linked by hashes, so past entries cannot be changed without detection",sc:"Transactions are recorded in blocks that each contain the hash of the block before, and many participants hold copies. What technology is this?",avoid:["k31"]},
  {id:"k31",g:"obf",d:1,t:"Open public ledger",def:"A shared record of blockchain transactions that anyone can view and verify",sc:"Anyone can download and verify the complete history of a cryptocurrency's transactions. What is this record called?"},
  {id:"k32",g:"level",d:1,t:"Full-disk encryption (FDE)",def:"Encrypting an entire drive, including the operating system",sc:"A stolen laptop's whole drive, operating system included, cannot be read without the startup PIN. What is protecting it?"},
  {id:"k33",g:"level",d:1,t:"Partition encryption",def:"Encrypting one partition of a drive while the others stay unencrypted",sc:"Only the data partition of a server's disk is encrypted; the system partition is not. What level of encryption is this?"},
  {id:"k34",g:"level",d:1,t:"File encryption",def:"Encrypting individual files, such as with Windows EFS",sc:"A user encrypts one spreadsheet from its file properties, leaving the rest of the folder as it was. What level of encryption is this?"},
  {id:"k35",g:"level",d:1,t:"Database encryption",def:"Encrypting a whole database so all of its stored data is protected",sc:"A database administrator turns on transparent data encryption so every table is encrypted on disk. What level of encryption is this?"},
  {id:"k36",g:"level",d:1,t:"Record-level encryption",def:"Encrypting only specific records or fields in a database, such as the card number column",sc:"Only the credit card column in the orders table is encrypted; the other columns stay readable. What level of encryption is this?"}
 ]},
 threats:{need:2,groups:[["actor","Threat actors","Actors"],["motive","Motivations","Motives"],["social","Social engineering","Social"],["vector","Threat vectors & attack surfaces","Vectors"]],items:[
  {id:"t1",g:"actor",d:2,t:"Nation-state",def:"A government-backed group with large resources that often seeks espionage or disruption over long periods",sc:"A well-funded group backed by a foreign government stays hidden in a defense contractor's network for months. Which threat actor is this?"},
  {id:"t2",g:"actor",d:2,t:"Unskilled attacker",def:"An attacker with little skill who relies on tools and exploits written by others",sc:"A teenager downloads a ready-made attack tool and runs it against a school website. Which threat actor is this?"},
  {id:"t3",g:"actor",d:2,t:"Hacktivist",def:"An attacker motivated by a political or social cause",sc:"A group defaces a company's website to protest its environmental record. Which threat actor is this?"},
  {id:"t4",g:"actor",d:2,t:"Insider threat",def:"A current or former employee, contractor, or partner who misuses authorized access",sc:"An employee who was passed over for promotion copies customer data before resigning. Which threat actor is this?"},
  {id:"t5",g:"actor",d:2,t:"Organized crime",def:"A criminal group motivated mainly by financial gain, such as through ransomware",sc:"A professional criminal group runs ransomware campaigns to extort payments. Which threat actor is this?"},
  {id:"t6",g:"actor",d:2,t:"Shadow IT",def:"Hardware or software used without the IT department's knowledge or approval",sc:"A team stores project files in a personal cloud account that IT never approved. What is this called?"},
  {id:"t13",g:"motive",d:2,t:"Espionage",def:"Secretly gathering information, such as trade secrets or government plans",sc:"A foreign intelligence agency breaks into a defense contractor to copy weapons designs. What is the main motivation?"},
  {id:"t14",g:"motive",d:2,t:"Financial gain",def:"Attacking to make money, such as through ransom, fraud, or selling stolen data",sc:"A gang encrypts a hospital's files and demands $2 million in cryptocurrency. What is the main motivation?",avoid:["t16"]},
  {id:"t15",g:"motive",d:2,t:"Revenge",def:"Attacking to get back at an organization or person for a wrong the attacker feels they suffered",sc:"An administrator who was just fired deletes the company's backups out of anger. What is the motivation?"},
  {id:"t16",g:"motive",d:2,t:"Blackmail",def:"Threatening to release damaging information unless demands are met",sc:"An attacker threatens to publish an executive's private emails unless she pays him. What is the motivation?"},
  {id:"t17",g:"motive",d:2,t:"Philosophical or political beliefs",def:"Attacking to promote a cause or an ideology",sc:"A group leaks a company's internal documents to protest its labor practices. What motivation drives this?"},
  {id:"t18",g:"motive",d:2,t:"Service disruption",def:"Attacking to take systems offline and stop an organization from operating",sc:"Attackers flood a stock exchange's website during trading hours so that trades cannot go through. What is the goal?"},
  {id:"t19",g:"motive",d:2,t:"War",def:"Cyberattacks a nation uses as part of a military conflict, such as against power grids",sc:"During an armed conflict, one country's military hackers shut down the other country's power grid. What motivation is this?",avoid:["t18"]},
  {id:"t20",g:"motive",d:2,t:"Ethical",def:"Hacking with permission or good intent, such as finding flaws and reporting them",sc:"A researcher finds a flaw in a website and reports it privately to the company so it can be fixed. What motivates this?"},
  {id:"t7",g:"social",d:2,t:"Phishing",def:"Fraudulent email that tricks people into revealing information or opening malicious links",sc:"Staff receive an email that looks like it is from IT and asks them to log in through a link to keep their account. What attack is this?",fix:"Security awareness training and email filtering",avoid:["t8","t9"]},
  {id:"t8",g:"social",d:2,t:"Smishing",def:"Phishing carried out by SMS text message",sc:"A text message claims a package is held and asks the user to pay a fee through a link. What attack is this?",avoid:["t7","t9"]},
  {id:"t9",g:"social",d:2,t:"Vishing",def:"Phishing carried out by voice call",sc:"A caller pretends to be from the bank's fraud team and asks for a one-time code. What attack is this?",avoid:["t7","t8"]},
  {id:"t10",g:"social",d:2,t:"Watering hole attack",def:"Compromising a website that the target group is known to visit",sc:"Attackers infect an industry forum that engineers at the target company use every day. What attack is this?"},
  {id:"t11",g:"social",d:2,t:"Typosquatting",def:"Registering a domain name that is a common misspelling of a legitimate one",sc:"An attacker registers gooogle.com to catch users who mistype the address. What is this called?"},
  {id:"t21",g:"social",d:2,t:"Impersonation",def:"Pretending to be someone else, such as a technician or an executive, to gain trust",sc:"A person in a copier company's uniform walks into the office and says he is there to service the printers. What technique is this?",avoid:["t23"]},
  {id:"t22",g:"social",d:2,t:"Business email compromise (BEC)",def:"Using a hacked or spoofed business email account to trick staff into sending money or data",sc:"Using the CFO's hacked mailbox, an attacker emails accounts payable to change a supplier's bank details. What attack is this?",avoid:["t7"]},
  {id:"t23",g:"social",d:2,t:"Pretexting",def:"Making up a believable story, the pretext, to get someone to give information or access",sc:"An attacker tells a receptionist he is an auditor who must confirm staff names for a surprise review. What technique is he relying on?"},
  {id:"t24",g:"social",d:2,t:"Disinformation",def:"False information spread on purpose to deceive people",sc:"A group knowingly posts fake news that a company's product is unsafe, to drive its stock price down. What is this?"},
  {id:"t25",g:"social",d:2,t:"Misinformation",def:"False information spread without the intent to deceive, often by people who believe it",sc:"Employees share an inaccurate rumor about a data breach that they genuinely believe is true. What is this?"},
  {id:"t26",g:"social",d:2,t:"Brand impersonation",def:"Copying a trusted brand's logos and look in emails or websites to trick victims",sc:"An email uses a bank's exact logo, colors, and fonts so that its fake login page looks real. What technique is this?",avoid:["t7"]},
  {id:"t12",g:"vector",d:2,t:"Supply chain attack",def:"Compromising a vendor, supplier, or software update to reach the real target",sc:"Attackers insert malware into a vendor's software update, which then installs at thousands of customers. What attack is this?"},
  {id:"t27",g:"vector",d:2,t:"Removable device",def:"Malware delivered on USB drives or other media that someone plugs in",sc:"USB drives labeled Payroll 2026 are left in the company parking lot. Which threat vector is this?"},
  {id:"t28",g:"vector",d:2,t:"Default credentials",def:"Factory-set usernames and passwords that were never changed",sc:"An attacker logs in to a new security camera with the username admin and the password admin. Which threat vector did the attacker use?"},
  {id:"t29",g:"vector",d:2,t:"Open service ports",def:"Network ports left listening for services that are not needed",sc:"A scan finds Telnet listening on a server that nobody uses for remote access. Which attack surface is this?"},
  {id:"t30",g:"vector",d:2,t:"Unsupported systems",def:"Systems past their end of life that no longer receive security patches",sc:"A clinic still runs Windows 7 on a reception PC that gets no security updates. Which threat vector does this create?"},
  {id:"t31",g:"vector",d:2,t:"Unsecure wireless network",def:"Wi-Fi with weak or no encryption, or with open access",sc:"An office access point still uses WEP, which an attacker cracks from the parking lot. Which threat vector did the attacker use?"},
  {id:"t32",g:"vector",d:2,t:"Message-based vector",def:"Attacks delivered through email, SMS, or instant messages",sc:"Malicious links are sent to staff through the company's chat app. Which type of threat vector is this?"},
  {id:"t33",g:"vector",d:2,t:"Image-based vector",def:"Malicious code or links hidden inside image files",sc:"A malicious SVG image runs embedded script when a user opens it. Which type of threat vector is this?"},
  {id:"t34",g:"vector",d:2,t:"File-based vector",def:"Malicious code hidden in documents or other files, such as Office macros or PDFs",sc:"A spreadsheet on a shared drive contains a macro that downloads malware when someone enables it. Which type of threat vector is this?"}
 ]},
 attacks:{need:2,groups:[["app","Application flaws","Application"],["plat","Platform, mobile & cloud flaws","Platform"],["mal","Malware","Malware"],["net","Network & password attacks","Network"],["phys","Physical, wireless & crypto attacks","Other"],["ind","Indicators of malicious activity","Indicators"],["mit","Mitigation techniques","Mitigation"]],items:[
  {id:"a1",g:"app",d:2,t:"SQL injection",def:"Inserting database commands into application input so the database runs them",sc:"A login form accepts ' OR 1=1 -- as a username and lets the attacker in. What attack is this?",fix:"Input validation and parameterized queries",fixAvoid:["a2","a3"]},
  {id:"a2",g:"app",d:2,t:"Cross-site scripting (XSS)",def:"Injecting malicious script into a web page so it runs in other users' browsers",sc:"An attacker posts a comment containing a script tag that runs in every visitor's browser. What attack is this?",fix:"Input validation and output encoding",fixAvoid:["a1","a3"]},
  {id:"a3",g:"app",d:2,t:"Buffer overflow",def:"Writing more data into a memory buffer than it can hold, overwriting adjacent memory",sc:"An application crashes when a field receives far more characters than it expects, and the attacker gains code execution. What vulnerability is this?",fix:"Bounds checking and input validation in the code",fixAvoid:["a1","a2"]},
  {id:"a5",g:"app",d:2,t:"Race condition",def:"A flaw where the result depends on the timing between two operations, such as checking a value and then using it",sc:"Two transactions run at the same moment and both pass a balance check before either withdrawal is recorded. What vulnerability is this?",avoid:["a18"]},
  {id:"a13",g:"app",d:2,t:"Memory injection",def:"Writing malicious code into the memory of a running process so it runs inside that process",sc:"Malware writes its code into the memory of a trusted running process so it runs under that process's name. What attack is this?"},
  {id:"a14",g:"app",d:2,t:"Directory traversal",def:"Using ../ sequences in input to reach files outside the folder an application meant to allow",sc:"A request for /download?file=../../../../etc/passwd returns the server's account file. What attack is this?"},
  {id:"a15",g:"app",d:2,t:"Privilege escalation",def:"Gaining higher permissions than an account was given",sc:"A standard user exploits a flaw in a service to get administrator rights on the server. What attack is this?"},
  {id:"a18",g:"app",d:2,t:"Time-of-check to time-of-use (TOCTOU)",def:"A race condition where a resource changes between the moment it is checked and the moment it is used",sc:"A program checks that a file is safe, but an attacker swaps the file before the program opens it. What specific flaw is this?"},
  {id:"a4",g:"plat",d:2,t:"Zero-day vulnerability",def:"A flaw unknown to the vendor, so no patch exists yet",sc:"Attackers exploit a flaw that the software maker has not discovered and has no fix for. What is it called?"},
  {id:"a17",g:"plat",d:2,t:"Malicious update",def:"A software update that was tampered with so that it delivers malware",sc:"Attackers break into a vendor's update server, and customers install a backdoored patch. What vulnerability is this?",fix:"Verifying the digital signature on every update"},
  {id:"a19",g:"plat",d:2,t:"Sideloading",def:"Installing apps from outside the official app store",sc:"A user installs an Android app from a website instead of the Play Store. What is this called?"},
  {id:"a20",g:"plat",d:2,t:"Jailbreaking",def:"Removing a mobile operating system's built-in restrictions to get full control of the device",sc:"A user removes Apple's restrictions from an iPhone to install unapproved apps and tweaks. What is this called?"},
  {id:"a21",g:"plat",d:2,t:"Misconfiguration",def:"An insecure setting, such as an open cloud storage bucket or a default left in place",sc:"A cloud storage bucket holding customer files was set to allow public access. What type of vulnerability is this?"},
  {id:"a22",g:"plat",d:2,t:"Virtual machine escape",def:"Breaking out of a virtual machine to reach the hypervisor or other virtual machines",sc:"Malware in one guest VM exploits a flaw to run code on the host's hypervisor. What attack is this?"},
  {id:"a23",g:"plat",d:2,t:"Resource reuse",def:"Leftover data in memory or storage that is handed to a new virtual machine or user",sc:"A new cloud VM is given disk space that still holds another customer's old data. What virtualization vulnerability is this?"},
  {id:"a6",g:"mal",d:2,t:"Ransomware",def:"Malware that encrypts files and demands payment for the decryption key",sc:"Files across a file server are encrypted and a note demands cryptocurrency. What malware is this?",fix:"Offline backups and endpoint protection",fixAvoid:["a25"]},
  {id:"a7",g:"mal",d:2,t:"Logic bomb",def:"Malicious code that runs when a specific condition or date is met",sc:"Code planted by a former administrator deletes the payroll database when his account is removed. What is this?"},
  {id:"a8",g:"mal",d:2,t:"Rootkit",def:"Malware that hides deep in the operating system to keep privileged access and avoid detection",sc:"Malware modifies the operating system kernel so that its files and processes do not appear in normal tools. What is it?"},
  {id:"a9",g:"mal",d:2,t:"Keylogger",def:"Malware or hardware that records keystrokes to capture credentials",sc:"A small device between a keyboard and a PC records everything typed. What is it?",avoid:["a27"]},
  {id:"a24",g:"mal",d:2,t:"Trojan",def:"Malware disguised as legitimate software",sc:"A free game download secretly installs a backdoor along with the game. What malware is this?"},
  {id:"a25",g:"mal",d:2,t:"Worm",def:"Malware that spreads across a network by itself, with no user action",sc:"Malware spreads from server to server through an unpatched network service without anyone opening anything. What is it?",fix:"Patching and network segmentation",fixAvoid:["a6"]},
  {id:"a26",g:"mal",d:2,t:"Virus",def:"Malware that attaches to files or programs and spreads when a user runs or shares them",sc:"Malicious code attaches itself to programs and spreads each time users run and share those programs. What is it?"},
  {id:"a27",g:"mal",d:2,t:"Spyware",def:"Malware that secretly gathers information about a user's activity",sc:"Hidden software tracks a user's browsing and sends it to a third party. What malware is this?"},
  {id:"a28",g:"mal",d:2,t:"Bloatware",def:"Unneeded software that comes preinstalled by the manufacturer and can add vulnerabilities",sc:"A new laptop comes with trial apps and utilities the user never asked for. What are they called?"},
  {id:"a10",g:"net",d:2,t:"Password spraying",def:"Trying a few common passwords against many accounts to avoid lockouts",sc:"Logs show one failed login for each of hundreds of accounts, all with the password Spring2026!. What attack is this?",fix:"Multifactor authentication",fixAvoid:["a31"]},
  {id:"a11",g:"net",d:2,t:"On-path attack",def:"An attacker secretly intercepts and possibly alters traffic between two parties",sc:"An attacker on a café's Wi-Fi relays and reads traffic between a user and a website. What attack is this?",fix:"Encrypted protocols such as TLS",fixAvoid:["a37"]},
  {id:"a12",g:"net",d:2,t:"Distributed denial of service (DDoS)",def:"Many compromised systems flood a target so legitimate users cannot reach it",sc:"Thousands of infected devices flood a company's website with traffic until it stops responding. What attack is this?",fix:"Upstream traffic filtering from a DDoS protection service",avoid:["a33"]},
  {id:"a16",g:"net",d:2,t:"Replay attack",def:"Capturing valid data, such as a login exchange or token, and sending it again later",sc:"An attacker records a valid login exchange and sends it again later to log in as the user. What attack is this?",fix:"Timestamps and one-time session tokens"},
  {id:"a31",g:"net",d:2,t:"Brute-force attack",def:"Trying every possible password against an account until one works",sc:"An attacker tries thousands of passwords against one admin account until one works. What attack is this?",fix:"Account lockout after repeated failed attempts",fixAvoid:["a10"]},
  {id:"a32",g:"net",d:2,t:"DNS poisoning",def:"Corrupting DNS records or caches so names resolve to an attacker's address",sc:"Users who type the bank's correct address are sent to a fake site because a DNS server's cache was corrupted. What attack is this?",fix:"DNSSEC"},
  {id:"a33",g:"net",d:2,t:"Amplification attack",def:"Sending small requests with a spoofed source address to services that send much larger replies to the victim",sc:"Attackers send small DNS queries with the victim's address spoofed, and open resolvers flood the victim with large replies. What attack is this?"},
  {id:"a34",g:"phys",d:2,t:"Evil twin",def:"A fake access point that copies a real network's name to lure users",sc:"An attacker sets up a hotspot named CoffeeShop-WiFi next to the real one and captures users' traffic. What is this?"},
  {id:"a35",g:"phys",d:2,t:"RFID cloning",def:"Copying the data from an RFID badge to make a working duplicate",sc:"An attacker stands near employees with a hidden reader and later opens doors with copies of their badges. What attack is this?"},
  {id:"a36",g:"phys",d:2,t:"Environmental attack",def:"Attacking the systems that keep equipment running, such as cooling or power",sc:"Attackers turn off a data center's cooling so its servers overheat. What type of physical attack is this?"},
  {id:"a37",g:"phys",d:2,t:"Downgrade attack",def:"Forcing a connection to use an older, weaker protocol version or cipher",sc:"An on-path attacker makes a browser and server fall back from TLS 1.3 to an old, weak version. What attack is this?",fix:"Disabling old protocol versions on servers",fixAvoid:["a11"]},
  {id:"a38",g:"phys",d:2,t:"Hash collision",def:"Two different inputs that produce the same hash value",sc:"An attacker crafts a malicious file with the same MD5 hash as a legitimate one. What is this called?",fix:"A stronger hashing algorithm such as SHA-256",avoid:["a39"]},
  {id:"a39",g:"phys",d:2,t:"Birthday attack",def:"Using the math of probability to find hash collisions much faster than trying every value",sc:"An attacker uses the same math that makes shared birthdays common in a small group to find two inputs with matching hashes. What attack is this?"},
  {id:"a40",g:"ind",d:2,t:"Impossible travel",def:"Logins for one account from places too far apart to travel between in the time",sc:"A user signs in from Chicago and, 20 minutes later, from Singapore. Which indicator is this?",avoid:["a41"]},
  {id:"a41",g:"ind",d:2,t:"Concurrent session usage",def:"One account logged in from several places at the same time",sc:"The same account has active sessions on three different computers at once, though the user has only one. Which indicator is this?"},
  {id:"a42",g:"ind",d:2,t:"Account lockout",def:"An account locks because of failed logins the user did not make",sc:"A user arrives in the morning to find her account locked after failed logins she never attempted. Which indicator is this?"},
  {id:"a43",g:"ind",d:2,t:"Missing logs",def:"Gaps or deleted entries in logs, often a sign that an attacker covered their tracks",sc:"The security log on a domain controller has no entries at all for six hours overnight. Which indicator is this?"},
  {id:"a44",g:"ind",d:2,t:"Out-of-cycle logging",def:"Log activity at unusual times, such as admin commands in the middle of the night",sc:"Logs show a service account running admin commands at 3 a.m. on a Sunday, when no jobs are scheduled. Which indicator is this?"},
  {id:"a45",g:"ind",d:2,t:"Resource consumption",def:"Unexplained spikes in CPU, memory, disk, or bandwidth use",sc:"A file server's outbound bandwidth spikes overnight although no backup is scheduled. Which indicator is this?"},
  {id:"a46",g:"ind",d:2,t:"Blocked content",def:"Security tools blocking attempts to reach known bad sites or files",sc:"A proxy log shows a workstation trying again and again to reach a known command-and-control domain and being blocked. Which indicator is this?"},
  {id:"a47",g:"ind",d:2,t:"Published or documented",def:"The organization's data or flaws already reported publicly, such as on a leak site",sc:"Company login credentials appear on a public paste site. Which indicator is this?"},
  {id:"a48",g:"mit",d:2,t:"Segmentation",def:"Dividing a network into separate zones so a breach in one cannot spread easily",sc:"Point-of-sale terminals are moved to their own VLAN, separate from the office network. Which mitigation is this?",avoid:["a49"]},
  {id:"a49",g:"mit",d:2,t:"Isolation",def:"Cutting a compromised or risky system off from everything else",sc:"An infected workstation is moved to a quarantine network that can reach nothing else. Which mitigation is this?"},
  {id:"a50",g:"mit",d:2,t:"Application allow list",def:"Letting only approved applications run",sc:"Only the applications IT approves can run on the point-of-sale terminals. Which mitigation is this?"},
  {id:"a51",g:"mit",d:2,t:"Patching",def:"Installing vendor updates that fix known vulnerabilities",sc:"A vendor releases a fix for a critical flaw, and IT installs it on every affected server. Which mitigation is this?"},
  {id:"a52",g:"mit",d:2,t:"Configuration enforcement",def:"Automatically checking and reapplying approved settings so systems do not drift",sc:"A management tool checks every laptop daily and resets any setting that differs from the approved baseline. Which mitigation is this?"},
  {id:"a53",g:"mit",d:2,t:"Decommissioning",def:"Retiring a system securely: wiping its data and removing it from the network",sc:"An old server is wiped, removed from the domain, and unplugged from the network. Which mitigation is this?"},
  {id:"a54",g:"mit",d:2,t:"Host-based firewall",def:"A firewall on the device itself that controls its own inbound and outbound traffic",sc:"Each laptop runs its own firewall that blocks inbound connections, even on hotel Wi-Fi. Which hardening technique is this?"},
  {id:"a55",g:"mit",d:2,t:"Disabling ports and protocols",def:"Turning off network ports and protocols that are not needed",sc:"An admin turns off Telnet and FTP on a switch and shuts down its unused ports. Which hardening technique is this?"},
  {id:"a56",g:"mit",d:2,t:"Removing unnecessary software",def:"Uninstalling software that is not needed, which shrinks the attack surface",sc:"Before deployment, a technician uninstalls games and trial apps from a new laptop. Which hardening technique is this?"}
 ]},
 arch:{need:2,groups:[["model","Architecture models","Models"],["infra","Securing infrastructure","Infrastructure"],["data","Protecting data","Data"],["res","Sites & high availability","Resilience"],["backup","Backups, power & testing","Recovery"]],items:[
  {id:"r1",g:"model",d:3,t:"Infrastructure as code (IaC)",def:"Defining servers and networks in configuration files so they deploy the same way every time",sc:"Every server is built from version-controlled template files, so all deployments are identical. What practice is this?"},
  {id:"r2",g:"model",d:3,t:"Microservices",def:"An application built as small, independent services that communicate through APIs",sc:"An online store is split into separate services for search, cart, and payment that talk over APIs. What architecture is this?"},
  {id:"r3",g:"model",d:3,t:"Serverless",def:"Running code in the cloud without managing servers; the provider runs it on demand",sc:"A developer uploads a function that runs only when an image is uploaded, without managing any server. What model is this?"},
  {id:"r4",g:"model",d:3,t:"Air gap",def:"Physically isolating a system from every other network",sc:"A control system for a power plant has no physical connection to any other network. What is this called?"},
  {id:"r13",g:"model",d:3,t:"Responsibility matrix",def:"A chart showing which security tasks the cloud provider handles and which the customer handles",sc:"A cloud contract includes a chart showing that the provider patches the hypervisor and the customer patches its own VMs. What is this chart?"},
  {id:"r14",g:"model",d:3,t:"Hybrid cloud",def:"A mix of on-premises or private cloud and public cloud that work together",sc:"A company keeps its database in its own data center but runs its website in a public cloud. Which cloud model is this?"},
  {id:"r15",g:"model",d:3,t:"Containerization",def:"Packaging an app with everything it needs to run in an isolated container that shares the host's operating system kernel",sc:"Developers package an app with its libraries so it runs the same on any host, sharing the host's kernel. What is this?"},
  {id:"r16",g:"model",d:3,t:"Virtualization",def:"Running several virtual machines, each with its own operating system, on one physical host through a hypervisor",sc:"One physical server runs ten separate operating systems, each in its own VM. What technology is this?"},
  {id:"r17",g:"model",d:3,t:"Software-defined networking (SDN)",def:"Separating network control from the forwarding hardware so the network is managed centrally in software",sc:"Paths across every switch are configured from one central controller instead of device by device. What is this?"},
  {id:"r18",g:"model",d:3,t:"Industrial control system (ICS/SCADA)",def:"Systems that monitor and control industrial processes such as power plants, pipelines, and water treatment",sc:"A water utility uses one system to monitor and control pumps at many remote stations. What type of system is this?"},
  {id:"r19",g:"model",d:3,t:"Real-time operating system (RTOS)",def:"An operating system that must respond to events within strict time limits, used in embedded devices",sc:"A car's braking controller runs an operating system that must respond within milliseconds every time. What type of operating system is this?"},
  {id:"r20",g:"model",d:3,t:"Internet of Things (IoT)",def:"Everyday network-connected devices such as cameras, thermostats, and sensors",sc:"Smart thermostats and lights in an office connect to the network and are controlled from a phone app. What category of device are they?"},
  {id:"r21",g:"infra",d:3,t:"Jump server",def:"A hardened server that admins connect to first and then use to manage systems in a secure zone",sc:"Admins must log in to one hardened server before they can reach any server in the secure network. What is that server?"},
  {id:"r22",g:"infra",d:3,t:"Proxy server",def:"A server that makes requests on behalf of clients, often filtering web traffic",sc:"All employee web traffic goes through a server that fetches pages on their behalf and blocks banned sites. What is it?"},
  {id:"r23",g:"infra",d:3,t:"Load balancer",def:"A device that spreads traffic across several servers for performance and availability",sc:"Incoming web requests are shared across six web servers so that none is overloaded. Which device does this?"},
  {id:"r24",g:"infra",d:3,t:"Web application firewall (WAF)",def:"A firewall that inspects HTTP traffic to block web attacks such as SQL injection and cross-site scripting",sc:"A device in front of a web app blocks requests that contain SQL injection patterns. What is it?"},
  {id:"r25",g:"infra",d:3,t:"Unified threat management (UTM)",def:"One appliance that combines a firewall, intrusion prevention, antivirus, and content filtering",sc:"A small office buys one device that provides a firewall, intrusion prevention, antivirus, and web filtering. What is it?"},
  {id:"r26",g:"infra",d:3,t:"Fail-closed",def:"When a security device fails, it blocks all traffic, putting security ahead of availability",sc:"When the firewall crashes, no traffic passes at all until it is restored. What failure mode is this?"},
  {id:"r27",g:"infra",d:3,t:"Fail-open",def:"When a device fails, traffic keeps passing without inspection, putting availability ahead of security",sc:"When the intrusion prevention system crashes, traffic keeps flowing without being inspected. What failure mode is this?"},
  {id:"r28",g:"infra",d:3,t:"Screened subnet",def:"A network zone between the internet and the internal network that holds public-facing servers; formerly called a DMZ",sc:"The company's public web and mail servers sit in a separate zone between two firewalls. What is this zone?"},
  {id:"r29",g:"infra",d:3,t:"802.1X",def:"Port-based network access control: a device must authenticate before the switch port or access point passes its traffic",sc:"A switch port stays blocked until the connected laptop authenticates through a RADIUS server. Which standard is this?"},
  {id:"r30",g:"infra",d:3,t:"Secure access service edge (SASE)",def:"A cloud service that combines networking and security, such as SD-WAN and a secure web gateway, for users anywhere",sc:"A company replaces its branch firewalls and VPN with one cloud service that secures users wherever they work. What is this approach?"},
  {id:"r5",g:"data",d:3,t:"Data masking",def:"Hiding part of a value when it is displayed, such as showing only the last four digits of a card",sc:"A support screen shows a customer's card number as XXXX-XXXX-XXXX-4421. What technique is this?",avoid:["r6"]},
  {id:"r6",g:"data",d:3,t:"Tokenization",def:"Replacing sensitive data with a random token that maps back to the original in a secured vault",sc:"Card numbers in the order database are replaced with random values, and the real numbers live in a separate vault. What technique is this?",avoid:["r5"]},
  {id:"r7",g:"data",d:3,t:"Data sovereignty",def:"Data is subject to the laws of the country where it is stored",sc:"A company must keep EU customer data in EU data centers because of the laws that apply there. Which concept is this?"},
  {id:"r8",g:"data",d:3,t:"Data at rest",def:"Data stored on a disk, database, or backup and not currently moving or in use",sc:"Full-disk encryption on a laptop protects which state of data?",avoid:["r31","r32"]},
  {id:"r31",g:"data",d:3,t:"Data in transit",def:"Data moving across a network",sc:"TLS protects which state of data?"},
  {id:"r32",g:"data",d:3,t:"Data in use",def:"Data being processed in memory or by the CPU",sc:"A secure enclave protects data while an application is actively processing it in memory. Which state of data is this?"},
  {id:"r33",g:"data",d:3,t:"Geographic restrictions",def:"Limiting access to data or systems based on location",sc:"Logins to the HR system are blocked when they come from outside the country. Which data protection method is this?"},
  {id:"r34",g:"data",d:3,t:"Trade secret",def:"Confidential business information that gives a competitive edge, such as a formula or process",sc:"A soft-drink maker guards its secret recipe. What type of data is the recipe?"},
  {id:"r35",g:"data",d:3,t:"Regulated data",def:"Data whose handling is controlled by law or regulation, such as health records or payment card data",sc:"Patient records must be protected under HIPAA. What type of data are they?"},
  {id:"r9",g:"res",d:3,t:"Hot site",def:"A fully equipped, running recovery site that can take over almost immediately",sc:"A recovery site runs with current data and can take over within minutes. What type of site is it?",avoid:["r10","r11"]},
  {id:"r10",g:"res",d:3,t:"Warm site",def:"A recovery site with some equipment ready that needs time to become fully operational",sc:"A recovery site has servers installed but needs the latest data restored before use. What type of site is it?",avoid:["r9","r11"]},
  {id:"r11",g:"res",d:3,t:"Cold site",def:"A recovery location with space and power but little or no equipment ready",sc:"A recovery location has power and empty racks, so equipment must be brought in after a disaster. What type of site is it?",avoid:["r9","r10"]},
  {id:"r12",g:"res",d:3,t:"Geographic dispersion",def:"Placing sites far enough apart that a single disaster cannot affect all of them",sc:"A company puts its backup data center 600 miles from headquarters so one hurricane cannot take out both. What is this called?"},
  {id:"r36",g:"res",d:3,t:"Clustering",def:"Several servers working together as one system, so another takes over if one fails",sc:"Two database servers share storage, and if one fails the other takes over its work automatically. What is this?"},
  {id:"r37",g:"res",d:3,t:"Platform diversity",def:"Using different operating systems or vendors so one flaw cannot take down everything",sc:"A company runs its DNS on both Linux and Windows servers so one operating system flaw cannot stop all name resolution. What is this?"},
  {id:"r38",g:"res",d:3,t:"Multi-cloud",def:"Using more than one cloud provider so the business does not depend on any single one",sc:"A company runs the same application on two different cloud providers so an outage at one does not stop it. What is this?"},
  {id:"r39",g:"res",d:3,t:"Capacity planning",def:"Making sure there are enough people, technology, and infrastructure to meet demand and survive disruptions",sc:"Before a holiday sale, IT confirms there are enough servers and staff to handle triple the normal traffic. What is this?"},
  {id:"r40",g:"backup",d:3,t:"Snapshot",def:"A point-in-time copy of a virtual machine or volume that can be rolled back to quickly",sc:"Before patching, an admin captures a point-in-time copy of the VM so it can be rolled back in seconds. What is this?"},
  {id:"r41",g:"backup",d:3,t:"Replication",def:"Copying data continuously or nearly continuously to another system or site",sc:"Every change to the main database is copied within seconds to a server at the recovery site. What is this?"},
  {id:"r42",g:"backup",d:3,t:"Journaling",def:"Writing every change to a log first, so data can be rebuilt after a crash",sc:"A database writes every change to a log before applying it, so after a crash it can replay the log. What is this?"},
  {id:"r43",g:"backup",d:3,t:"Offsite backup",def:"Backup copies kept at a different location from the original data",sc:"Weekly backup tapes are taken to a vault across town so one fire cannot destroy both copies. What is this?"},
  {id:"r44",g:"backup",d:3,t:"Uninterruptible power supply (UPS)",def:"Battery power that keeps equipment running through short outages and lets it shut down cleanly",sc:"When the power flickers, the servers keep running for 15 minutes on batteries. What provides this?"},
  {id:"r45",g:"backup",d:3,t:"Generator",def:"Fuel-powered equipment that supplies power during long outages",sc:"A data center can keep running for days on its own fuel-powered equipment during a regional power outage. What provides this?"},
  {id:"r46",g:"backup",d:3,t:"Tabletop exercise",def:"Talking through a disaster scenario around a table without touching any systems",sc:"Department heads meet in a conference room and talk through how they would respond to a flood, step by step. What type of test is this?"},
  {id:"r47",g:"backup",d:3,t:"Failover test",def:"Deliberately switching to the backup system to prove it can take over",sc:"IT shuts down the main data center's links on purpose to confirm the recovery site takes over. What type of test is this?"},
  {id:"r48",g:"backup",d:3,t:"Parallel processing",def:"Running the recovery system alongside production on the same work to confirm it produces the same results",sc:"The recovery site processes the same transactions as production for a week so results can be compared. What type of test is this?"}
 ]},
 ops:{need:2,groups:[["harden","Hardening & secure coding","Hardening"],["mobile","Mobile devices","Mobile"],["asset","Asset management","Assets"],["vm","Vulnerability management","Vulns"],["mon","Monitoring & alerting","Monitoring"],["ent","Enterprise security tools","Tools"],["auto","Automation & orchestration","Automation"]],items:[
  {id:"o1",g:"harden",d:4,t:"Hardening",def:"Reducing the attack surface by removing unneeded services, closing ports, and changing defaults",sc:"Before deployment, an admin disables unused services and changes all default passwords. What is this process called?"},
  {id:"o4",g:"harden",d:4,t:"Sandboxing",def:"Running untrusted code in an isolated environment so it cannot affect the real system",sc:"An email attachment is opened in an isolated virtual environment to watch what it does. What technique is this?"},
  {id:"o13",g:"harden",d:4,t:"Secure baseline",def:"A documented set of approved security settings that systems are built to and checked against",sc:"Every new server is built from a documented set of approved security settings and checked against it each month. What is that set of settings?"},
  {id:"o14",g:"harden",d:4,t:"WPA3",def:"The current Wi-Fi security standard, which uses SAE to resist offline password cracking",sc:"A new office wireless network should use the strongest current Wi-Fi security standard. Which should it use?"},
  {id:"o15",g:"harden",d:4,t:"Input validation",def:"Checking that input matches what is expected before an application uses it",sc:"A web form rejects any ZIP code that is not exactly five digits. Which secure coding technique is this?"},
  {id:"o16",g:"harden",d:4,t:"Static code analysis",def:"Reviewing source code for flaws without running it",sc:"A tool scans an application's source code for security flaws before it is ever compiled. What is this?"},
  {id:"o17",g:"harden",d:4,t:"Code signing",def:"Digitally signing software so users can confirm who published it and that it was not changed",sc:"Before installing a driver, Windows checks that it was signed by the hardware maker and has not been altered. What makes this possible?"},
  {id:"o18",g:"harden",d:4,t:"Sanitized output (output encoding)",def:"Converting special characters in output so a browser shows them as text instead of running them",sc:"A web app converts < and > to safe codes before showing user comments, so injected scripts appear as plain text. What technique is this?"},
  {id:"o3",g:"mobile",d:4,t:"Mobile device management (MDM)",def:"Centrally enforces security policies on phones and tablets, such as screen locks and remote wipe",sc:"IT requires a PIN on every company phone and can wipe a lost one remotely. Which solution provides this?"},
  {id:"o19",g:"mobile",d:4,t:"Bring your own device (BYOD)",def:"Employees use their own personal devices for work",sc:"Staff read work email on their personal phones, which the company manages with an app. Which deployment model is this?"},
  {id:"o20",g:"mobile",d:4,t:"Corporate-owned, personally enabled (COPE)",def:"The company owns the device and allows some personal use",sc:"The company buys phones for staff and lets them install personal apps as well. Which deployment model is this?"},
  {id:"o21",g:"mobile",d:4,t:"Choose your own device (CYOD)",def:"Employees pick a device from a list the company has approved",sc:"Staff pick one of three approved phone models, and the company provides the one they choose. Which deployment model is this?"},
  {id:"o22",g:"mobile",d:4,t:"Geofencing",def:"Changing what a device can do based on its location",sc:"Company phones turn off their cameras automatically inside the research lab. What is this?"},
  {id:"o23",g:"asset",d:4,t:"Asset inventory",def:"A tracked list of every hardware and software asset, with its owner and location",sc:"IT keeps a list of every laptop, server, and software license, with who is responsible for each. What is this?"},
  {id:"o24",g:"asset",d:4,t:"Enumeration",def:"Discovering every asset that exists, such as by scanning the network for devices",sc:"A network scan finds 40 devices that are not in the company's records. What asset management activity found them?",avoid:["o23"]},
  {id:"o25",g:"asset",d:4,t:"Sanitization",def:"Removing data from media so it cannot be recovered, such as by overwriting it, while the media can be reused",sc:"Before reselling old laptops, IT overwrites every drive so no data can be recovered. What is this?"},
  {id:"o26",g:"asset",d:4,t:"Destruction",def:"Physically destroying media, such as by shredding or degaussing, so it can never be used again",sc:"Failed hard drives that held patient data are fed through an industrial shredder. What is this?"},
  {id:"o27",g:"asset",d:4,t:"Certificate of destruction",def:"Documentation from a vendor proving that media was destroyed or sanitized",sc:"After destroying old drives, a vendor provides a signed document listing each serial number it destroyed. What is this document?"},
  {id:"o28",g:"asset",d:4,t:"Data retention",def:"Keeping data for the required period, then disposing of it",sc:"Financial records must be kept for seven years and then deleted. Which part of asset management is this?"},
  {id:"o5",g:"vm",d:4,t:"CVSS",def:"A standard scoring system that rates vulnerability severity from 0 to 10",sc:"A scan report rates a flaw 9.8, Critical. Which scoring system produced that number?",avoid:["o6"]},
  {id:"o6",g:"vm",d:4,t:"CVE",def:"A public list that gives each known vulnerability a unique identifier",sc:"A vulnerability is referenced as CVE-2024-3094 in vendor advisories. What provides that identifier?",avoid:["o5"]},
  {id:"o7",g:"vm",d:4,t:"False positive",def:"A scan or alert reports a problem that does not actually exist",sc:"A scanner flags a server for a flaw in software that is not installed on it. What is this result?",avoid:["o8"]},
  {id:"o8",g:"vm",d:4,t:"False negative",def:"A scan or alert misses a problem that really exists",sc:"A scan reports a server as clean, but it is later found to have an unpatched critical flaw. What was the scan result?",avoid:["o7"]},
  {id:"o29",g:"vm",d:4,t:"Vulnerability scan",def:"An automated check of systems for known flaws and missing patches",sc:"A tool checks every server weekly for missing patches and known flaws, then produces a report. What is this?"},
  {id:"o30",g:"vm",d:4,t:"Credentialed scan",def:"A vulnerability scan that logs in to systems so it can find more detailed issues",sc:"A scanner is given an admin account so it can check the installed patches on each server. What kind of scan is this?"},
  {id:"o31",g:"vm",d:4,t:"Bug bounty program",def:"Paying outside researchers who find and responsibly report vulnerabilities",sc:"A company pays $5,000 to a researcher who privately reported a flaw in its website. What program is this?"},
  {id:"o32",g:"vm",d:4,t:"Threat feed",def:"A regularly updated stream of threat intelligence, such as malicious IP addresses and domains",sc:"The firewall automatically pulls a list of known malicious IP addresses from an intelligence provider every hour. What is the source?"},
  {id:"o33",g:"vm",d:4,t:"Package monitoring",def:"Tracking the third-party libraries an application uses for newly found vulnerabilities",sc:"A tool alerts developers when a library their app depends on has a newly published vulnerability. What is this?"},
  {id:"o34",g:"vm",d:4,t:"Rescanning",def:"Scanning again after a fix to confirm the vulnerability is gone",sc:"After patching, the team runs the scan again to confirm the flaw is gone. What step is this?"},
  {id:"o35",g:"vm",d:4,t:"Exception",def:"Formal, documented approval to leave a vulnerability unfixed, usually with a review date",sc:"A legacy system cannot be patched, so management signs off on leaving it as it is until next year's review. What is this?"},
  {id:"o9",g:"mon",d:4,t:"SIEM",def:"Collects and correlates logs from many sources to detect and alert on security events",sc:"Firewall, server, and endpoint logs are sent to one system that correlates them and raises alerts. What is the system?",avoid:["o10","o38"]},
  {id:"o10",g:"mon",d:4,t:"SOAR",def:"Automates the response to security events using playbooks",sc:"When a phishing alert fires, a playbook automatically blocks the sender and quarantines the email. Which tool runs it?",avoid:["o9"]},
  {id:"o11",g:"mon",d:4,t:"Data loss prevention (DLP)",def:"Detects and blocks sensitive data from leaving the organization",sc:"An email with customer Social Security numbers is blocked before it leaves the company. Which control blocked it?"},
  {id:"o12",g:"mon",d:4,t:"File integrity monitoring (FIM)",def:"Alerts when critical system or application files change",sc:"An alert fires when a system configuration file on a web server is modified. Which tool raised it?"},
  {id:"o36",g:"mon",d:4,t:"SNMP trap",def:"An alert a network device sends on its own when something happens, such as a link going down",sc:"A switch immediately sends a message to the monitoring server when one of its interfaces goes down. What is this message?"},
  {id:"o37",g:"mon",d:4,t:"NetFlow",def:"Records of traffic flows: which hosts talked, when, and how much data they sent, without the contents",sc:"An analyst sees which internal hosts sent the most data to the internet yesterday, without capturing any packet contents. Which data source is this?"},
  {id:"o38",g:"mon",d:4,t:"Log aggregation",def:"Collecting logs from many systems into one place",sc:"Logs from 200 servers are all forwarded to one central store so they can be searched together. What is this?"},
  {id:"o39",g:"mon",d:4,t:"Alert tuning",def:"Adjusting alert rules to cut false positives without missing real events",sc:"Analysts adjust a rule that fires hundreds of harmless alerts a day so it fires only on real problems. What is this?"},
  {id:"o40",g:"mon",d:4,t:"Quarantine",def:"Isolating a suspicious file or device so it can do no harm while it is examined",sc:"Antivirus moves a suspicious attachment into a protected folder where it cannot run. What is this?"},
  {id:"o41",g:"mon",d:4,t:"Archiving",def:"Storing older logs and data long-term for compliance and investigations",sc:"Logs older than 90 days are moved to low-cost storage and kept for seven years. What is this?"},
  {id:"o2",g:"ent",d:4,t:"Endpoint detection and response (EDR)",def:"Monitors endpoints for suspicious behavior and can respond automatically, such as by isolating a host",sc:"A tool on each laptop spots ransomware-like behavior and isolates the laptop from the network. What is the tool?",avoid:["o48"]},
  {id:"o42",g:"ent",d:4,t:"DNS filtering",def:"Blocking access to malicious or banned domains at the DNS lookup",sc:"Lookups for known phishing domains return a block page for every device on the network. What control is this?"},
