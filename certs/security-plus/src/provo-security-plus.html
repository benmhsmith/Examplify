      <p style="margin:.4em 0">${nowM.length?`Newly mastered: <b>${nowM.map(x=>esc(QUAL_GROUPS[x.k].q)).join(", ")}</b>.`:"No new qualifiers mastered this set."} ${qualState().filter(x=>x.mastered).length} of ${QUAL_GROUPS.length} mastered overall.</p>
      ${S.missed.length?`<h4 style="margin:14px 0 6px">Review these qualifiers</h4><dl style="margin:0">${S.missed.map(k=>`<dt style="font-weight:700;margin-top:.6em"><mark>${esc(QUAL_GROUPS[k].q)}</mark></dt><dd style="margin:.2em 0 0 0" class="note">${esc(QUAL_GROUPS[k].rule)}</dd>`).join("")}</dl>`:""}
      <div class="q-actions" style="margin-top:14px"><button class="btn" id="qagain">Another set of ${N}</button><button class="btn ghost" id="qref2">View the guide</button><button class="btn ghost" id="qmenu">Qualifier menu</button></div></div>`;
      $("#qagain").addEventListener("click",()=>drill(N)); $("#qref2").addEventListener("click",ref); $("#qmenu").addEventListener("click",menu);
    }
    next();
  }
  menu();
}

const TOOL_NEED=3;
/* ---- Typed answers ----
   For "Type the answer" activities. A reply matches a term when, after normalizing, it equals the term, the
   term without its bracketed acronym, the acronym, or one of the term's alternatives (alt). Normalizing ignores
   case, spaces, punctuation, a/an/the, a final word "control", and a trailing s. Small typos are
   accepted (1 letter in 6+, 2 in 10+) and the correct spelling is shown. */
function tyRaw(s){ return String(s).toLowerCase().replace(/\b(a|an|the)\s+/g," ").trim().replace(/\s+controls?$/,"").replace(/[^a-z0-9]+/g,""); }
function tyNorm(s){ return tyRaw(s).replace(/s$/,""); }
function tyForms(it){ const f=[it.t, it.t.replace(/\s*\([^)]*\)/g,"")]; const m=it.t.match(/\(([^)]+)\)/); if(m) f.push(m[1]); return [...new Set(f.concat(it.alt||[]).map(tyNorm).filter(Boolean))]; }
function tyDist(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let prev=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const tmp=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=tmp; } } return d[b.length]; }
/* 2 = exact, 1 = close typo, 0 = no match */
function tyMatch(v,it){ const n=tyNorm(v); if(!n) return 0; if(tyForms(it).includes(n)) return 2;
  const raw=tyRaw(v), forms=[it.t, it.t.replace(/\s*\([^)]*\)/g,"")].concat(it.alt||[]).map(tyRaw);
  return forms.some(f=>{ const tol=f.length>=10?2:f.length>=6?1:0; return tol&&Math.abs(f.length-raw.length)<=tol&&tyDist(f,raw)<=tol; })?1:0; }
/* ---- Hands-on labs inside term modules ----
   A module lists its labs in TERMSETS[mod].labs. Getting a whole lab task right on the first check gives each
   linked term one kind of credit ("lab"), the same as answering one question about it. */
function labCredit(mod,ids){
  if(mode!=="student") return;
  P.termM=P.termM||{}; const b=(P.termM[mod]=P.termM[mod]||{});
  ids.forEach(id=>{ (b[id]=b[id]||{}).lab=1; if(termMastered(mod,id)){ P.termDone=P.termDone||{}; (P.termDone[mod]=P.termDone[mod]||{})[id]=true; } });
  save();
}
function labDone(mod,lab){ P.labs=P.labs||{}; const m=(P.labs[mod]=P.labs[mod]||{}); return (m[lab]=m[lab]||{}); }

/* Drag and drop that also works by tapping: tap (or press Enter on) a tile, then tap a target.
   Tiles: .dd-tile[data-v]. Targets: .dd-target. onDrop(target, value, tileEl). */
function ddWire(root,onDrop){
  let sel=null, drag=null;
  const clearSel=()=>{ root.querySelectorAll(".dd-tile.sel").forEach(x=>x.classList.remove("sel")); sel=null; root.classList.remove("dd-armed"); };
  const choose=el=>{ const was=sel===el; clearSel(); if(!was){ sel=el; el.classList.add("sel"); root.classList.add("dd-armed"); } };
  root.addEventListener("click",e=>{
    const tile=e.target.closest(".dd-tile"); const tgt=e.target.closest(".dd-target");
    if(drag&&drag.moved) return;
    if(tile&&root.contains(tile)){ choose(tile); return; }
    if(tgt&&sel){ const v=sel.dataset.v, el=sel; clearSel(); onDrop(tgt,v,el); return; }
    if(tgt&&!sel&&tgt.dataset.clear!==undefined){ onDrop(tgt,null,null); }
  });
  root.addEventListener("pointerdown",e=>{
    const tile=e.target.closest(".dd-tile"); if(!tile||e.button>0) return;
    drag={tile,x:e.clientX,y:e.clientY,moved:false,ghost:null,id:e.pointerId};
    try{ tile.setPointerCapture(e.pointerId); }catch(err){}
  });
  root.addEventListener("pointermove",e=>{
    if(!drag||e.pointerId!==drag.id) return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
    if(!drag.moved){ drag.moved=true; clearSel(); const g=drag.tile.cloneNode(true); g.classList.add("dd-ghost"); document.body.appendChild(g); drag.ghost=g; drag.tile.classList.add("dd-src"); }
    drag.ghost.style.left=(e.clientX+8)+"px"; drag.ghost.style.top=(e.clientY+8)+"px";
    root.querySelectorAll(".dd-target.over").forEach(x=>x.classList.remove("over"));
    const under=document.elementFromPoint(e.clientX,e.clientY); const t=under&&under.closest(".dd-target"); if(t&&root.contains(t)) t.classList.add("over");
  });
  root.addEventListener("pointercancel",()=>{ if(drag&&drag.ghost){ drag.ghost.remove(); drag.tile.classList.remove("dd-src"); } drag=null; });
  root.addEventListener("pointerup",e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const d=drag; setTimeout(()=>{ if(drag===d) drag=null; },0);
    if(!d.moved) return;
    d.ghost.remove(); d.tile.classList.remove("dd-src"); root.querySelectorAll(".dd-target.over").forEach(x=>x.classList.remove("over"));
    const under=document.elementFromPoint(e.clientX,e.clientY); const t=under&&under.closest(".dd-target");
    if(t&&root.contains(t)) onDrop(t,d.tile.dataset.v,d.tile);
  });
}

      let wrong=0; root.querySelectorAll(".mp-slot").forEach(el=>{ const ok=fill[el.dataset.i]===spots[+el.dataset.i].v; el.classList.add(ok?"ok":"bad"); if(!ok) wrong++; });

    <div class="card" id="ph"><p style="margin:0 0 10px">${esc(intro)}</p>${card}
      <div class="q-actions" style="margin-top:12px">${buttons}<button class="btn ghost" id="phnext" hidden>Next</button></div>

    });
    const grade=v=>{
      const flagged=[...root.querySelectorAll(".ph-seg.flag")].map(b=>+b.dataset.s); const red=segs.map((w,k)=>w?k:-1).filter(k=>k>=0);
      const found=red.filter(k=>flagged.includes(k)), missed=red.filter(k=>!flagged.includes(k)), extra=flagged.filter(k=>!segs[k]);
      const vOk=type==="urls"||(v==="phish")===(E.kind==="phish"); const all=vOk&&!missed.length&&!extra.length;
      root.querySelectorAll(".ph-seg").forEach(b=>{ const k=+b.dataset.s; if(segs[k]&&flagged.includes(k)) b.classList.add("hit"); else if(segs[k]) b.classList.add("miss"); else if(flagged.includes(k)) b.classList.add("extra"); });
      const text=k=>root.querySelector(`[data-s="${k}"]`).textContent;
      const lines=red.map(k=>`<li class="${flagged.includes(k)?"":"ph-missed"}"><b>${flagged.includes(k)?"Found":"Missed"}:</b> ${type==="urls"?`<code>${esc(text(k))}</code>. `:""}${esc(segs[k])}</li>`).join("")+extra.map(k=>`<li><b>Not a red flag:</b> "${esc(text(k))}" is ${type==="urls"?"a real address":"normal here"}.</li>`).join("");

        :`${vOk?(E.kind==="phish"?"Right: this is phishing.":"Right: this one is legitimate."):(E.kind==="phish"?"This one is phishing.":"This one is actually legitimate.")} ${E.kind==="phish"?`You found ${found.length===red.length?`all ${red.length}`:`${found.length} of ${red.length}`} red flags${extra.length?`, and flagged ${extra.length} part${extra.length>1?"s":""} that ${extra.length>1?"are":"is"} fine`:""}.`:extra.length?"Nothing in it was a red flag.":""}`;
      $("#phfb").hidden=false; $("#phfb").innerHTML=`<div class="v ${all?"ok":"bad"}">${head}</div>`+(lines?`<ul class="steps">${lines}</ul>`:"")+(E.why?`<p style="margin:.4em 0 0">${esc(E.why)}</p>`:"");
      checked=true; root.querySelectorAll("#phreport,#phkeep,#phurls").forEach(b=>b.hidden=true); $("#phnext").hidden=false; $("#phnext").textContent=i+1<order.length?"Next":"Start over";
      if(all&&mode==="student"){ done[E.id]=true; labCredit(mod,E.terms); }
    };
    root.querySelector("#phreport")?.addEventListener("click",()=>grade("phish")); root.querySelector("#phkeep")?.addEventListener("click",()=>grade("legit"));
    root.querySelector("#phurls")?.addEventListener("click",()=>grade(null));
    $("#phnext").addEventListener("click",()=>{ i++; if(i>=order.length){ order=shuffle(PHISH.slice()); i=0; } render(); });
    $("#labback").addEventListener("click",back);
  }
  render();
}

/* Pin board: a shared engine for "drag the right name onto each case" labs (Malware Lineup, Vulnerability Hunt).
   cfg: {key, title, intro, cases:[{id, cat, s}], cats:{key:[label, explanation]}, pick, extras, slotLabel, label, again} */
function labPins(mod,back,cfg){
  const done=labDone(mod,cfg.key);
  function render(){
    const cats=shuffle(Object.keys(cfg.cats)); const cases=[];
    cats.forEach(c=>{ if(cases.length<cfg.pick){ const pool=shuffle(cfg.cases.filter(x=>x.cat===c)); if(pool.length) cases.push(pool[0]); } });
    const used=new Set(cases.map(c=>c.cat)); const tiles=shuffle([...used].concat(shuffle(Object.keys(cfg.cats).filter(c=>!used.has(c))).slice(0,cfg.extras)));
    const fill={}; let checked=false, firstTry=true;
    app.innerHTML=modHead(M(mod))+`<div class="examtop"><button class="chipbtn" id="labback" type="button">← ${esc(M(mod).name)} menu</button><span>${esc(cfg.label)}${done.rounds?` · ${done.rounds} perfect round${done.rounds>1?"s":""}`:""}</span></div>
    <div class="card" id="pin"><h3 style="font-size:1.3rem;margin:0 0 4px">${esc(cfg.title)}</h3><p style="margin:0 0 12px">${esc(cfg.intro)}</p>
      <div class="mp-map">${cases.map((c,k)=>`<div class="mp-zone">${cfg.caseHead?cfg.caseHead(c):""}<p>${esc(c.s)}</p><button type="button" class="dd-target kf-slot mp-slot" data-i="${k}" data-clear><small>${esc(cfg.slotLabel)}</small><span class="kf-fill">Drop here</span></button></div>`).join("")}</div>
      <div class="kf-tray" style="margin-top:12px">${tiles.map(v=>`<button type="button" class="dd-tile srt-t" data-v="${v}">${esc(cfg.cats[v][0])}</button>`).join("")}</div>
      <div class="q-actions" style="margin-top:12px"><button class="btn" id="pincheck">Check</button><button class="btn ghost" id="pinnext" hidden>${esc(cfg.again)}</button></div>
      <div class="fb" id="pinfb" hidden></div></div>`;
    const root=$("#pin");
    const paint=()=>root.querySelectorAll(".mp-slot").forEach(el=>{ const v=fill[el.dataset.i]; el.classList.toggle("filled",!!v); el.classList.remove("ok","bad"); el.querySelector(".kf-fill").innerHTML=v?`<span class="srt-t" style="display:inline-block">${esc(cfg.cats[v][0])}</span>`:"Drop here"; });
    ddWire(root,(tgt,v)=>{ if(checked) return; fill[tgt.dataset.i]=v; paint(); });
    $("#pincheck").addEventListener("click",()=>{
      if(cases.some((c,k)=>!fill[k])){ $("#pinfb").hidden=false; $("#pinfb").innerHTML=`<div class="v bad">Put a tile on every case first.</div>`; return; }
      let wrong=0; root.querySelectorAll(".mp-slot").forEach(el=>{ const ok=fill[el.dataset.i]===cases[+el.dataset.i].cat; el.classList.add(ok?"ok":"bad"); if(!ok) wrong++; });
      $("#pinfb").hidden=false;
      if(wrong){ firstTry=false; $("#pinfb").innerHTML=`<div class="v bad">${wrong} wrong. Fix the red ones and check again.</div>`; return; }
      checked=true; $("#pincheck").hidden=true; $("#pinnext").hidden=false;
      $("#pinfb").innerHTML=`<div class="v ok">${firstTry?"All right on the first try.":"All right."}</div><ol class="steps">${cases.map(c=>`<li><b>${esc(cfg.cats[c.cat][0])}:</b> ${esc(c.x||cfg.cats[c.cat][1])}</li>`).join("")}</ol>`;
      if(firstTry&&mode==="student"){ done.rounds=(done.rounds||0)+1; labCredit(mod,[...new Set(cases.map(c=>c.id).filter(Boolean))]); }
    });
    $("#pinnext").addEventListener("click",render); $("#labback").addEventListener("click",back);
  }
  render();
}

  }

}

    ddWire(root,(tgt,v,el)=>{ if(checked||!el) return; const box=tgt.classList.contains("srt-bin")?tgt.querySelector(".srt-in"):tgt; el.classList.remove("ok","bad"); box.appendChild(el); });

      $("#bnfb").hidden=false;

      checked=true; $("#bncheck").hidden=true; $("#bnnext").hidden=false;
      $("#bnfb").innerHTML=`<div class="v ok">${firstTry?"Everything placed correctly on the first try.":"Everything is placed correctly."}</div><ol class="steps">${round.map(x=>`<li><b>${esc(x[0])}:</b> ${esc(x[2])}</li>`).join("")}</ol>`;
      if(firstTry&&mode==="student"){ done.rounds=(done.rounds||0)+1; labCredit(mod,cfg.credit); }
    });
    $("#bnnext").addEventListener("click",render); $("#labback").addEventListener("click",back);
  }
  render();
}

/* Order engine: drop each event of a story onto its step. With cfg.stages, each step has a name (and an optional
   note shown afterwards); without, steps are just numbered. cfg: {key,label,intro,stories:[{title,steps:[...]}],stages,credit,outro} */
function labOrder(mod,back,cfg){
  const done=labDone(mod,cfg.key); let si=Math.floor(Math.random()*cfg.stories.length);
  function render(){
    const S=cfg.stories[si]; const n=S.steps.length; const fill={}; let checked=false, firstTry=true;
    const name=j=>cfg.stages?cfg.stages[j][0]:`Step ${j+1}`;
    app.innerHTML=modHead(M(mod))+`<div class="examtop"><button class="chipbtn" id="labback" type="button">← ${esc(M(mod).name)} menu</button><span>${esc(cfg.label)}${cfg.stories.length>1?` · ${esc(S.title)}`:""}</span></div>
    <div class="card" id="kc"><h3 style="font-size:1.3rem;margin:0 0 4px">${esc(S.title)}</h3><p style="margin:0 0 12px">${esc(S.intro||cfg.intro)}</p>
      <div class="kc-chain">${S.steps.map((_,j)=>`<div class="kc-stage"><div class="kc-n">${j+1}</div><div style="flex:1;min-width:0">${cfg.stages?`<b>${esc(name(j))}</b>`:""}<button type="button" class="dd-target kf-slot kc-slot" data-k="${j}" data-clear><span class="kf-fill">Drop here</span></button></div></div>`).join("")}</div>
      <div class="kc-pool">${shuffle(S.steps.map((_,j)=>j)).map(j=>`<button type="button" class="dd-tile kc-ev" data-v="${j}">${esc(S.steps[j])}</button>`).join("")}</div>
      <div class="q-actions" style="margin-top:12px"><button class="btn" id="kccheck">Check</button><button class="btn ghost" id="kcnext" hidden>${cfg.stories.length>1?"Another one":"Try again"}</button></div>
      <div class="fb" id="kcfb" hidden></div></div>`;
    const root=$("#kc");
    const paint=()=>{ root.querySelectorAll(".kc-slot").forEach(el=>{ const v=fill[el.dataset.k]; el.classList.toggle("filled",v!==undefined); el.classList.remove("ok","bad"); el.querySelector(".kf-fill").textContent=v!==undefined?S.steps[v]:"Drop here"; });
      const used=new Set(Object.values(fill).map(String)); root.querySelectorAll(".kc-pool .kc-ev").forEach(b=>b.hidden=used.has(b.dataset.v)); };
    ddWire(root,(tgt,v)=>{ if(checked) return; const k=tgt.dataset.k; Object.keys(fill).forEach(x=>{ if(String(fill[x])===v) delete fill[x]; }); if(v!==null&&v!==undefined) fill[k]=+v; else delete fill[k]; paint(); });
    $("#kccheck").addEventListener("click",()=>{
      if(Object.keys(fill).length<n){ $("#kcfb").hidden=false; $("#kcfb").innerHTML=`<div class="v bad">Place all ${n} first.</div>`; return; }
      let wrong=0; root.querySelectorAll(".kc-slot").forEach(el=>{ const ok=fill[el.dataset.k]===+el.dataset.k; el.classList.add(ok?"ok":"bad"); if(!ok) wrong++; });
      $("#kcfb").hidden=false;
      if(wrong){ firstTry=false; $("#kcfb").innerHTML=`<div class="v bad">${wrong} in the wrong place. Fix the red ones and check again.</div>`; return; }
      checked=true; $("#kccheck").hidden=true; $("#kcnext").hidden=false;
      $("#kcfb").innerHTML=`<div class="v ok">${firstTry?"All in the right order on the first try.":"All in the right order."}</div>`+(cfg.stages&&cfg.stages[0][1]?`<ol class="steps">${cfg.stages.map(([a,b])=>`<li><b>${esc(a)}:</b> ${esc(b)}</li>`).join("")}</ol>`:"")+(S.outro||cfg.outro?`<p style="margin:.4em 0 0">${esc(S.outro||cfg.outro)}</p>`:"");
      if(firstTry&&mode==="student"){ done.rounds=(done.rounds||0)+1; labCredit(mod,cfg.credit); }
    });
    $("#kcnext").addEventListener("click",()=>{ si=(si+1)%cfg.stories.length; render(); }); $("#labback").addEventListener("click",back);
  }
  render();
}

function labRisk(mod,back){

      <p style="margin:0 0 10px">The asset is <b>${esc(asset)}</b>, worth <b>${money(av)}</b>. If <b>${esc(threat)}</b> happens, it loses <b>${ef}%</b> of its value. That is expected <b>${esc(phrase)}</b>.</p>

        <label>Single loss expectancy (SLE), in dollars<input class="ans" id="rksle" inputmode="decimal" autocomplete="off" placeholder="$"></label>
        <label>Annualized rate of occurrence (ARO), as a number<input class="ans" id="rkaro" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"></label>
        <label>Annualized loss expectancy (ALE), in dollars<input class="ans" id="rkale" inputmode="decimal" autocomplete="off" placeholder="$"></label>
      </div>
      <p style="margin:12px 0 6px">A control costs <b>${money(costR)} a year</b> and would make ${esc(threat)} happen only <b>${esc(phrase2)}</b>. Is it worth buying?</p>
      <div class="rk-yn"><label><input type="radio" name="rkw" value="yes"> Yes, it saves more than it costs</label><label><input type="radio" name="rkw" value="no"> No, it costs more than it saves</label></div>
      <div class="q-actions" style="margin-top:12px"><button class="btn" id="rkcheck">Check</button><button class="btn ghost" id="rknext" hidden>New scenario</button></div>
      <div class="fb" id="rkfb" hidden></div></div>`;
    $("#rkcheck").addEventListener("click",()=>{
      const s=num($("#rksle").value), r=num($("#rkaro").value), a=num($("#rkale").value), w=(document.querySelector('input[name="rkw"]:checked')||{}).value;
      if(s===null||r===null||a===null||!w){ $("#rkfb").hidden=false; $("#rkfb").innerHTML=`<div class="v bad">Fill in all three numbers and answer the last question.</div>`; return; }
      const okS=Math.abs(s-sle)<1, okR=Math.abs(r-aro)<0.001, okA=Math.abs(a-ale)<1, okW=(w==="yes")===worth;
      [["#rksle",okS],["#rkaro",okR],["#rkale",okA]].forEach(([id,ok])=>{ $(id).classList.toggle("ok",ok); $(id).classList.toggle("bad",!ok); });
      const all=okS&&okR&&okA&&okW;
      $("#rkfb").hidden=false; checked=true; $("#rkcheck").hidden=true; $("#rknext").hidden=false;
      $("#rkfb").innerHTML=`<div class="v ${all?"ok":"bad"}">${all?"All four right.":`${[okS,okR,okA,okW].filter(Boolean).length} of 4 right.`}</div><ol class="steps">
        <li><b>SLE</b> = asset value × exposure factor = ${money(av)} × ${ef}% = <b>${money(sle)}</b>${okS?"":" ✗"}</li>
        <li><b>ARO</b>: ${esc(phrase)} = <b>${aro}</b>${okR?"":" ✗"}</li>
        <li><b>ALE</b> = SLE × ARO = ${money(sle)} × ${aro} = <b>${money(ale)}</b>${okA?"":" ✗"}</li>
        <li><b>The control:</b> the new ALE is ${money(sle)} × ${aro2} = ${money(ale2)}, saving ${money(ale-ale2)} a year against a cost of ${money(costR)}. ${worth?"It is worth buying.":"It costs more than it saves, so accepting the risk makes more sense."}${okW?"":" ✗"}</li></ol>`;
      if(all&&mode==="student"){ done.rounds=(done.rounds||0)+1; labCredit(mod,["g24","g25","g9","g31"]); }
    });
    $("#rknext").addEventListener("click",render); $("#labback").addEventListener("click",back);
  }
  render();
}

/* ---- Term modules ----
   One engine runs every term module (TERMSETS). Each term is asked several ways: name it from a description,
   define it, spot it in a scenario, and, where the term has one, pick its best defense. A term is mastered once
   `need` different kinds of question about it are answered correctly; a wrong answer clears that term's credit
   until it is mastered. Mastery stays until Reset or Prestige. Progress: P.termM[module][term], P.termDone[module][term]. */
function termKeys(mod,id){ P.termM=P.termM||{}; return (P.termM[mod]||{})[id]||{}; }
function termMastered(mod,id){ return !!(P.termDone&&P.termDone[mod]&&P.termDone[mod][id]) || Object.keys(termKeys(mod,id)).length>=TERMSETS[mod].need; }
function termGroupState(mod){ const S=TERMSETS[mod]; return S.groups.map(([g,name,short])=>{ const rows=S.items.filter(x=>x.g===g); const c=rows.filter(x=>termMastered(mod,x.id)).length; return {g,name,short,n:rows.length,c,mastered:c===rows.length}; }); }
function termMastery(mod){ const S=TERMSETS[mod]; const done=S.items.filter(x=>termMastered(mod,x.id)).length;
  const v=S.items.reduce((a,x)=>a+(termMastered(mod,x.id)?1:Math.min(Object.keys(termKeys(mod,x.id)).length,S.need)/S.need),0)/S.items.length;
  return {v,cap:`${done} of ${S.items.length} terms mastered`}; }
function viewTerms(mod){
  const m=M(mod), S=TERMSETS[mod], ITEMS=S.items, NEED=S.need;
  const hasFix=ITEMS.filter(x=>x.fix).length>=4;
  const head=()=>modHead(m)+`<p class="note" style="margin:-8px 0 14px;max-width:75ch">Each term is asked several ways. A term is mastered once you answer ${NEED} different kinds of question about it correctly. A miss clears that term's progress until it is mastered.${S.typed?" Typing the answer to a scenario with no hint masters a term in one go.":""} Mastery stays until Reset or Prestige.</p>`;
  const strip=()=>`<div class="osi-strip words" style="margin-bottom:14px">${termGroupState(mod).map(x=>`<div class="osi-chip ${x.mastered?"on":""}" title="${esc(x.name)}: ${x.c} of ${x.n} terms mastered."><b>${esc(x.short)}</b><span>${esc(x.name)}</span><small>${x.mastered?"Mastered":x.c+"/"+x.n}</small></div>`).join("")}</div>`;
  function menu(){
    curKeys=null;
    const done=ITEMS.filter(x=>termMastered(mod,x.id)).length;
    app.innerHTML=head()+strip()+`<div class="card"><h3 style="font-size:1.4rem">Choose a mode</h3>
    <p class="note" style="margin:.3em 0 12px">${done} of ${ITEMS.length} terms mastered.</p>
    <div class="acro-modes">
      <div class="acro-mode"><h4>Questions</h4><p>Name the term from a description, define it, and spot it in a scenario${hasFix?", and pick the best defense against each attack":""}. The glossary stays closed until you finish or quit.</p>
        <div class="cfg"><label for="tmlen">Questions</label><select id="tmlen" class="ans" style="width:auto"><option>10</option><option selected>20</option><option>40</option></select></div>
        <div class="q-actions"><button class="btn" id="tmstart">Start questions</button></div></div>
      ${S.typed?`<div class="acro-mode"><h4>Type the answer</h4><p>Read a scenario and type the term yourself, with no options to choose from. Harder, so it counts for more: a correct answer with no hint masters the term in one go. With a hint, it counts as one question. Small typos are fine.</p>
        <div class="cfg"><label for="tylen">Scenarios</label><select id="tylen" class="ans" style="width:auto"><option selected>10</option><option>20</option></select></div>
        <div class="q-actions"><button class="btn" id="tystart">Start typing</button></div></div>`:""}
      ${(S.labs||[]).map(k=>`<div class="acro-mode"><h4>${esc(LABS[k].name)} <span class="tag">Lab</span></h4><p>${esc(LABS[k].desc)} Getting a task right on the first check counts as one question for each term it uses.</p>
        <div class="q-actions"><button class="btn" data-lab="${k}">Open ${esc(LABS[k].name)}</button></div></div>`).join("")}
      <div class="acro-mode"><h4>Glossary</h4><p>Every term by topic, with its definition${hasFix?" and, for attacks, the defense that best stops it":""}.</p>
        <div class="q-actions"><button class="btn ghost" id="tmref">View the glossary</button></div></div>
    </div></div>`;
    $("#tmstart").addEventListener("click",()=>drill(+$("#tmlen").value));
    if(S.typed) $("#tystart").addEventListener("click",()=>typed(+$("#tylen").value));
    app.querySelectorAll("[data-lab]").forEach(b=>b.addEventListener("click",()=>LABS[b.dataset.lab].run(mod,menu)));
    $("#tmref").addEventListener("click",ref);
  }
  function ref(){
    curKeys=null;
    app.innerHTML=head()+`<div class="examtop"><button class="chipbtn" id="tmback" type="button">← ${esc(m.name)} menu</button><span>Glossary</span></div>
    <div class="card">${S.groups.map(([g,name])=>`<h3 style="font-size:1.2rem;margin:14px 0 6px">${esc(name)}</h3><div class="tw"><table><thead><tr><th style="width:30%">Term</th><th>What it is</th>${ITEMS.some(x=>x.g===g&&x.fix)?"<th>Best defense</th>":""}</tr></thead><tbody>${ITEMS.filter(x=>x.g===g).map(x=>`<tr><td><b>${esc(x.t)}</b>${termMastered(mod,x.id)?' <span class="note" style="color:var(--green)">✓</span>':""}</td><td>${esc(x.def)}</td>${x.fix?`<td>${esc(x.fix)}</td>`:ITEMS.some(y=>y.g===g&&y.fix)?"<td></td>":""}</tr>`).join("")}</tbody></table></div>`).join("")}
    <div class="q-actions" style="margin-top:14px"><button class="btn" id="tmgo">Start questions</button></div></div>`;
    $("#tmback").addEventListener("click",menu); $("#tmgo").addEventListener("click",menu);
  }
  function distract(it,n,field){
    const bad=new Set([it.id,...(it.avoid||[])]); ITEMS.forEach(x=>{ if((x.avoid||[]).includes(it.id)) bad.add(x.id); });
    let pool=ITEMS.filter(x=>x.g===it.g&&!bad.has(x.id)&&x[field]);
    if(pool.length<n){ const gi=S.groups.findIndex(x=>x[0]===it.g); for(let k=1;k<S.groups.length&&pool.length<n;k++){ const near=S.groups[(gi+k)%S.groups.length][0]; pool=pool.concat(shuffle(ITEMS.filter(x=>x.g===near&&!bad.has(x.id)&&x[field]))); } }
    return shuffle(pool.slice(0,Math.max(n,pool.length))).slice(0,n);
  }
  let lastId=null;
  function build(){
    const open=ITEMS.filter(x=>!termMastered(mod,x.id)&&x.id!==lastId); const it=(open.length&&Math.random()<0.8)?pick(open):pick(ITEMS.filter(x=>x.id!==lastId));
    const have=termKeys(mod,it.id); const kinds=["name","def","scen"].concat(it.fix&&hasFix?["fix"]:[]); const fresh=kinds.filter(k=>!have[k]);
    const kind=pick(fresh.length?fresh:kinds);
    const ex=`<b>${esc(it.t)}:</b> ${esc(it.def)}.`;
    if(kind==="name"){ const d=distract(it,3,"t"); return {it,kind,cfg:{prompt:`Which term matches this description?<span style="display:block;margin-top:.4em"><b>${esc(it.def)}</b></span>`,options:[it.t,...d.map(x=>x.t)],answer:0,explain:ex,why:["",...d.map(x=>`That is ${esc(x.def.charAt(0).toLowerCase()+x.def.slice(1))}.`)]}}; }
    if(kind==="def"){ const d=distract(it,3,"def"); return {it,kind,cfg:{prompt:`What is <b>${esc(it.t)}</b>?`,options:[it.def,...d.map(x=>x.def)],answer:0,explain:ex,why:["",...d.map(x=>`That describes <b>${esc(x.t)}</b>, not ${esc(it.t)}.`)]}}; }
    if(kind==="scen"){ const d=distract(it,3,"t"); return {it,kind,cfg:{prompt:esc(it.sc),options:[it.t,...d.map(x=>x.t)],answer:0,explain:ex,why:["",...d.map(x=>`${esc(x.def)}. That is not what this scenario describes.`)]}}; }
    const bad=new Set([it.id,...(it.avoid||[]),...(it.fixAvoid||[])]); const d=shuffle(ITEMS.filter(x=>x.fix&&x.fix!==it.fix&&!bad.has(x.id)&&!(x.avoid||[]).includes(it.id)&&!(x.fixAvoid||[]).includes(it.id))).slice(0,3);
    return {it,kind,cfg:{prompt:`Which defense BEST mitigates <b>${esc(it.t)}</b>?`,options:[it.fix,...d.map(x=>x.fix)],answer:0,explain:`It is the targeted defense against ${esc(it.t)}. ${esc(it.t)}: ${esc(it.def)}.`,why:["",...d.map(x=>`That is the main defense against <b>${esc(x.t)}</b>, a different problem: ${esc(x.def.charAt(0).toLowerCase()+x.def.slice(1))}.`)]}};
  }
  function finish(R,before,N,again){
    curKeys=null;
    const nowM=ITEMS.filter(x=>termMastered(mod,x.id)&&!before.has(x.id));
    app.innerHTML=head()+strip()+`<div class="card"><h3 style="font-size:1.4rem">${R.quit?"Stopped":"Set complete"}: ${R.r} of ${R.t} correct${R.t?` (${pct(R.r/R.t)}%)`:""}</h3>
    <p style="margin:.4em 0">${nowM.length?`Newly mastered: <b>${nowM.map(x=>esc(x.t)).join(", ")}</b>.`:"No new terms mastered this set."} ${ITEMS.filter(x=>termMastered(mod,x.id)).length} of ${ITEMS.length} mastered overall.</p>
    ${R.missed.length?`<h4 style="margin:14px 0 6px">Review these terms</h4><div class="tw"><table><tbody>${R.missed.map(id=>{ const x=ITEMS.find(y=>y.id===id); return `<tr><td style="width:30%"><b>${esc(x.t)}</b></td><td>${esc(x.def)}${x.fix?`<br><span class="note">Best defense: ${esc(x.fix)}</span>`:""}</td></tr>`; }).join("")}</tbody></table></div>`:""}
    <div class="q-actions" style="margin-top:14px"><button class="btn" id="tmagain">Another set of ${N}</button><button class="btn ghost" id="tmref2">View the glossary</button><button class="btn ghost" id="tmmenu">${esc(m.name)} menu</button></div></div>`;
    $("#tmagain").addEventListener("click",()=>again(N)); $("#tmref2").addEventListener("click",ref); $("#tmmenu").addEventListener("click",menu);
  }
  /* Type the answer: the student reads a term's scenario and types the term. A clean correct answer (no hint)
     masters the term; with a hint it counts as one kind ("typed"); a miss clears the term's credit like any miss.
     Typing a different term from this module explains that term, so the miss teaches something. */
  function typed(N){
    const R={r:0,t:0,missed:[]}; const before=new Set(ITEMS.filter(x=>termMastered(mod,x.id)).map(x=>x.id));
    app.innerHTML=head()+`<div id="tmstrip"></div><div class="examtop"><button class="chipbtn" id="tmquit" type="button">Quit</button><span id="tmprog"></span></div><div id="area"></div>`;
    const area=$("#area"); $("#tmstrip").innerHTML=strip();
    $("#tmquit").addEventListener("click",()=>{ R.quit=true; finish(R,before,N,typed); });
    function next(){
      if(R.t>=N) return finish(R,before,N,typed);
      $("#tmprog").textContent=`Scenario ${R.t+1} of ${N}`;
      const open=ITEMS.filter(x=>!termMastered(mod,x.id)&&x.id!==lastId); const it=(open.length&&Math.random()<0.8)?pick(open):pick(ITEMS.filter(x=>x.id!==lastId)); lastId=it.id;
      const c=termMastered(mod,it.id)?NEED:Math.min(Object.keys(termKeys(mod,it.id)).length,NEED);
      const grp=S.groups.find(g=>g[0]===it.g)[1]; const words=it.t.replace(/\s*\([^)]*\)/g,"").split(/\s+/);
      const meta=`${domTag(it.d)}<span class="tag">Type the answer</span><span class="tag" title="Different kinds of question answered correctly for this term.">Strength <span class="strength">${"●".repeat(c)}${"○".repeat(NEED-c)}</span></span>`;
      const ex=`<b>${esc(it.t)}:</b> ${esc(it.def)}.`;
      textQ(area,{meta,prompt:esc(it.sc),answer:it.t,placeholder:"Type the term",
        hint:`Topic: <b>${esc(grp)}</b>. ${words.length>1?`${words.length} words, starting`:"It starts"} with <b>${esc(it.t[0])}</b>.`,
        check:v=>{ const m=tyMatch(v,it); if(m===2) return {ok:true}; if(m===1&&!ITEMS.some(x=>x.id!==it.id&&tyMatch(v,x)===2)) return {ok:true,note:`Accepted. The exact spelling is <b>${esc(it.t)}</b>.`};
          const other=ITEMS.find(x=>x.id!==it.id&&tyMatch(v,x)===2);
          if(other&&((it.avoid||[]).includes(other.id)||(other.avoid||[]).includes(it.id))) return {ok:true,note:`Accepted: <b>${esc(other.t)}</b> also fits. The best fit is <b>${esc(it.t)}</b>.`};
          if(other) return {ok:false,note:`You typed <b>${esc(other.t)}</b>: ${esc(other.def)}. That is not what this scenario describes.`};
          return {ok:false}; },
        steps:[ex],nextLabel:R.t+1>=N?"Finish":"Next",
        onResult:(ok,hinted)=>{ R.t++; if(ok) R.r++; else if(!R.missed.includes(it.id)) R.missed.push(it.id); scoreUpd(R.r,R.t);
          if(mode==="student"){ P.termM=P.termM||{}; const was=termMastered(mod,it.id); const bucket=(P.termM[mod]=P.termM[mod]||{});
            if(ok){ const k=(bucket[it.id]=bucket[it.id]||{}); k.typed=1; if(!hinted) k.typed2=1;
              if(termMastered(mod,it.id)){ P.termDone=P.termDone||{}; (P.termDone[mod]=P.termDone[mod]||{})[it.id]=true; } }
            else if(!was) delete bucket[it.id];
            save(); }
          $("#tmstrip").innerHTML=strip(); },onNext:next});
    }
    next();
  }
  function drill(N){
    const R={r:0,t:0,missed:[]}; const before=new Set(ITEMS.filter(x=>termMastered(mod,x.id)).map(x=>x.id));
    app.innerHTML=head()+`<div id="tmstrip"></div><div class="examtop"><button class="chipbtn" id="tmquit" type="button">Quit</button><span id="tmprog"></span></div><div id="area"></div>`;
    const area=$("#area"); $("#tmstrip").innerHTML=strip();
    $("#tmquit").addEventListener("click",()=>{ R.quit=true; finish(R,before,N,drill); });
    const KN={name:"Name it",def:"Define it",scen:"Scenario",fix:"Best defense"};
    function next(){
      if(R.t>=N) return finish(R,before,N,drill);
      $("#tmprog").textContent=`Question ${R.t+1} of ${N}`;
      const q=build(); lastId=q.it.id; const c=termMastered(mod,q.it.id)?NEED:Math.min(Object.keys(termKeys(mod,q.it.id)).length,NEED);
      const meta=`${domTag(q.it.d)}<span class="tag">${KN[q.kind]}</span><span class="tag" title="Different kinds of question answered correctly for this term.">Strength <span class="strength">${"●".repeat(c)}${"○".repeat(NEED-c)}</span></span>${c>=NEED?`<span class="tag" style="color:var(--green);border-color:var(--green)">Mastered</span>`:""}`;
      choiceQ(area,{...q.cfg,meta,nextLabel:R.t+1>=N?"Finish":"Next",onResult:ok=>{ R.t++; if(ok) R.r++; else if(!R.missed.includes(q.it.id)) R.missed.push(q.it.id); scoreUpd(R.r,R.t);
        if(mode==="student"){ P.termM=P.termM||{}; const was=termMastered(mod,q.it.id); const bucket=(P.termM[mod]=P.termM[mod]||{});
          if(ok){ (bucket[q.it.id]=bucket[q.it.id]||{})[q.kind]=1; if(termMastered(mod,q.it.id)){ P.termDone=P.termDone||{}; (P.termDone[mod]=P.termDone[mod]||{})[q.it.id]=true; } }
          else if(!was) delete bucket[q.it.id];
          save(); }
        $("#tmstrip").innerHTML=strip(); },onNext:next});
    }

    next();
  }
  menu();
}

/* ---- Performance-based questions: placeholder until the Security+ PBQs are built ---- */
function viewSoon(){
  curKeys=null;
  const m=M("pbq");
  app.innerHTML=modHead(m,"",true)+`<div class="card"><h3 style="font-size:1.4rem">Coming soon</h3>
  <p style="margin:.4em 0;max-width:70ch">Hands-on performance-based questions for Security+ are being built. They will cover the Given-a-scenario objectives, such as analyzing indicators of malicious activity, securing enterprise infrastructure, applying security techniques to computing resources, and using data sources in an investigation.</p>

/* ---- Acronym Gym ---- */
function acroActive(){ return ACRO; }
/* Tier-1 acronyms set the module rank; tier-2 (rarely tested) ones are still drilled and listed. */
function acroCore(){ return ACRO.filter(x=>x.t===1); }
/* An acronym is mastered the first time it reaches strength 4, and stays mastered until progress is reset or you prestige. */
function acroIsMastered(id){ return !!((P.acroM&&P.acroM[id]) || (P.acro[id]||0)>=4); }
function acroMastered(list){ return list.filter(x=>acroIsMastered(x.id)).length; }
function acroLabel(x){ return x.ctx ? `${x.a} (in ${x.ctx})` : x.a; }
const normAcro=s=>String(s||"").toUpperCase().replace(/PLUS$/,"+").replace(/[\s.\-_/]/g,"");
/* Spell-it-out distractors: fake expansions that still fit the acronym's letters, made by swapping words for others with the same first letter. */
const ACRO_STOP=new Set(["of","and","the","over","for","in","on","to","by","with","between","as","a","an","at"]);
const ACRO_EXTRA="Access Address Advanced Application Authentication Automatic Bandwidth Boundary Bridge Broadcast Central Channel Control Controller Core Data Delivery Device Digital Direct Discovery Distributed Domain Dynamic Encrypted Endpoint Enhanced Extended Exchange File Forwarding Frame Gateway Global Group Host Hybrid Identity Integrated Interface Internal Internet Key Label Layer Line Link Local Logical Managed Management Media Message Monitoring Name Network Node Open Packet Path Peer Port Primary Private Protected Protocol Public Quality Queue Remote Resource Routing Secure Security Segment Server Service Session Shared Signal Simple Standard Static Switch System Tagged Terminal Traffic Transfer Transport Trunk Tunnel Unified User Virtual Wide Wireless Zone".split(" ");
let ACRO_VOCAB=null;
function acroVocab(){
  if(ACRO_VOCAB) return ACRO_VOCAB;
  const by={}; const add=w=>{ const k=w[0].toLowerCase(); (by[k]=by[k]||new Set()).add(w.toLowerCase()); };
  ACRO.forEach(x=>String(x.x).split(/\s+/).forEach(w=>{ if(/^[A-Za-z]{3,}$/.test(w) && !ACRO_STOP.has(w.toLowerCase()) && !/^[A-Z]{2,}$/.test(w)) add(w); }));
  ACRO_EXTRA.forEach(add);
  ACRO_VOCAB={}; Object.keys(by).forEach(k=>ACRO_VOCAB[k]=[...by[k]]);
  return ACRO_VOCAB;
}
function acroFakes(it,n){
  const V=acroVocab(); const real=new Set(ACRO.map(x=>String(x.x).toLowerCase()));
  const parts=String(it.x).split(/(\s+|-)/); /* keeps spaces and hyphens as separate parts */
  const ok=w=>/^[A-Za-z]{3,}$/.test(w) && !ACRO_STOP.has(w.toLowerCase()) && !/^[A-Z]{2,}$/.test(w);
  const slots=parts.map((w,i)=>ok(w)?i:-1).filter(i=>i>=0);
  const out=[], seen=new Set([String(it.x).toLowerCase()]);
  for(let tries=0; tries<120 && out.length<n && slots.length; tries++){
    const w=parts.slice(); const k=Math.min(slots.length, Math.random()<0.8?1:2);
    shuffle(slots.slice()).slice(0,k).forEach(i=>{
      const orig=w[i], lo=orig.toLowerCase();
      /* same first letter, but not a plural or -ing form of the same word */
      const pool=(V[lo[0]]||[]).filter(v=>v!==lo && !v.startsWith(lo.slice(0,4)) && !lo.startsWith(v.slice(0,4)));
      if(!pool.length) return; let rep=pool[Math.floor(Math.random()*pool.length)];
      if(/^[A-Z]/.test(orig)) rep=rep[0].toUpperCase()+rep.slice(1);
      w[i]=rep;
    });
    const cand=w.join(""), key=cand.toLowerCase();
    if(!seen.has(key) && !real.has(key)){ seen.add(key); out.push(cand); }
  }
  return out;
}
/* Typed expansions: ignores case, punctuation, and small words (and, of, the...), and accepts small typos
   (about 1 letter in 8). Also accepts the wording of any acronym that means the same thing. 2 exact, 1 close, 0 no. */
function acroWords(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w&&!["and","of","the","for","to","a","an","on","in","with","as"].includes(w)).join(""); }
function acroSpell(v,it){ const n=acroWords(v); if(!n) return 0;
  const forms=[it.x].concat(ACRO.filter(x=>x.id!==it.id&&x.a===it.a&&x.x===it.x).map(x=>x.x)).map(acroWords);
  if(forms.includes(n)) return 2;
  return forms.some(f=>{ const tol=Math.max(1,Math.floor(f.length/8)); return Math.abs(f.length-n.length)<=tol&&tyDist(f,n)<=tol; })?1:0; }
function viewAcro(){

  }
  function pickItem(){
    const list=acroActive();

    if(it.pair) add(list.find(x=>x.id===it.pair));

  function explain(it){ return `<b>${esc(it.a)}</b> = ${esc(it.x)}.<br>${esc(it.d)}${it.note?`<br><span class="note"><b>Exam trap:</b> ${esc(it.note)}</span>`:""}`; }
  function drill(N,typeOnly){
    const S={r:0,t:0,missed:[],newly:0}; last=null;

    function next(){

      const meta=domTag(it.dom)+`<span class="tag">${esc(it.g)}</span>${it.t===2?`<span class="tag" title="On CompTIA's acronym list but rarely tested. Does not count toward the module rank.">Also listed</span>`:""}<span class="tag">${labels[type]}</span><span class="tag" title="One dot per correct answer in a row. Strength 4 masters the acronym. A miss resets the dots, but a mastered acronym stays mastered.">Strength <span class="strength">${"●".repeat(box)}${"○".repeat(4-box)}</span></span>${acroIsMastered(it.id)?`<span class="tag" style="color:var(--green);border-color:var(--green)">Mastered</span>`:""}`;

      ${S.missed.length?`<h4 style="margin:14px 0 6px">Review what you missed</h4><div class="tw"><table><tbody>${S.missed.map(x=>`<tr><td class="mono"><b>${esc(x.a)}</b></td><td>${esc(x.x)}</td><td class="note">${esc(x.d)}</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="q-actions" style="margin-top:14px"><button class="btn" id="acroagain">Another set of ${N}</button><button class="btn ghost" id="acroglos2">Open glossary</button><button class="btn ghost" id="acromenu">Acronyms menu</button></div></div>`;

/* ---- Exam (multiple choice only; PBQs will be added when the PBQ module is built) ---- */
function examPool(){ return BANK.concat(QUAL); }
function weightedPick(len){
  const pool=examPool(); len=Math.min(len,pool.length);
  const byD={1:[],2:[],3:[],4:[],5:[]}; pool.forEach(q=>byD[q.d].push(q));
  const raw=[1,2,3,4,5].map(d=>({d,v:len*DOMW[d]/100})); raw.forEach(o=>o.n=Math.floor(o.v));
  let left=len-raw.reduce((a,o)=>a+o.n,0); raw.slice().sort((a,b)=>(b.v-b.n)-(a.v-a.n)).forEach(o=>{ if(left>0){o.n++;left--;} });
  let out=[]; raw.forEach(o=>{ out=out.concat(shuffle(byD[o.d].slice()).slice(0,o.n)); });
  if(out.length<len){ out=out.concat(shuffle(pool.filter(q=>!out.includes(q))).slice(0,len-out.length)); }
  return shuffle(out);
}
let examTimer=null;
const EXAM_SIZES=[10,20,40];
function examMinutes(n){ return n; }
function viewExam(){

function runExam(len,timed){

  if(timed){ examTimer=setInterval(()=>{ secs--; const c=$("#eclock"); if(c) c.textContent=clockText(); if(secs<=0){ clearInterval(examTimer); examTimer=null; timeUp=true; finish(); } },1000); }

    const ds=[1,2,3,4,5].filter(d=>per[d][1]); const weakD=ds.slice().sort((a,b)=>per[a][0]/per[a][1]-per[b][0]/per[b][1])[0];

    const missed=qs.map((q,k)=>({q,k})).filter(o=>ans[o.k]!==o.q.a);

    <div class="mhead"><h2>Result: ${score} / ${total} (${pct(p)}%)</h2></div>
    ${timeUp?`<div class="callout"><b>Time ran out.</b> Unanswered questions count as wrong.</div>`:""}
    <div class="callout">${p>=0.8?"On track. Practice-test scores of 80%+ give a reasonable margin.":p>=0.7?"Close. Aim for a steady 80%+ before booking the exam.":"Keep drilling, starting with the weakest domain below."}</div>
    ${ds.length?`<div class="card"><h3 style="font-size:1.3rem;margin-bottom:8px">Results by domain</h3>
    ${ds.map(d=>`<div class="dombar d${d}"><span>${DOM[d]}</span><div class="meter"><i style="width:${pct(per[d][0]/per[d][1])}%"></i></div><span class="mono">${per[d][0]}/${per[d][1]}</span></div>`).join("")}
    <p class="note">Weakest: <b>${esc(DOM[weakD])}</b>. ${DOM_ADVICE[weakD]}</p></div>`:""}
    <div class="card" style="margin-top:16px" id="exrev"><h3 style="font-size:1.3rem;margin:0 0 4px">Review your answers</h3>
      <p class="note" style="margin:0 0 10px">For every question: why the correct answer is right and why each of the others is wrong.</p>
      <div class="q-actions" style="margin:0 0 6px">${missed.length?`<button class="chipbtn on" type="button" data-rv="missed">Missed (${missed.length})</button>`:""}<button class="chipbtn ${missed.length?"":"on"}" type="button" data-rv="all">All questions (${qs.length})</button></div>
      <div id="exrevlist"></div></div>
    <div class="q-actions"><a class="btn" href="#exam" style="text-decoration:none">Take another</a></div>`;
    const rv=which=>{ const list=qs.map((q,k)=>({q,k})).filter(o=>which==="all"||ans[o.k]!==o.q.a);
      $("#exrevlist").innerHTML=list.map(o=>{ const a=ans[o.k], ok=a===o.q.a;
        return `<div class="miss"><div class="q-meta">${domTag(o.q.d)}<span class="tag" style="color:var(--${ok?"ok":"bad"});border-color:var(--${ok?"ok":"bad"})">${ok?"Correct":a===null?"Not answered":"Missed"}</span><span class="tag">Question ${o.k+1}</span></div><p style="margin:.3em 0"><b>${esc(o.q.q)}</b></p>${whyList({options:o.q.o,answer:o.q.a,why:o.q.w&&o.q.w.map(esc),explain:esc(o.q.x),sel:a})}</div>`; }).join("");
      document.querySelectorAll("#exrev [data-rv]").forEach(b=>b.classList.toggle("on",b.dataset.rv===which)); };
    document.querySelectorAll("#exrev [data-rv]").forEach(b=>b.addEventListener("click",()=>rv(b.dataset.rv)));
    rv(missed.length?"missed":"all");
    window.scrollTo(0,0);
  }
  next();
}

function secretZone(){

  if(P.secretOpen) return `<div class="secret-zone">${got<SECRET_MAX?bonus:""}<b>Secret Prestige is open.</b> ${SECRET_MAX-got} secret badge${SECRET_MAX-got===1?"":"s"} left to claim. No more resets needed. <div class="q-actions" style="margin-top:8px"><button class="btn" id="secretclaim">Claim Secret ${got+1}: ${esc(SECRET_NAMES[got])}</button></div></div>`;

}

const ROUTES={home:viewHome,acro:viewAcro,qualifier:viewQual,pbq:viewSoon,exam:viewExam,cram:viewCram,progress:viewProgress,guide:viewGuide};
Object.keys(TERMSETS).forEach(k=>{ ROUTES[k]=()=>viewTerms(k); });
/* Grand Architect (all 5 secret badges): a soft RGB glow that slowly cycles colour.
   Inside a Joplin note it is drawn on the tool's own frame (Joplin redraws the page around it);
   elsewhere it is an inset glow around the page. Uses inline styles and the Web Animations API,
   so it does not depend on any stylesheet. */
function archFrames(inset){
  const c=[[255,90,90],[255,200,70],[80,220,120],[70,170,255],[170,110,255],[255,90,90]];
  return c.map(([r,g,b])=>({boxShadow: inset
    ? `inset 0 0 0 2px rgba(${r},${g},${b},.45), inset 0 0 36px 2px rgba(${r},${g},${b},.12)`
    : `0 0 0 2px rgba(${r},${g},${b},.5), 0 0 14px 1px rgba(${r},${g},${b},.22)`}));
}
function archGlow(){
  const on=(P.secret||0)>=SECRET_MAX;
  let reduce=false; try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  const host=(app&&app.closest)?app.closest(".sft"):null;
  if(host){
    if(!on){ if(host.__arch){ host.__arch.cancel(); host.__arch=null; } if(host.__archOn){ host.style.boxShadow=""; host.__archOn=false; } return; }
    if(host.__archOn) return;
    host.__archOn=true; const fr=archFrames(false); host.style.boxShadow=fr[3].boxShadow;
    try{ if(!reduce) host.__arch=host.animate(fr,{duration:9000,iterations:Infinity}); }catch(e){}
    return;
  }
  let el=document.getElementById("sft-arch");
  if(!on){ if(el) el.remove(); return; }
  if(el) return;
  el=document.createElement("div"); el.id="sft-arch"; el.setAttribute("aria-hidden","true");
  const fr=archFrames(true);
  el.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:2147483000;box-shadow:"+fr[3].boxShadow;
  document.body.appendChild(el);
  try{ if(!reduce) el.animate(fr,{duration:9000,iterations:Infinity}); }catch(e){}
}
function route(){
  archGlow();
  if(examTimer){ clearInterval(examTimer); examTimer=null; }
  if(typeof pbqTimer!=="undefined" && pbqTimer){ clearInterval(pbqTimer); pbqTimer=null; }
  curKeys=null;
  const h=(location.hash||"#home").slice(1);
  (ROUTES[h]||viewHome)();
  window.scrollTo(0,0);
}
/* Desktop / Mobile layout switch. Only the web and standalone versions have it in their header. */
(function(){
  const sw=document.getElementById("layoutSw"); if(!sw) return;
  const LK="provo-secplus-layout";
  let saved=null; try{ saved=localStorage.getItem(LK); }catch(e){}
  const set=(mob,store)=>{
    document.documentElement.classList.toggle("mobile",mob);
    sw.setAttribute("aria-checked",String(mob));
    document.querySelectorAll("#viewsw .lbl").forEach(l=>l.classList.toggle("on",(l.dataset.v==="mobile")===mob));
    if(store){ try{ localStorage.setItem(LK,mob?"mobile":"desktop"); }catch(e){} }
  };
  set(saved?saved==="mobile":matchMedia("(max-width:760px)").matches,false);
  sw.addEventListener("click",()=>set(sw.getAttribute("aria-checked")!=="true",true));
  document.querySelectorAll("#viewsw .lbl").forEach(l=>l.addEventListener("click",()=>set(l.dataset.v==="mobile",true)));
})();
window.addEventListener("hashchange",route);
/* a link to the page you are already on (e.g. "Exit exam" or "Take another" while on #exam) gets no hashchange event, so re-route by hand */
document.addEventListener("click",e=>{ const l=e.target.closest&&e.target.closest('a[href^="#"]'); if(!l) return; const h=l.getAttribute("href"); if(h===(location.hash||"#home")){ e.preventDefault(); route(); } });
route();
