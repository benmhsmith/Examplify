<title>Examplify Network+</title>

<style>
/* Layout: patch-panel index on home (one row per module, like a labeled patch panel), single-column drill views; T568B pair colors accent the cram cards. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#142030; --muted:#566476; --line:#D5DCE5;
  --orange:#D9701A; --blue:#2360A6; --brown:#7B4F2E; --green:#2E8657; --violet:#6B4FA8; --gold:#A87600;
  --accent:var(--orange); --accent-ink:#FFFFFF;
  --ok:#1E8A55; --ok-bg:#E3F4EA; --warn:#A8650A; --warn-bg:#FCF0DC; --bad:#C23A3A; --bad-bg:#FBE7E7; --pick:#2360A6; --pick-bg:#E4EDF8;
  --font-display:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  --font-mono:"Atkinson Hyperlegible Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181B; --surface:#1F2226; --sunk:#272A2F; --ink:#E8E9EB; --muted:#A3A7AD; --line:#33373D;
  --orange:#F08A35; --blue:#6EA4E8; --brown:#C08B62; --green:#4DBA80; --violet:#A994E0; --gold:#E8C25A;
  --accent-ink:#1A1205; --ok:#4DBA80; --ok-bg:#12301F; --warn:#F0B45A; --warn-bg:#3A2A10; --bad:#F07070; --bad-bg:#3A1717; --pick:#6EA4E8; --pick-bg:#17304E;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16181B; --surface:#1F2226; --sunk:#272A2F; --ink:#E8E9EB; --muted:#A3A7AD; --line:#33373D;
  --orange:#F08A35; --blue:#6EA4E8; --brown:#C08B62; --green:#4DBA80; --violet:#A994E0; --gold:#E8C25A;
  --accent-ink:#1A1205; --ok:#4DBA80; --ok-bg:#12301F; --warn:#F0B45A; --warn-bg:#3A2A10; --bad:#F07070; --bad-bg:#3A1717; --pick:#6EA4E8; --pick-bg:#17304E;
  color-scheme:dark }

html{font-size:16px}
html.instructor{font-size:20px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:var(--font-mono)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:0}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.badge{font-family:var(--font-mono);font-size:.72rem;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.timer{display:none;align-items:center;gap:6px}
html.instructor .timer{display:inline-flex}
.timer .t{font-family:var(--font-mono);font-size:1.1rem;min-width:3.6em;text-align:center;font-weight:600}
.timer .t.done{color:var(--bad)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:.82rem}
.chipbtn:hover{border-color:var(--muted)}

main{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;margin:6px 0 26px}
.hero h1{font-size:2.6rem;line-height:1.05;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.kicker{font-size:.82rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:4px}
.examcode{font-family:var(--font-mono);font-size:.5em;font-weight:600;padding:4px 10px;border:1.5px solid var(--line);border-radius:6px;color:var(--muted);letter-spacing:.04em}
.hero-art{width:100%;max-width:380px;justify-self:end;display:block}
.hero-art line{stroke-width:2}
.hero-art .links line{stroke:var(--line)}
.hero-art .flow line{stroke-width:2.5;stroke-dasharray:4 22;stroke-linecap:round;animation:nftflow 2.8s linear infinite}
@keyframes nftflow{to{stroke-dashoffset:-104}}
.hero p{color:var(--muted);margin:.6rem 0 0;max-width:56ch;font-size:1.05rem}
.weights{margin:0 0 26px}
.wbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.wbar div{display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.wlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.wlegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:-1px}
.d1{--c:#2360A6}.d2{--c:#2E8657}.d3{--c:#B8860B}.d4{--c:#C23A3A}.d5{--c:#6B5B95}

.section-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stages{display:grid;gap:18px}
.stage-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 8px}
.stage-n{font-family:var(--font-mono);font-size:.76rem;font-weight:600;color:var(--orange);text-transform:uppercase;letter-spacing:.06em}
.stage-h h2{font-size:1.15rem;font-weight:700}
.stage-h p{margin:0;color:var(--muted);font-size:.9rem}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 170px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--sunk)}
.jack{width:44px;height:36px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:.9rem;position:relative}
.jack::after{content:"";position:absolute;bottom:5px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--line)}
.prow h3{font-size:1.12rem;font-weight:600}
.prow p{margin:0;color:var(--muted);font-size:.9rem}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;white-space:nowrap}
.rank{--rc:var(--muted);display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:.74rem;font-weight:700;color:var(--rc);white-space:nowrap;cursor:help;letter-spacing:.01em}
.rank.r1{--rc:var(--blue)}.rank.r2{--rc:var(--green)}.rank.r3{--rc:var(--violet)}.rank.r4{--rc:var(--orange)}.rank.r5{--rc:var(--gold)}.rank.r6{--rc:var(--gold);text-shadow:0 0 8px color-mix(in srgb,var(--gold) 60%,transparent)}
.rank .bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.rank .bars i{display:block;width:3px;border-radius:1px;background:var(--line)}
.rank .bars i:nth-child(1){height:3px}.rank .bars i:nth-child(2){height:4.5px}.rank .bars i:nth-child(3){height:6px}.rank .bars i:nth-child(4){height:7.5px}.rank .bars i:nth-child(5){height:9px}.rank .bars i:nth-child(6){height:10.5px}.rank .bars i:nth-child(7){height:12px}
.rank.r5 .bars i.on,.rank.r6 .bars i.on{background:linear-gradient(var(--gold),var(--orange))}
.rank.r6 .bars i.on{box-shadow:0 0 5px var(--gold)}
/* Grandmaster: the module glows */
.prow.gm{box-shadow:inset 0 0 0 2px var(--gold);background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 16%,var(--surface)),var(--surface) 65%);animation:gmrow 3s ease-in-out infinite}
@keyframes gmrow{0%,100%{box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 26px 0 color-mix(in srgb,var(--gold) 45%,transparent)}}
.gm-aura{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 60px 8px color-mix(in srgb,var(--gold) 38%,transparent);animation:gmaura 3.2s ease-in-out infinite}
@keyframes gmaura{0%,100%{opacity:.55}50%{opacity:1}}
.gm-banner{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--gold);background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));font-weight:700}
.gm-banner span{font-weight:500;color:var(--muted)}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border-radius:999px;background:var(--gold);color:#241800;font-weight:700;font-size:.85rem}
.badge-plate .reward{display:flex;width:max-content;margin-top:6px}
.secret-zone{margin-top:14px;padding:12px 14px;border-radius:10px;border:1.5px dashed var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.rank .bars i.on{background:var(--rc)}
.prow h3 .rank{margin-left:10px;vertical-align:.1em}
.mhead .rank{font-size:.85rem}
.mhead .rank .bars{height:14px}
.badge-plate{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.badge-plate b{display:block;font-size:1rem}
.badge-plate small{color:var(--muted);font-size:.82rem}
.pbadge{flex:none;display:block}
.pbadge .fi{fill:var(--bi)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-top:12px}
.gallery figure{margin:0;text-align:center;font-size:.74rem;color:var(--muted);display:grid;justify-items:center;gap:4px}
.gallery figure.on{color:var(--ink);font-weight:600}
.gallery figure.cur svg{filter:drop-shadow(0 0 6px var(--orange))}
.mastery-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:520px){.mastery-card{grid-template-columns:1fr}}
.acro-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:4px}
.acro-mode{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.acro-mode h4{margin:0 0 4px;font-family:var(--font-display);font-size:1.15rem}
.acro-mode p{margin:0 0 8px;color:var(--muted);font-size:.92rem}
.osi-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.osi-chip{border:1px solid var(--line);border-radius:8px;padding:6px 6px 5px;background:var(--surface);display:grid;gap:1px;text-align:center;min-width:0}
.osi-chip b{font-family:var(--font-mono);font-size:1rem}
.osi-chip span{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osi-chip small{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.osi-chip.on{border-color:var(--green);background:var(--ok-bg)}
.osi-chip.on small{color:var(--ok);font-weight:700}
@media (max-width:560px){.osi-chip span{display:none} .osi-chip.on small{font-size:0} .osi-chip.on small::after{content:"\2713";font-size:.95rem} .osi-strip{gap:4px} .osi-chip{padding:5px 2px}}
html.mobile .osi-chip span{display:none}
html.mobile .osi-chip.on small{font-size:0}
html.mobile .osi-chip.on small::after{content:"\2713";font-size:.95rem}
html.mobile .osi-strip{gap:4px}
html.mobile .osi-chip{padding:5px 2px}
.osi-strip.words{grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
.osi-strip.words b{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sn-chip{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;display:grid;gap:1px;background:var(--surface);cursor:help}
.sn-chip b{font-family:var(--font-mono);font-size:.95rem}
.sn-chip small{font-family:var(--font-mono);font-size:.74rem;color:var(--muted)}
.sn-chip.on{border-color:var(--green);background:var(--ok-bg)}
.sn-chip.on small{color:var(--ok);font-weight:700}
pre.cli{margin:.6em 0 .2em;padding:10px 12px;border-radius:8px;background:#141A21;color:#D7E3EE;font-family:var(--font-mono);font-size:.82rem;line-height:1.45;overflow-x:auto;white-space:pre;max-width:100%}
.rank-key{margin:-2px 0 12px;font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.wire{width:26px;height:9px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--w) 0 5px,var(--surface) 5px 8px);border:1px solid var(--w)}
.t1{--w:var(--orange)}.t2{--w:var(--blue)}.t3{--w:var(--brown)}.t0{--w:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--green)}
.mcap{font-size:.75rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
html.instructor .mcol{visibility:hidden}

/* Module view */
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:14px}
.mhead h2{font-size:1.7rem;font-weight:700;margin-right:auto}
.back{font-size:.9rem;text-decoration:none;color:var(--muted);display:inline-block;margin-bottom:6px}
.covers{color:var(--muted);font-size:.9rem;margin:-6px 0 16px;max-width:75ch}
.score{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.15;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;cursor:help}
.score small{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.score b{font-family:var(--font-mono);font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.score[data-state="none"] b{color:var(--muted);font-family:var(--font-body);font-weight:500}
.score[data-state="good"]{border-color:var(--ok);background:var(--ok-bg)}.score[data-state="good"] b{color:var(--ok)}
.score[data-state="mid"]{border-color:var(--warn);background:var(--warn-bg)}.score[data-state="mid"] b{color:var(--warn)}
.score[data-state="low"]{border-color:var(--bad);background:var(--bad-bg)}.score[data-state="low"] b{color:var(--bad)}
.strength{letter-spacing:.12em;color:var(--green)}
html.instructor .score{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.dom{color:#fff;background:var(--c)}
.q-prompt{font-size:1.15rem;line-height:1.45;margin-bottom:16px;max-width:75ch}
.q-prompt .big{font-family:var(--font-mono);font-size:2rem;font-weight:600;display:block;margin:.2em 0}
.q-prompt mark{background:transparent;color:var(--orange);font-weight:700;border-bottom:2px solid var(--orange)}
.opts{display:grid;gap:8px}
.opts.grid7{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.picopts{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.picopts .opt{flex-direction:column;align-items:stretch;padding:8px}
.opts.picopts .opt .k{align-self:flex-start}
.opts.picopts .mpic{max-width:170px}
.mpic{display:block;width:100%;max-width:240px;height:auto;margin:0 auto}
.q-prompt .mpic{max-width:280px;margin:8px 0 4px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:.85rem}
.opt .tx{min-width:0}
.opt.picked{border-color:var(--pick);background:var(--pick-bg)}
.opt.picked .k{background:var(--pick);color:var(--surface)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.q-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kbd{font-size:.78rem;color:var(--muted);margin-left:auto}
html.instructor .kbd{display:none}
.fb{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--sunk);max-width:80ch}
.fb.wide{max-width:none}
.rt-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.rt-modal[hidden]{display:none}
.rt-backdrop{position:absolute;inset:0;background:rgba(10,16,24,.55)}
.rt-dialog{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.rt-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:1.25rem;font-weight:700}
.rt-dialog-body{overflow:auto;padding:8px 12px 12px}
.rt-dialog-body .card{border:0;padding:6px 2px}
.rt-dialog-body .card h3{display:none}
.rt-dialog.fw-dialog{width:min(980px,100%)}
.fwtable td,.fwtable th{white-space:nowrap}
.fwtable tfoot td{color:var(--muted);border-top:2px solid var(--line)}
.fwtable select{max-width:15em}
.pl-chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;cursor:grab}
.pl-chip:hover{border-color:var(--muted)}
.pl-chip.on{border-color:var(--blue);background:var(--pick-bg);color:var(--blue)}
.pl-slot:focus-visible rect{stroke:var(--orange);stroke-width:3}
.wltable td{vertical-align:middle;white-space:nowrap}
.wltable tr[hidden]{display:none}
.m-row{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:12px;align-items:center}
.m-drop{border:2px dashed var(--blue);border-radius:8px;min-height:42px;display:flex;align-items:center;justify-content:center;padding:6px 10px;color:var(--muted);font-weight:600;cursor:pointer;text-align:center;background:var(--surface)}
.m-drop.filled{border-style:solid;color:var(--ink);background:var(--pick-bg)}
.m-drop.over{border-color:var(--orange)}
.m-drop.ok{border:2px solid var(--ok);background:var(--ok-bg);color:var(--ink)}
.m-drop.bad{border:2px solid var(--bad);background:var(--bad-bg);color:var(--ink);flex-direction:column;gap:1px}
.m-was{font-size:.82em;font-weight:500;color:var(--muted)}
.m-drop:focus-visible{outline:3px solid var(--orange)}
.m-desc{line-height:1.4}
@media (max-width:560px){.m-row{grid-template-columns:1fr}}
.rt-node:focus-visible circle:first-child{stroke:var(--orange);stroke-width:3}
.rt-node:hover circle:first-child{fill:var(--pick-bg)}
table.rtt th,table.rtt td{padding:4px 6px;white-space:nowrap}
table.rtt td{vertical-align:middle}
.fb .v{font-weight:700;margin-bottom:4px}
.fb .v.ok{color:var(--ok)}.fb .v.bad{color:var(--bad)}
.fb p{margin:.3em 0}
.rt-dialog-body h4{font-size:1rem;margin:0}
.steps{margin:.4em 0 0;padding-left:1.3em}
.steps li{margin:.15em 0}
input.ans{font-family:var(--font-mono);font-size:1.1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:min(320px,100%)}
input.ans.okb{border-color:var(--ok)} input.ans.badb{border-color:var(--bad)}

/* ladder */
.ladder{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ladder .col{min-width:0}
.stepbtn{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.stepbtn:hover:not([disabled]){border-color:var(--muted)}
.stepbtn[disabled]{opacity:.35;cursor:default}
.slot{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1.5px dashed var(--line);border-radius:8px;margin-bottom:8px;min-height:44px}
.slot .n{font-family:var(--font-mono);font-weight:600;color:var(--muted);flex:none}
.slot.filled{border-style:solid}
.slot.ok{border-color:var(--ok);background:var(--ok-bg)}.slot.bad{border-color:var(--bad);background:var(--bad-bg)}

/* tables & cram */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.mono,td .mono{font-variant-numeric:tabular-nums}
.cram{columns:2 380px;column-gap:20px}
.cram .card{break-inside:avoid;margin-bottom:20px;padding:16px 18px}
.cram h3{font-size:1.3rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.cram ul{margin:.2em 0;padding-left:1.15em}
.cram li{margin:.18em 0}
.note{font-size:.85rem;color:var(--muted)}
.callout{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.92rem;margin:12px 0}

/* exam */
.cfg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0 4px}
.cfg label{font-weight:600}
.dombar{display:grid;grid-template-columns:170px minmax(0,1fr) 70px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.dombar .meter i{background:var(--c)}
.examtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--font-mono);font-size:.9rem;color:var(--muted)}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss:first-child{border-top:0}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

.guide h3{font-size:1.35rem;margin:18px 0 6px}
.guide p,.guide li{max-width:75ch}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:2.1rem}
  .hero-art{justify-self:start;max-width:300px}
  .prow{grid-template-columns:44px minmax(0,1fr);row-gap:6px}
  .prow .mcol{grid-column:2}
  .prow h3 .rank{display:flex;width:max-content;margin:3px 0 1px}
  .ladder{grid-template-columns:1fr}
  .dombar{grid-template-columns:110px minmax(0,1fr) 60px}
  .wbar div{font-size:.66rem}
}
/* Desktop / Mobile layout switch (web and standalone versions only) */
.viewsw{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.viewsw .lbl{cursor:pointer;user-select:none}
.viewsw .lbl.on{color:var(--ink)}
.sw{position:relative;width:44px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;padding:0;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--blue);transition:transform .18s ease}
.sw[aria-checked="true"] i{transform:translateX(20px)}
.sw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dg{overflow-x:auto;-webkit-overflow-scrolling:touch}
html.mobile .top-in,html.mobile main{max-width:460px}
html.mobile .brand{flex-basis:100%}
html.mobile .viewsw{order:3;margin-right:auto}
html.mobile .top-in > .chipbtn{order:4}
html.mobile body{font-size:1.05rem}
html.mobile .hero{grid-template-columns:1fr}
html.mobile .hero h1{font-size:2.1rem}
html.mobile .hero-art{justify-self:start;max-width:300px}
html.mobile .prow{grid-template-columns:44px minmax(0,1fr);row-gap:6px}
html.mobile .prow .mcol{grid-column:2}
html.mobile .prow h3 .rank{display:flex;width:max-content;margin:3px 0 1px}
html.mobile .ladder{grid-template-columns:1fr}
html.mobile .m-row{grid-template-columns:1fr}
html.mobile .dombar{grid-template-columns:110px minmax(0,1fr) 60px}
html.mobile .wbar div{font-size:.66rem}
html.mobile .cram{columns:1}
html.mobile .mhead h2{font-size:1.45rem}
html.mobile .btn,html.mobile .chipbtn{min-height:44px}
html.mobile .chipbtn{padding:6px 12px;display:inline-flex;align-items:center;justify-content:center}
html.mobile .opt{min-height:52px}
html.mobile input.ans{font-size:1.15rem;width:100%}
html.mobile .dg svg{min-width:760px}
html.mobile .dg::after{content:"Swipe sideways to see the whole diagram.";display:block;font-size:.8rem;color:var(--muted);padding:2px 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><b>Examplify Network+</b><span class="badge">v4.0.0</span></a>
    <div class="viewsw" id="viewsw"><span class="lbl" data-v="desktop">Desktop</span><button class="sw" id="layoutSw" type="button" role="switch" aria-checked="false" aria-label="Mobile layout"><i></i></button><span class="lbl" data-v="mobile">Mobile</span></div>
    <a class="chipbtn" href="#cram" style="text-decoration:none;padding:6px 12px">Cram Sheet</a>
    <a class="chipbtn" href="#progress" style="text-decoration:none;padding:6px 12px">Progress</a>
  </div>
</header>
<main id="app"></main>

<script>

const QUAL = [
 {id:"q1",d:5,qual:"FIRST",q:"A user reports no network connectivity on a desktop that worked yesterday. Which of the following should the technician do FIRST?",o:["Verify the cable is connected and the link light is on","Replace the workstation's NIC","Reinstall the NIC driver","Escalate to the network team"],a:0,x:"Every option could eventually be correct. FIRST means the quickest, least invasive check, which is 'question the obvious' in the methodology. Replacing hardware or escalating before checking the link light wastes time."},
 {id:"q2",d:4,qual:"BEST",q:"A security audit flags twelve switch ports that are patched to empty offices. Which of the following is the BEST way to prevent unauthorized devices from using those ports?",o:["Administratively disable the unused ports","Enable port security with a one-MAC limit","Move the ports to the native VLAN","Label the ports in the documentation"],a:0,x:"Port security is defensible, but it still lets one unknown device connect. For ports nobody should use, BEST is to shut them down. Moving them to the native VLAN makes things worse."},
 {id:"q3",d:5,qual:"MOST likely",q:"Users on the third floor receive 169.254.x.x addresses. Users on every other floor are working normally. Which of the following is the MOST likely cause?",o:["The DHCP server is offline","The DHCP relay (IP helper) is missing for the third-floor VLAN","The DNS server is unreachable","One workstation has a faulty patch cable"],a:1,x:"APIPA addresses mean DHCP failed. If the DHCP server were down, every floor would be affected. A problem limited to one VLAN points to the relay for that VLAN. One bad cable would not hit a whole floor."},
 {id:"q4",d:1,qual:"MINIMUM",q:"An administrator needs a subnet that supports 25 hosts and wastes the MINIMUM number of addresses. Which prefix should be used?",o:["/27","/26","/28","/25"],a:0,x:"/26 and /25 also fit 25 hosts, but they waste more. /27 gives 30 usable hosts, the smallest subnet that still fits. /28 gives only 14."},
 {id:"q5",d:5,qual:"NEXT",q:"A technician has confirmed that a misconfigured VLAN assignment is causing an outage. Which of the following should the technician do NEXT?",o:["Change the VLAN assignment immediately","Establish a plan of action and identify potential effects","Document findings and lessons learned","Verify full system functionality"],a:1,x:"The theory is confirmed (step 3), so step 4 is to plan the fix and identify potential effects. 'Change it immediately' is tempting but skips a step, and CompTIA tests that."},
 {id:"q6",d:3,qual:"BEST",q:"Administrators must manage switches that are reachable only from an isolated management network. Which of the following is the BEST way to provide secure remote access?",o:["A hardened jump box on the management network","Allow SSH to the switches directly from the internet","Enable HTTP management on each switch","Use Telnet through a split-tunnel VPN"],a:0,x:"Several options technically provide access. A jump box gives one controlled, audited entry point into the management network. The others widen exposure or use cleartext."},
 {id:"q7",d:3,qual:"BEST",q:"A new branch office with 40 employees needs a permanent, always-on encrypted connection to headquarters. Which of the following BEST meets this requirement?",o:["Client-to-site VPN on every PC","Site-to-site VPN between the two firewalls","Clientless VPN through a web portal","Split-tunnel VPN for each user"],a:1,x:"Client-to-site would work, but it is per user and per device. For a whole office that is always connected, BEST is a site-to-site VPN between the edge devices."},
 {id:"q8",d:5,qual:"MOST likely",q:"Wi-Fi works well all morning, but during a 120-person all-hands meeting in one room served by a single AP, throughput drops sharply. Which of the following is the MOST likely cause?",o:["Too many clients contending for one AP","An incorrect SSID","DHCP lease time set too long","A duplex mismatch on the AP uplink"],a:0,x:"The trigger is how many people are in the room. Client contention and capacity limits on a single AP explain it. A duplex mismatch or SSID issue would not depend on how many people are in the room."},
 {id:"q9",d:2,qual:"BEST",q:"An office desk has a VoIP phone with a PC daisy-chained behind it on one switch port. Which of the following BEST separates the voice and data traffic?",o:["Configure a voice VLAN on the access port","Run an 802.1Q trunk carrying all VLANs to the phone","Enable port mirroring","Disable PoE on the port"],a:0,x:"A full trunk to an endpoint technically works but exposes every VLAN. A voice VLAN on the access port is the intended, BEST design."},
 {id:"q10",d:4,qual:"BEST",q:"A company must host a public web server while keeping it isolated from the internal LAN. Which of the following BEST meets this need?",o:["Place the server in a screened subnet","Put the server on the internal VLAN and forward port 443","Host it on an employee workstation with a host firewall","Put it on the guest Wi-Fi network"],a:0,x:"Port forwarding to the LAN 'works' but puts a public-facing system inside the trusted zone. A screened subnet (DMZ) separates untrusted from trusted."},
 {id:"q11",d:5,qual:"FIRST",q:"A user says the network is slow. Which of the following should the technician do FIRST?",o:["Ask the user what is slow and when it started","Run a packet capture on the core switch","Replace the user's patch cable","Reboot the core router"],a:0,x:"Gathering information is the first part of step 1. A packet capture can help later, but without knowing what is slow and since when, you don't know where to capture."},
 {id:"q12",d:5,qual:"FIRST",q:"A newly installed fiber link between two buildings shows no link light on either end. Which of the following should the technician check FIRST?",o:["Whether the transmit and receive strands are swapped at one end","Replace both SFP transceivers","Hire a contractor to run an OTDR test","Change the spanning-tree priority on both switches"],a:0,x:"TX/RX transposed is the most common fault on a new fiber run and takes seconds to check by swapping the pair. Replacing transceivers might work too, but it costs more and comes after the quick check."},
 {id:"q13",d:3,qual:"FIRST",q:"An approved change window has started for a switch firmware upgrade. Which of the following should the administrator do FIRST?",o:["Back up the current configuration and firmware image","Upload the new firmware image","Reload the switch","Tell users the upgrade is complete"],a:0,x:"A backup gives you a way back if the upgrade fails. Uploading the image is the obvious next task, but doing it first leaves no rollback."},
 {id:"q14",d:4,qual:"FIRST",q:"A technician suspects a workstation is infected with malware that is spreading to other hosts. Which of the following should the technician do FIRST?",o:["Disconnect the workstation from the network","Run a full antivirus scan","Reimage the workstation","Remind the user about safe browsing"],a:0,x:"Containment comes first so the infection stops spreading. A scan and a reimage come after the host is isolated."},
 {id:"q15",d:5,qual:"FIRST",q:"After a storm, an entire building lost network access at once. Which of the following should the technician check FIRST?",o:["Power to the building's network closet and the UPS status","The DHCP server's lease table","Recent firewall rule changes","The DNS zone records"],a:0,x:"Everything failing at the same moment after a storm points at power, and power is the quickest thing to check. DHCP or DNS problems would not take down every link at once."},
 {id:"q16",d:2,qual:"FIRST",q:"A new access point connected to a PoE switch port does not power on. Which of the following should the technician check FIRST?",o:["Whether PoE is enabled on that port and the switch has power budget left","The AP's SSID settings","The wireless channel plan","The RADIUS server configuration"],a:0,x:"No power is a Layer 1 problem. SSID, channel, and RADIUS settings only matter once the AP is running."},
 {id:"q17",d:5,qual:"NEXT",q:"A technician has identified the problem and established a theory of probable cause. Which of the following should the technician do NEXT?",o:["Test the theory to determine the cause","Establish a plan of action","Document findings and lessons learned","Verify full system functionality"],a:0,x:"Step 3 follows step 2: test the theory. Planning the fix (step 4) only makes sense once the theory is confirmed."},
 {id:"q18",d:5,qual:"NEXT",q:"A technician tested a theory of probable cause, and the test did not confirm it. Which of the following should the technician do NEXT?",o:["Establish a new theory or escalate","Implement the solution anyway","Document findings and close the ticket","Verify full system functionality"],a:0,x:"When a theory is not confirmed, step 3 says to establish a new theory or escalate. Implementing a fix for an unconfirmed cause is guessing."},
 {id:"q19",d:5,qual:"NEXT",q:"A technician replaced a failed switch, and users can connect again. Which of the following should the technician do NEXT?",o:["Verify full system functionality and implement preventive measures","Document findings, actions, and outcomes","Establish a theory of probable cause","Question the users again"],a:0,x:"Step 6 (verify, and add preventive measures) comes before step 7 (document). Documentation is the runner-up, but it is the last step."},
 {id:"q20",d:5,qual:"NEXT",q:"A technician verified that the network works after fixing a routing problem and added monitoring for that route. Which of the following should the technician do NEXT?",o:["Document findings, actions, outcomes, and lessons learned","Test the theory of probable cause","Question users about the symptoms","Escalate the ticket"],a:0,x:"Steps 1 through 6 are done. The only step left is step 7: document."},
 {id:"q21",d:5,qual:"NEXT",q:"A technician has a confirmed plan to fix an outage, but the fix needs a firewall change, and another team manages the firewall. Which of the following should the technician do NEXT?",o:["Escalate to the team that manages the firewall","Make the change with a shared administrator password","Document the issue and close the ticket","Establish a new theory of probable cause"],a:0,x:"Step 5 is 'implement the solution or escalate as necessary.' The change belongs to another team, so escalate. Using someone else's credentials breaks policy even if it would work."},
 {id:"q22",d:5,qual:"NEXT",q:"A technician has questioned users, identified the symptoms, and found out what changed recently. Which of the following should the technician do NEXT?",o:["Establish a theory of probable cause","Test the theory","Implement the solution","Document findings"],a:0,x:"With information gathered (step 1), step 2 is establishing a theory, starting with the obvious. You can't test a theory you haven't formed."},
 {id:"q23",d:2,qual:"BEST",q:"Two buildings 1.5 km apart need a 10 Gbps link. Which of the following cable types is BEST?",o:["Single-mode fiber","Multimode fiber","Cat 6a twisted pair","Coaxial cable"],a:0,x:"Single-mode fiber carries 10 Gbps for many kilometers. Multimode is the runner-up, but at 10 Gbps it reaches only a few hundred meters. Cat 6a stops at 100 m."},
 {id:"q24",d:4,qual:"BEST",q:"Each employee must sign in to the corporate Wi-Fi with their own account. Which of the following BEST meets this requirement?",o:["WPA3-Enterprise with 802.1X and a RADIUS server","WPA3-Personal with a long passphrase","MAC address filtering","Hiding the SSID"],a:0,x:"Enterprise mode authenticates each user through 802.1X. WPA3-Personal is strong encryption, but everyone shares one passphrase, so it fails the per-user requirement."},
 {id:"q25",d:5,qual:"MOST likely",q:"After a new cable run, one workstation links at 100 Mbps instead of 1 Gbps. Other workstations on the same switch link at 1 Gbps. Which of the following is the MOST likely cause?",o:["A pair in the new cable is not terminated correctly","The switch has run out of PoE budget","The DHCP scope is full","The workstation has the wrong DNS server"],a:0,x:"Gigabit needs all four pairs; with a bad pair, many devices fall back to 100 Mbps. The problem is limited to the new cable, which matches the scope."},
 {id:"q26",d:5,qual:"MOST likely",q:"Users can reach websites by IP address but not by name. Which of the following is the MOST likely cause?",o:["The DNS server is unreachable or misconfigured","The default gateway is wrong","The DHCP server is offline","There is a duplex mismatch"],a:0,x:"Reaching sites by IP proves routing and the gateway work. Only name resolution fails, which is DNS."},
 {id:"q27",d:5,qual:"MOST likely",q:"A cable was added between two switches today. Now users report intermittent outages, the switch log shows MAC addresses flapping between ports, and CPU is very high. Which of the following is the MOST likely cause?",o:["A switching loop, because spanning tree is disabled or misconfigured","DHCP scope exhaustion","A failing power supply","An expired TLS certificate"],a:0,x:"A new redundant link plus MAC flapping and high CPU is the signature of a Layer 2 loop. STP should block the extra path."},
 {id:"q28",d:5,qual:"MOST likely",q:"In a busy apartment building, a laptop shows full Wi-Fi signal but very slow throughput. A Wi-Fi analyzer shows many networks on channel 6. Which of the following is the MOST likely cause?",o:["Co-channel interference from neighboring networks on the same channel","The laptop is too far from the AP","An incorrect WPA passphrase","An IP address conflict"],a:0,x:"Full signal rules out distance. Many networks sharing channel 6 must take turns on the air, which cuts throughput."},
 {id:"q29",d:5,qual:"MOST likely",q:"Right after a technician gave a new printer a static IP address, a user's PC reports an IP address conflict. Which of the following is the MOST likely cause?",o:["The printer's static address is inside the DHCP scope and was already leased","The printer has the wrong subnet mask","DNS has a stale record for the printer","The printer's switch port is in the wrong VLAN"],a:0,x:"A conflict means two devices claim the same address. Static addresses must be outside the DHCP scope (or reserved), or the server can hand the same address to a PC."},
 {id:"q30",d:1,qual:"MINIMUM",q:"Without using /31, which subnet mask provides the MINIMUM number of addresses for a point-to-point link between two routers?",o:["255.255.255.252 (/30)","255.255.255.248 (/29)","255.255.255.240 (/28)","255.255.255.0 (/24)"],a:0,x:"A /30 has 4 addresses and 2 usable, exactly enough for two router interfaces. A /29 also works but wastes 4 more addresses."},
 {id:"q31",d:1,qual:"MINIMUM",q:"A department needs 100 host addresses in one subnet. Which prefix wastes the MINIMUM number of addresses?",o:["/25","/24","/26","/23"],a:0,x:"A /25 gives 126 usable hosts. A /24 works but wastes 128 more addresses, and a /26 (62 hosts) is too small."},
 {id:"q32",d:2,qual:"MINIMUM",q:"Which is the MINIMUM cable category that supports 10GBASE-T over the full 100 meters?",o:["Cat 6a","Cat 6","Cat 5e","Cat 8"],a:0,x:"Cat 6a supports 10GBASE-T to 100 m. Cat 6 does 10 Gbps only to about 55 m. Cat 8 works but is more than needed."},

 {id:"b5",d:5,q:"A user reports intermittent connectivity. The Cat 6 run from the patch panel to the jack is 112 m. Which of the following is the MOST likely cause?",o:["Attenuation","Crosstalk","Duplex mismatch","Incorrect VLAN"],a:0,x:"Past 100 m the signal weakens (attenuation), causing errors and drops."},
 {id:"b6",d:2,q:"A technician accidentally connected two access switches with a second cable, but the network kept working normally. Which protocol MOST likely prevented an outage?",o:["STP","LACP","LLDP","802.1Q"],a:0,x:"Spanning Tree blocks redundant Layer 2 paths to prevent loops and broadcast storms."},
 {id:"b7",d:2,q:"VLANs 10, 20, and 30 must cross a single link between two switches. What should be configured on the interconnecting ports?",o:["An 802.1Q trunk","Access ports in VLAN 1","Port mirroring","A native VLAN of 30"],a:0,x:"An 802.1Q trunk tags frames so multiple VLANs share one link."},
 {id:"b8",d:5,q:"A technician has gathered information, duplicated the problem, and identified the symptoms. What should the technician do NEXT?",o:["Establish a theory of probable cause","Implement the solution","Verify full system functionality","Document findings"],a:0,x:"Step 1 is complete, so step 2 is to establish a theory of probable cause."},
 {id:"b9",d:1,q:"Developers want to deploy custom code without managing the OS, patching, or runtime. Which cloud model BEST fits?",o:["PaaS","IaaS","SaaS","DaaS"],a:0,x:"With PaaS the provider runs the platform and the customer manages only the app and its data."},
 {id:"b10",d:1,q:"Which connector should be ordered for patch cables that plug into new SFP+ modules?",o:["LC","SC","ST","MPO"],a:0,x:"LC is the standard connector for SFP and SFP+. MPO is for QSFP parallel optics."},
 {id:"b11",d:3,q:"A monitoring server must poll switches for interface statistics through a firewall. Which port must be allowed?",o:["UDP 161","UDP 514","UDP 123","TCP 445"],a:0,x:"SNMP polling uses UDP 161 (traps use 162). 514 is syslog, 123 is NTP."},
 {id:"b12",d:2,q:"Which routing protocol exchanges routes between ISPs and autonomous systems on the internet?",o:["BGP","OSPF","EIGRP","Static routing"],a:0,x:"BGP is the path-vector protocol used between autonomous systems. OSPF and EIGRP are interior protocols."},
 {id:"b13",d:2,q:"A router learns 10.50.0.0/16 from a static route, OSPF, and EIGRP, all with the same prefix length. Which route is installed?",o:["The static route","The OSPF route","The EIGRP route","All three, load-balanced"],a:0,x:"With equal prefix lengths, the lowest administrative distance wins: static 1, EIGRP 90, OSPF 110."},
 {id:"b14",d:2,q:"New APs should avoid congestion from neighboring tenants by using the band with the most channels. Which band should be configured?",o:["6 GHz","5 GHz","2.4 GHz","2.4 GHz with 40 MHz channels"],a:0,x:"6 GHz offers the most channels and has no legacy devices."},
 {id:"b15",d:4,q:"Wired workstations must authenticate against RADIUS before the switch port passes any user traffic. Which standard should be enabled?",o:["802.1X","802.1Q","802.3ad","802.11h"],a:0,x:"802.1X is port-based network access control using EAP and RADIUS."},
 {id:"b16",d:5,q:"Users on VLAN 20 can reach each other but cannot reach other VLANs or the internet. VLAN 10 is fine. Which of the following is the MOST likely cause?",o:["A missing or wrong default gateway for VLAN 20","A switching loop on VLAN 20","A DNS server failure","A duplex mismatch on the shared uplink"],a:0,x:"Communication within the VLAN works, so only crossing Layer 3 fails. That points to VLAN 20's gateway."},
 {id:"b17",d:5,q:"A laptop shows the address 169.254.37.112 with mask 255.255.0.0. Which of the following is the MOST likely cause?",o:["DHCP is unreachable or out of leases","The DNS server is wrong","The subnet mask was mistyped","The default gateway is down"],a:0,x:"169.254.0.0/16 is APIPA, which the OS self-assigns when DHCP fails."},
 {id:"b18",d:3,q:"Which document shows the exact rack and rack-unit position of a switch?",o:["Physical network diagram / rack diagram","Logical network diagram","Network baseline","Standard operating procedure"],a:0,x:"Physical and rack diagrams show location. Logical diagrams show addressing and traffic flow."},
 {id:"b19",d:3,q:"Which metric is the average time it takes to restore a failed device to service?",o:["MTTR","MTBF","RTO","RPO"],a:0,x:"MTTR = mean time to repair. MTBF = time between failures, RTO = maximum acceptable downtime, RPO = maximum acceptable data loss."},
 {id:"b20",d:2,q:"Clients use one gateway IP address that must stay reachable if either of two routers fails. Which of the following provides this?",o:["FHRP with a virtual IP","LACP","STP","Router subinterfaces"],a:0,x:"A first hop redundancy protocol shares a virtual IP between routers."},
 {id:"b21",d:1,q:"Which BEST describes zero trust?",o:["Every request is verified regardless of network location","Devices inside the perimeter are trusted","One perimeter firewall inspects everything","Users log in once and access everything"],a:0,x:"Zero trust removes implicit trust based on location, so every request is verified."},
 {id:"b22",d:4,q:"An unauthorized device on the LAN is handing out IP addresses. Which switch feature BEST prevents this?",o:["DHCP snooping","Port mirroring","Jumbo frames","Flow control"],a:0,x:"DHCP snooping drops DHCP server replies that arrive on untrusted ports."},
 {id:"b23",d:4,q:"A capture shows a host sending unsolicited ARP replies that claim the gateway's IP maps to its own MAC. Which attack is this?",o:["ARP poisoning (on-path)","VLAN hopping","DNS poisoning","Evil twin"],a:0,x:"Spoofed ARP replies redirect traffic through the attacker."},
 {id:"b24",d:5,q:"Which command shows each hop to a cloud app, with latency, from a Windows PC?",o:["tracert","netstat","nslookup","ipconfig"],a:0,x:"tracert increments the TTL to reveal each router hop."},
 {id:"b25",d:1,q:"Which is the MINIMUM cable category for 10GBASE-T at 100 m?",o:["Cat 6a","Cat 5e","Cat 6","Cat 3"],a:0,x:"Cat 6a. Cat 6 does 10 Gb only to about 55 m."},
 {id:"b26",d:1,q:"Which technology centralizes the control plane in a controller that programs many switches through APIs?",o:["SDN","VXLAN","NFV","SASE"],a:0,x:"Software-defined networking separates the control plane from the data plane."},
 {id:"b27",d:1,q:"A data center must stretch Layer 2 across a routed fabric and needs more than 4,094 segments. Which of the following should be used?",o:["VXLAN","GRE","IPsec","802.1Q"],a:0,x:"VXLAN encapsulates frames in UDP with a 24-bit VNI (about 16 million segments)."},
 {id:"b28",d:5,q:"Break-room Wi-Fi on 2.4 GHz drops for a minute at a time around noon each day. Which of the following is the MOST likely cause?",o:["Microwave oven interference","Attenuation from walls","Insufficient coverage","Wrong SSID"],a:0,x:"The noon timing and the 2.4 GHz band point to a microwave oven. Coverage problems would happen all day."},
 {id:"b29",d:3,q:"Log timestamps differ by several minutes across devices. What should be configured on every device?",o:["NTP","Syslog","SNMP","SIEM"],a:0,x:"NTP synchronizes clocks so logs can be correlated."},
 {id:"b30",d:3,q:"IPv6 hosts build their own addresses from router advertisements with no DHCP server. What is this called?",o:["SLAAC","DHCP relay","NAT64","APIPA"],a:0,x:"Stateless address autoconfiguration (SLAAC)."},
 {id:"b31",d:1,q:"Which firewall capability automatically allows return traffic for outbound sessions?",o:["Stateful inspection","Stateless ACL","IDS","Content filtering"],a:0,x:"A stateful firewall tracks sessions and permits matching return traffic."},
 {id:"b32",d:5,q:"Two campus buildings 2 km apart need 10 Gb. Which media should be selected?",o:["Single-mode fiber","Multimode fiber","Cat 6a","Coax"],a:0,x:"Single-mode fiber reaches kilometers. Multimode reaches only about 300–400 m at 10 Gb."},
 {id:"b33",d:5,q:"A switch port shows climbing CRC and input errors while utilization stays low. Which of the following is the MOST likely cause?",o:["Damaged cable or faulty transceiver","Broadcast storm","VLAN mismatch","DNS failure"],a:0,x:"CRC errors mean corrupted frames, which is a physical-layer problem."},
 {id:"b34",d:1,q:"What is the broadcast address for 172.16.41.77/22?",o:["172.16.43.255","172.16.41.255","172.16.47.255","172.16.44.255"],a:0,x:"/22 = block of 4 in the third octet. 41 falls in 40–43, so the broadcast is 172.16.43.255."},
 {id:"b35",d:3,q:"An engineer plans a core switch firmware upgrade. What should the engineer do FIRST?",o:["Submit a change request with a rollback plan","Email the users","Update the network diagram","Update the baseline"],a:0,x:"Change management means approval, with a rollback plan, before any work begins."},
 {id:"b36",d:4,q:"Disabling unused ports, changing default credentials, and replacing Telnet with SSH BEST describes which of the following?",o:["Device hardening","Segmentation","Patch management","Key management"],a:0,x:"Hardening reduces the attack surface."},
 {id:"b37",d:5,q:"Which tool confirms a new patch cable's wire map before it is put into service?",o:["Cable tester","Toner","Visual fault locator","Wi-Fi analyzer"],a:0,x:"A cable tester checks continuity, shorts, and split pairs."},
 {id:"b38",d:5,q:"A user plugs a small hub into a wall jack, and the switch port goes err-disabled. Which of the following is the MOST likely cause?",o:["Port security violation","STP root change","Native VLAN mismatch","Speed mismatch"],a:0,x:"The extra MAC addresses exceeded the port security limit, so the port shut down."},
 {id:"b39",d:3,q:"Users say the network feels slower than last month. What should current metrics be compared against?",o:["The network baseline","The change log","The audit log","The SLA"],a:0,x:"A baseline records normal performance for comparison."},
 {id:"b40",d:2,q:"Four 1 Gb links between two switches should act as one logical link with redundancy. What should be configured?",o:["Link aggregation (LACP)","STP","802.1Q trunking","Port mirroring"],a:0,x:"LACP bundles physical links into one logical link."},
 {id:"b41",d:2,q:"Hundreds of private hosts share one public IP, with each connection identified by a unique source port. What is this?",o:["PAT","Static NAT","NAT64","DHCP relay"],a:0,x:"Port Address Translation (NAT overload)."},
 {id:"b42",d:4,q:"An attacker floods a switch with fake source MACs until the switch floods frames out every port. Which attack is this?",o:["MAC flooding","ARP spoofing","VLAN hopping","DNS spoofing"],a:0,x:"MAC flooding fills the CAM table, so the switch acts like a hub."},
 {id:"b43",d:4,q:"Full-disk encryption on a laptop protects data in which state?",o:["Data at rest","Data in transit","Data locality","Data in motion"],a:0,x:"Stored data is data at rest. TLS protects data in transit."},
 {id:"b44",d:3,q:"Which DNS record maps a hostname to an IPv6 address?",o:["AAAA","A","CNAME","PTR"],a:0,x:"A = IPv4, AAAA = IPv6, CNAME = alias, PTR = reverse lookup."},
 {id:"b45",d:3,q:"Admins need switch access even when the production network is down. Which of the following provides this?",o:["Out-of-band management","In-band SSH","Split-tunnel VPN","SNMP traps"],a:0,x:"Out-of-band management (for example, a console server) uses a separate path."},
 {id:"b46",d:1,q:"In a cloud VPC, which feature applies virtual firewall rules to instances?",o:["Network security group","Internet gateway","NAT gateway","VPN gateway"],a:0,x:"Network security groups filter inbound and outbound traffic to cloud resources."},
 {id:"b47",d:5,q:"After a user patches two wall jacks together, switch CPU spikes and MAC addresses flap between ports. Which of the following is the MOST likely cause?",o:["A switching loop","A duplex mismatch","DHCP exhaustion","DNS misconfiguration"],a:0,x:"A loop causes a broadcast storm and MAC flapping. STP should block it, so also check whether STP is enabled."}

function modulesForMastery(){ return MODULES.filter(m=>!m.menu); }
const MASTER_MIN=.9;
function expertCount(){ return modulesForMastery().filter(m=>{ const ms=mastery(m.id); return ms&&ms.v+1e-9>=MASTER_MIN; }).length; }
function gmCount(){ return modulesForMastery().filter(m=>{ const ms=mastery(m.id); return ms&&ms.v+1e-9>=1; }).length; }
function gmAll(){ return gmCount()===modulesForMastery().length; }

/* options: array of strings; answer: index into options (pre-shuffle) */
function choiceQ(area,cfg){
  const n=cfg.options.length;
  let order=[...Array(n).keys()];
  if(cfg.shuffle!==false) shuffle(order);
  const labels = cfg.labels || "ABCDEFG".split("");
  const inst = mode==="instructor" && !cfg.forceStudent;
  const deferred = !!cfg.deferred && !inst;
  area.innerHTML=`<div class="card">
    ${cfg.meta?`<div class="q-meta">${cfg.meta}</div>`:""}
    <div class="q-prompt">${cfg.prompt}</div>
    <div class="opts ${cfg.grid?'grid7':''} ${cfg.optHtml?'picopts':''}">${order.map((oi,i)=>`<button class="opt" data-i="${oi}" ${cfg.optHtml?`aria-label="${esc(labels[i])}: picture ${i+1}"`:""}><span class="k">${esc(cfg.labels?labels[oi]:labels[i])}</span><span class="tx ${cfg.mono?'mono':''}">${cfg.optHtml?cfg.optHtml[oi]:esc(cfg.options[oi])}</span></button>`).join("")}</div>
    <div class="q-actions">
      ${inst?`<button class="btn" data-act="reveal">Reveal answer</button>`:""}
      <button class="btn ${inst?'ghost':''}" data-act="next" ${deferred?'disabled':'hidden'}>${cfg.nextLabel||"Next"}</button>
      <span class="kbd">Keys: ${cfg.labels?'number':'A–D'} to answer · Enter for next</span>
    </div>
    <div class="fb" hidden></div></div>`;
  const btns=[...area.querySelectorAll(".opt")];
  const fb=area.querySelector(".fb"), nextB=area.querySelector('[data-act="next"]'), revB=area.querySelector('[data-act="reveal"]');
  let done=false, chosen=null;
  function reveal(sel){
    done=true;
    btns.forEach(b=>{ b.disabled=true; const i=+b.dataset.i; if(i===cfg.answer) b.classList.add("correct"); else if(sel!==null && i===sel && !inst) b.classList.add("wrong"); });
    const ok = sel===cfg.answer;
    fb.innerHTML = (inst?`<div class="v ok">Answer: ${esc(cfg.options[cfg.answer])}</div>`:`<div class="v ${ok?'ok':'bad'}">${ok?'Correct.':'Not quite. Correct answer: '+esc(cfg.options[cfg.answer])}</div>`) + (cfg.explain?`<p>${cfg.explain}</p>`:"");
    fb.hidden=false; nextB.hidden=false; if(revB) revB.hidden=true;
    if(!inst && cfg.onResult) cfg.onResult(ok);
    nextB.focus({preventScroll:true});
  }
  function choose(i){
    if(done) return;
    if(inst || deferred){
      btns.forEach(b=>b.classList.toggle("picked", +b.dataset.i===i));
      chosen=i; if(deferred){ nextB.disabled=false; cfg.onSelect&&cfg.onSelect(i); }
      return;
    }
    reveal(i);
  }
  btns.forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));
  if(revB) revB.addEventListener("click",()=>reveal(chosen));
  nextB.addEventListener("click",()=>{ if(deferred && chosen===null) return; cfg.onNext&&cfg.onNext(chosen); });
  curKeys=e=>{
    const k=e.key.toUpperCase();
    if(k==="ENTER"){ e.preventDefault(); if(inst && !done){ reveal(chosen); } else if(!nextB.hidden && !nextB.disabled) nextB.click(); return; }
    let idx=-1;
    if(cfg.labels){ idx = cfg.labels.findIndex(l=>l[0]===k); }
    else { const L="ABCDEFG".indexOf(k); const N="1234567".indexOf(k); idx = L>=0?L:N; if(idx>=0 && idx<order.length) idx=order[idx]; else idx=-1; }
    if(idx>=0 && idx<n) choose(idx);
  };
}

function textQ(area,cfg){
  const inst = mode==="instructor";
  area.innerHTML=`<div class="card">
    ${cfg.meta?`<div class="q-meta">${cfg.meta}</div>`:""}
    <div class="q-prompt">${cfg.prompt}</div>
    ${inst?"":`<input class="ans" id="ansbox" autocomplete="off" spellcheck="false" placeholder="${esc(cfg.placeholder||'Your answer')}" aria-label="Your answer">`}
    <div class="q-actions">
      ${inst?`<button class="btn" data-act="reveal">Reveal answer</button>`:`<button class="btn" data-act="check">Check</button><button class="btn ghost" data-act="skip">Show me</button>`}
      <button class="btn ghost" data-act="next" hidden>Next problem</button>
      <span class="kbd">Enter to check · Enter again for next</span>
    </div><div class="fb" hidden></div></div>`;
  const inp=area.querySelector("#ansbox"), fb=area.querySelector(".fb"), nextB=area.querySelector('[data-act="next"]');
  let done=false;
  function finish(ok,gaveUp){
    done=true;
    area.querySelectorAll('[data-act="check"],[data-act="skip"],[data-act="reveal"]').forEach(b=>b.hidden=true);
    if(inp){ inp.disabled=true; inp.classList.add(ok?"okb":"badb"); }
    const head = inst||gaveUp ? `<div class="v ok">Answer: <span class="mono">${esc(cfg.answer)}</span></div>` : `<div class="v ${ok?'ok':'bad'}">${ok?'Correct.':'Not quite. Answer: <span class="mono">'+esc(cfg.answer)+'</span>'}</div>`;
    fb.innerHTML = head + `<ol class="steps">${cfg.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
    fb.hidden=false; nextB.hidden=false; nextB.focus({preventScroll:true});
    if(!inst && cfg.onResult) cfg.onResult(ok);
  }
  const chk=()=>{ if(done||!inp.value.trim()) return; finish(cfg.check(inp.value.trim()),false); };
  area.querySelector('[data-act="check"]')?.addEventListener("click",chk);
  area.querySelector('[data-act="skip"]')?.addEventListener("click",()=>finish(false,true));
  area.querySelector('[data-act="reveal"]')?.addEventListener("click",()=>finish(true,true));
  nextB.addEventListener("click",()=>cfg.onNext());
  curKeys=e=>{ if(e.key!=="Enter") return; e.preventDefault(); if(!done){ if(inst) finish(true,true); else chk(); } else nextB.click(); };
  if(inp) setTimeout(()=>inp.focus({preventScroll:true}),0);
}

/* PBQ: a PBQ is mastered after PBQ_NEED attempts (different random scenarios) scoring PBQ_CLEAR or better. Exams: the average of the last EXAM_NEED full-size exams (20+ points), missing ones count as 0. */
const PBQ_NEED=3, PBQ_CLEAR=0.9, EXAM_NEED=3, EXAM_FULL_MIN=20;
function pbqClears(id){ return (P.pbq[id]||[]).filter(x=>x.total&&x.score/x.total>=PBQ_CLEAR).length; }
/* attempts at 70-89% earn half credit toward the remaining slots, so steady improvement shows; only 90%+ attempts can finish a PBQ */
function pbqProgress(id){ const h=P.pbq[id]||[]; const c=pbqClears(id); if(c>=PBQ_NEED) return 1; const near=h.filter(x=>x.total&&x.score/x.total>=0.7&&x.score/x.total<PBQ_CLEAR).length; return Math.min(c+0.5*Math.min(near,PBQ_NEED-c),PBQ_NEED-0.5)/PBQ_NEED; }
function mastery(id){
  const it=P.items[id]||{};
  const frac=(total)=>{ const c=Object.values(it).filter(Boolean).length; return {v:total?c/total:0,cap:`${c} of ${total} items correct`}; };
  switch(id){
    case "acro":{ const l=acroActive(); const n=acroMastered(l); return {v:n/l.length,cap:`${n} of ${l.length} acronyms mastered`}; }
    case "pbq":{ const st=PBQS.map(q=>pbqClears(q.id)); const done=st.filter(c=>c>=PBQ_NEED).length; const v=PBQS.reduce((a,q)=>a+pbqProgress(q.id),0)/PBQS.length; return {v,cap:`${done} of ${PBQS.length} PBQs mastered`}; }
    case "ports":{ const n=PORTS.filter(portMastered).length; return {v:n/PORTS.length,cap:`${n} of ${PORTS.length} ports mastered`}; }
    case "subnet":{ const pr=snPrefixes(); const done=pr.reduce((a,p)=>a+snDone(p),0); const n=pr.filter(snMastered).length; return {v:done/(pr.length*SN_SKILLS.length),cap:`${n} of ${pr.length} prefixes mastered`}; }
    case "osi":{ const L=osiLayerState(); const done=L.filter(x=>x.mastered).length; const v=L.reduce((a,x)=>a+(x.mastered?1:x.c/x.n),0)/7; return {v,cap:`${done} of 7 layers mastered`}; }
    case "qualifier":{ const Q=qualState(); const done=Q.filter(x=>x.mastered).length; const v=Q.reduce((a,x)=>a+Math.min(x.c,QUAL_NEED)/QUAL_NEED,0)/Q.length; return {v,cap:`${done} of ${Q.length} qualifiers mastered`}; }
    case "tools":{ const T=toolState(); const done=T.filter(x=>x.mastered).length; const v=T.reduce((a,x)=>a+Math.min(x.c,TOOL_NEED)/TOOL_NEED,0)/T.length; return {v,cap:`${done} of ${T.length} tools and commands mastered`}; }
    case "security":{ const done=SEC.filter(x=>secMastered(x.id)).length; const v=SEC.reduce((a,x)=>a+(secMastered(x.id)?1:Math.min(Object.keys(secItemKeys(x.id)).length,SEC_NEED)/SEC_NEED),0)/SEC.length; return {v,cap:`${done} of ${SEC.length} terms mastered`}; }
    case "media":{ const G=mediaGroupState(); const done=G.filter(x=>x.mastered).length; const v=G.reduce((a,x)=>a+(x.mastered?1:x.c/x.n),0)/G.length; return {v,cap:`${done} of ${G.length} topics mastered`}; }
    case "ladder":{ const L=ladderState(); const done=L.filter(x=>x.mastered).length; const v=L.reduce((a,x)=>a+Math.min(x.c,LADDER_NEED)/LADDER_NEED,0)/7; return {v,cap:`${done} of 7 steps mastered`}; }
    case "exam":{ const full=P.exams.filter(e=>e.total>=EXAM_FULL_MIN).slice(-EXAM_NEED); if(!full.length) return {v:0,cap:P.exams.length?"Take a 20- or 40-question exam to count":"No exams yet"}; const v=full.reduce((a,e)=>a+e.score/e.total,0)/EXAM_NEED; return {v,cap:`Last ${full.length} of ${EXAM_NEED} full exams · avg ${pct(full.reduce((a,e)=>a+e.score/e.total,0)/full.length)}%`}; }
    default: return null;
  }
}
